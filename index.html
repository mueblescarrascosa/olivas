<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#f6f5ef;--card:#fff;--ink:#22261c;--mut:#6b7060;--line:#e2e0d4;--olv:#4b5d2a;--olv2:#6f8a3c;--ok:#2f8a3e;--warn:#c58a0b;--bad:#c0392b;--sh:0 1px 3px rgba(0,0,0,.08)}
@media (prefers-color-scheme:dark){:root{--bg:#171a13;--card:#21251b;--ink:#ecebe3;--mut:#a3a796;--line:#353a2c;--olv:#9bb55f;--olv2:#b5cc7c;--sh:none}}
*{box-sizing:border-box}
body{margin:0;font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:80px}
header{position:sticky;top:0;z-index:5;background:var(--olv);color:#fff;padding:10px 16px;display:flex;align-items:center;gap:10px}
@media (prefers-color-scheme:dark){header{color:#171a13}}
header h1{font-size:18px;margin:0;flex:1}
header select{background:transparent;color:inherit;border:1px solid currentColor;border-radius:6px;padding:4px 6px;font:inherit;width:auto}
header select option{color:#000}
main{max-width:900px;margin:0 auto;padding:12px 16px}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;z-index:6;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;color:var(--mut);padding:10px 2px;font:12px system-ui;cursor:pointer}
nav button.on{color:var(--olv);font-weight:700;box-shadow:inset 0 3px 0 var(--olv)}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:0 0 12px;box-shadow:var(--sh)}
.card h2{font-size:16px;margin:0 0 8px;display:flex;align-items:center;gap:8px}
.card h2 .sp{flex:1}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-bottom:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.kpi b{display:block;font-size:20px}
.kpi span{color:var(--mut);font-size:12px}
.wid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:12px}
@media(min-width:900px){.wid{grid-template-columns:repeat(6,1fr)}}
.wg.ancho{grid-column:span 2}
.spark{display:block;width:100%;height:34px;margin-top:4px}
.wg{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;min-height:86px;display:flex;flex-direction:column;gap:2px}
.wg:hover{border-color:var(--olv)}
.wg .wt{color:var(--mut);font-size:12px;display:flex;justify-content:space-between;gap:6px}
.wg .wt span:nth-child(2){overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.wg .wv{font-size:22px;font-weight:700;line-height:1.15}
.wg .wv .ic{font-size:24px;margin-right:4px}
.wg .ws{font-size:12.5px;color:var(--mut)}
.pos{color:var(--ok)}.neg{color:var(--bad)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--mut);font-weight:600;font-size:12px}
td.n,th.n{text-align:right;white-space:nowrap}
tr.click{cursor:pointer}tr.click:hover{background:rgba(127,127,100,.08)}
.scroll{overflow-x:auto}
.btn{border:1px solid var(--olv);background:var(--olv);color:#fff;border-radius:8px;padding:8px 12px;font:inherit;cursor:pointer}
@media (prefers-color-scheme:dark){.btn{color:#171a13}}
.btn.sec{background:transparent;color:var(--olv)}
.btn.del{background:transparent;color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:4px 8px;font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.mut{color:var(--mut);font-size:13px}
.tag{display:inline-block;padding:1px 7px;border-radius:10px;font-size:12px;background:var(--line);color:var(--ink)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:middle}
.g{background:var(--ok)}.a{background:var(--warn)}.r{background:var(--bad)}
.aviso{padding:8px 10px;border-left:4px solid var(--warn);background:rgba(197,138,11,.08);border-radius:6px;margin-bottom:6px}
.aviso.bad{border-color:var(--bad);background:rgba(192,57,43,.08)}
.aviso.ok{border-color:var(--ok);background:rgba(47,138,62,.08)}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:8px;width:100%}
label{display:block;margin-bottom:10px;font-size:13px;color:var(--mut)}
label>input,label>select,label>textarea{margin-top:3px}
label.chk{display:flex;gap:8px;align-items:center}label.chk input{width:auto}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
dialog{border:0;border-radius:12px;padding:0;width:min(560px,94vw);max-height:92vh;overflow:auto;background:var(--card);color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog form{padding:16px 16px 0}
.acciones{position:sticky;bottom:0;background:var(--card);margin:6px -16px 0;padding:10px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);z-index:2}
dialog h3{margin:0 0 12px}
.lab{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:10px;background:var(--bg)}
.lab-pronto{opacity:.8}
.lab .row .btn{margin-top:2px}
.apuntar{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:6px}
.apuntar button{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:14px 8px;font:inherit;font-weight:600;display:flex;align-items:center;gap:10px;cursor:pointer;text-align:left}
.apuntar button span{font-size:22px}
@media (min-width:600px){.apuntar{grid-template-columns:repeat(3,1fr)}}
.hbtn{background:transparent;border:1px solid currentColor;color:inherit;border-radius:6px;padding:3px 7px;cursor:pointer;display:flex;align-items:center}
.lab.click{cursor:pointer}
.creditos{font-size:12px;color:var(--mut);text-align:center;margin:18px 0 6px;line-height:1.5}
#navCred{display:none}
.fab{position:fixed;right:16px;bottom:76px;width:54px;height:54px;border-radius:50%;font-size:28px;line-height:1;z-index:7;box-shadow:0 3px 10px rgba(0,0,0,.25)}
#login{max-width:360px;margin:12vh auto;padding:0 16px}
.hidden{display:none!important}
.bar{min-width:60px;height:8px;background:var(--line);border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--olv2)}
.tabs2{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.tabs2 button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:16px;padding:5px 12px;font:inherit;font-size:13px;cursor:pointer}
.tabs2 button.on{background:var(--olv);color:#fff;border-color:var(--olv)}
@media (max-width:420px){th,td{padding:6px 3px;font-size:13px}main{padding:10px 10px}}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 12px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:18px;padding:8px 13px;font:inherit;font-size:14px;cursor:pointer;min-height:38px}
.chips.scrollx{flex-wrap:nowrap;overflow-x:auto;margin:0 0 8px;padding-bottom:2px;scrollbar-width:none}.chips.scrollx::-webkit-scrollbar{display:none}.chips.scrollx .chip{flex:none;min-height:34px;padding:6px 12px}
.chip.on{background:var(--olv);border-color:var(--olv);color:#fff;font-weight:600}
@media (prefers-color-scheme:dark){.chip.on{color:#171a13}}
.clab{font-size:13px;color:var(--mut);display:block}
.big{font-size:26px!important;font-weight:700;padding:10px!important}
details.adv{margin:4px 0 10px}details.adv summary{cursor:pointer;color:var(--olv);font-size:14px;margin-bottom:8px}
.quick{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:12px}
.quick button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:12px 2px;font:inherit;font-size:13px;font-weight:600;cursor:pointer}
.quick button b{display:block;font-size:22px;color:var(--olv);line-height:1}
.grp{font-size:13px;color:var(--mut);font-weight:600;margin:12px 0 4px}
/* ===== Ordenador ===== */
@media (min-width:1000px){
  body{padding-bottom:0}
  header{padding:12px 24px;height:56px}
  header h1{flex:none;width:186px;font-size:19px}
  nav{top:56px;bottom:0;right:auto;width:210px;flex-direction:column;justify-content:flex-start;gap:2px;padding:14px 12px;border-top:0;border-right:1px solid var(--line)}
  nav button{flex:none;text-align:left;padding:11px 14px;font-size:15px;border-radius:8px;color:var(--ink)}
  nav button:hover{background:rgba(127,127,100,.1)}
  nav button.on{box-shadow:none;background:rgba(111,138,60,.16);color:var(--olv)}
  main{margin-left:210px;max-width:1240px;padding:24px 32px}
  .cols2{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px;align-items:start;margin-bottom:16px}
  .cols2>.card,.cols2>.kpis{margin:0}
  .kpis{grid-template-columns:repeat(2,1fr)}
  .kpi{padding:14px 16px}.kpi b{font-size:24px}
  .quick{grid-template-columns:repeat(5,minmax(0,170px));margin-bottom:16px}
  .quick button{display:flex;align-items:center;gap:8px;justify-content:center;padding:12px 10px;font-size:14px}
  .quick button b{display:inline;font-size:20px}
  .card{padding:16px 20px;margin-bottom:16px}
  .card h2{font-size:17px}
  th,td{padding:9px 10px}
  .fab{right:32px;bottom:32px}
  dialog{width:min(640px,90vw)}
  dialog form{padding:22px 24px 0}
  .acciones{margin:8px -24px 0;padding:12px 24px 16px}
  #toast{bottom:40px}
  #navCred{display:block;margin-top:auto;font-size:11px;color:var(--mut);padding:10px 6px;line-height:1.45}
}
@media (min-width:1000px) and (prefers-color-scheme:dark){ nav button.on{background:rgba(155,181,95,.16)} }
#toast .tdes{background:none;border:0;color:#c7d98f;font:inherit;font-weight:700;margin-left:10px;padding:4px 6px;cursor:pointer}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#222;color:#fff;padding:8px 14px;border-radius:8px;z-index:20;font-size:14px}
</style>
</head>
<body>

<div id="login" class="hidden">
  <div class="card">
    <h2>Olivas</h2>
    <p class="mut">Entra con tu correo. La primera vez pulsa «Crear cuenta».</p>
    <label>Correo<input id="lg_email" type="email" autocomplete="username"></label>
    <label>Contraseña<input id="lg_pass" type="password" autocomplete="current-password"></label>
    <div class="row"><button class="btn" id="lg_in">Entrar</button><button class="btn sec" id="lg_up">Crear cuenta</button></div>
    <p class="mut" id="lg_msg"></p>
  </div>
  <p class="creditos" id="lgCred"></p>

async function vaciarCola(){

  const ord = {fincas:'nombre',maquinas:'nombre',gastos:'fecha',ingresos:'fecha',tratamientos:'fecha',tareas:'fecha',trabajadores:'nombre',jornales:'fecha',empresas:'nombre',servicios:'fecha',facturas:'fecha',factura_lineas:'created_at',dias_perdidos:'fecha',comunidades:'nombre',riego_pagos:'fecha',labores:'fecha',consejos:'created_at',aplicaciones:'fecha',pesadas:'fecha',notas:'fecha',recintos:'parcela',reuniones:'fecha',almacen:'nombre'}[k];

  let todo=[], desde=0;
  for(;;){ // Supabase devuelve como mucho 1000 filas por consulta
    const {data,error} = await sb.from('olv_'+k).select('*').order(ord,{ascending:asc}).order('id').range(desde,desde+999);
    if(error){ if(!esRed(error)) toast('Error cargando '+k+': '+error.message); return error; }
    todo=todo.concat(data); if(data.length<1000) break; desde+=1000;
  }
  const pend=COLA.filter(i=>i.tabla===k).flatMap(i=>i.filas).filter(f=>!todo.some(r=>r.id===f.id));
  D[k]=[...pend,...todo];
}

function recientesTrat(){
  const vistos=new Set(), l=[]; D.tratamientos.forEach(t=>{ const k=(t.producto||'').toLowerCase(); if(k&&!vistos.has(k)&&l.length<6){ vistos.add(k); l.push(t); } });
  return l.length?`<span class="clab">Repetir uno anterior</span><div class="chips">${l.map(t=>`<button type="button" class="chip" data-rtrat="${t.id}">${esc(t.producto)}</button>`).join('')}</div>`:'';
}
function recientesTareas(){
  const vistos=new Set(), l=[]; [...D.tareas].sort((a,b)=>(b.created_at||'').localeCompare(a.created_at||'')).forEach(t=>{ const k=t.titulo.toLowerCase(); if(!vistos.has(k)&&l.length<6){ vistos.add(k); l.push(t.titulo); } });
  return l.length?`<div class="chips" style="margin-top:-6px">${l.map(t=>`<button type="button" class="chip" data-rtit="${esc(t)}">${esc(t)}</button>`).join('')}</div>`:'';
}
function campoHtml(c, v, reg){
  const lab = esc(c.l) + (c.req?' *':'');
  const help = c.help?`<span class="mut" style="display:block">${esc(c.help)}</span>`:'';
  switch(c.t){
    case 'html': return (reg&&c.nuevo)?'':c.html;
    case 'bool': return `<label class="chk"><input type="checkbox" name="${c.k}" ${v?'checked':''}> ${lab}</label>`;
    case 'area': return `<label>${lab}<textarea name="${c.k}" rows="2">${esc(v)}</textarea></label>`;
    case 'sel': if(c.ops.length<=8) return campoHtml({...c,t:'chips',ops:c.ops.filter(([val,t])=>t!=='')},v,reg);
      return `<label>${lab}<select name="${c.k}">${c.ops.map(([val,t])=>`<option value="${esc(val)}" ${String(v??'')===String(val)?'selected':''}>${esc(t)}</option>`).join('')}</select>${help}</label>`;
    case 'chips': return `<span class="clab">${lab}</span><div class="chips" data-chips="${c.k}">${c.ops.map(([val,t])=>`<button type="button" class="chip ${String(v??'')===String(val)?'on':''}" data-val="${esc(val)}">${esc(t)}</button>`).join('')}</div><input type="hidden" name="${c.k}" value="${esc(v??'')}">`;
    case 'date': return `<label>${lab}<input type="date" name="${c.k}" value="${esc(v)}" ${c.req?'required':''}>${help}</label>${c.q?`<div class="chips" style="margin-top:-6px">${c.q.map(([t,n])=>`<button type="button" class="chip" data-qf="${c.k}" data-n="${n}">${t}</button>`).join('')}</div>`:''}`;
    case 'time': return `<label>${lab}<input type="time" name="${c.k}" value="${esc(v)}">${help}</label>`;
    case 'num': case 'int': case 'coord': return `<label>${lab}<input name="${c.k}" inputmode="decimal" autocomplete="off" class="${c.big?'big':''}" value="${esc(v)}" ${c.req?'required':''}>${help}</label>`;
    default: return `<label>${lab}<input name="${c.k}" autocomplete="off" value="${esc(v)}" ${c.req?'required':''}>${help}</label>`;
  }
}
function activarChips(root){
  root.querySelectorAll('[data-chips]').forEach(g=>{
    const inp=root.querySelector(`input[name="${g.dataset.chips}"]`);
    g.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{ g.querySelectorAll('.chip').forEach(x=>x.classList.remove('on')); b.classList.add('on'); inp.value=b.dataset.val; inp.dispatchEvent(new Event('change')); });
  });
  root.querySelectorAll('[data-qf]').forEach(b=>b.onclick=()=>{ root.querySelector(`input[name="${b.dataset.qf}"]`).value=addDias(hoy(),+b.dataset.n); });
}
function abrir(k, reg=null, ini=null){
  const def = S[k]; const r = reg || {};
  if(!reg && !ini && APUNTAR_FINCA && def.f().some(c=>c.k==='finca_id')) ini={finca_id:APUNTAR_FINCA};
  const val = c => { if(reg) return r[c.k]; if(ini && c.k in ini) return ini[c.k]; const d = typeof c.def==='function' ? c.def() : c.def; return d ?? ''; };
  const campos = def.f();
  const caja=(c)=>{ const h=campoHtml(c,val(c),reg); return c.grp?`<div data-grp="${c.grp}">${h}</div>`:h; };
  const norm = campos.filter(c=>!c.adv).map(caja).join('');
  const adv = campos.filter(c=>c.adv).map(caja).join('');
  $('#frm').innerHTML = `<h3>${reg?'Editar':'Nuevo'}: ${esc(def.tit)}</h3>${norm}${adv?`<details class="adv" ${reg?'open':''}><summary>Más detalles</summary>${adv}</details>`:''}
    <div class="row acciones" style="justify-content:space-between">
      <div>${reg?'<button type="button" class="btn del" id="fDel">Borrar</button>':''}</div>
      <div class="row"><button type="button" class="btn sec" id="fCancel">Cancelar</button>${!reg&&def.otro?'<button type="button" class="btn sec" id="fOtro">Guardar y otro</button>':''}<button class="btn" id="fOk">Guardar</button></div>
    </div>`;
  $('#frm').oninput=null;
  activarChips($('#frm'));
  $('#fCancel').onclick = ()=>$('#dlg').close();
  if(reg) $('#fDel').onclick = ()=>borrar(k, reg.id);
  if($('#fOtro')) $('#fOtro').onclick = ()=>guardar(k, null, true);
  $('#frm').onsubmit = e => { e.preventDefault(); guardar(k, reg); };
  // comportamientos especiales
  if(k==='maquinas'){
    const tog=()=>{ const t=$('#frm [name=tipo]').value; const veh=TIPOS_VEH.includes(t)||(!t&&(r.matricula||r.itv_proxima)), apl=TIPOS_APL.includes(t);
      const vis={veh, apl, pist:t==='Cuba de pistolas', barra:t==='Cuba con barra (herbicida)', caudal:['Atomizador','Cuba de pistolas','Cuba con barra (herbicida)'].includes(t), boq:['Atomizador','Cuba con barra (herbicida)'].includes(t), roma:apl&&t!=='Mochila'};
      document.querySelectorAll('#frm [data-grp]').forEach(el=>el.classList.toggle('hidden',!vis[el.dataset.grp])); };
    $('#frm [name=tipo]').addEventListener('change',tog); tog();
  }
  if(k==='gastos'){ const ci=$('#frm [name=categoria]'), tG=()=>document.querySelectorAll('#frm [data-grp=gas]').forEach(el=>el.classList.toggle('hidden',!/gas[oó]|gasoil/i.test(ci.value))); ci.addEventListener('change',tG); tG();
    const lit=$('#frm [name=litros]'), imp=$('#frm [name=importe]');
    if(lit){ lit.closest('label').insertAdjacentHTML('afterend','<div class="chips hidden" id="gLit" style="margin-top:-6px"></div>'); const box=$('#gLit'); lit.closest('[data-grp]')?.appendChild(box);
      const sug=async()=>{ const g=await gasolineraFav(); const e=pn(imp.value); if(!g||!g.gasoleo_b||!e||pn(lit.value)){ box.classList.add('hidden'); return; } const l=Math.round(e/g.gasoleo_b);
        box.innerHTML=`<button type="button" class="chip">≈ ${num(l)} l a ${num(g.gasoleo_b,3)} €/l (${esc(g.rotulo)})</button>`; box.classList.remove('hidden'); box.firstChild.onclick=()=>{ lit.value=l; box.classList.add('hidden'); }; };
      imp.addEventListener('input',sug); lit.addEventListener('input',sug); ci.addEventListener('change',sug); sug(); } }
  if(k==='reuniones'){ const ti=$('#frm [name=tipo]'); ti.addEventListener('change',()=>{ ULT.r_tipo=ti.value; }); }
  if(k==='trabajadores'){
    const cb=$('#frm [name=carne]'), tog=()=>document.querySelectorAll('#frm [data-grp=carne]').forEach(el=>el.classList.toggle('hidden',!cb.checked));
    cb.addEventListener('change',tog); tog(); campoExpedicion('#frm [name=carne_caduca]');
  }
  if(k==='fincas'){
    const ca=$('#frm [name=arrendada]'), tA=()=>document.querySelectorAll('#frm [data-grp=arr]').forEach(el=>el.classList.toggle('hidden',!ca.checked)); ca.addEventListener('change',tA); tA();
    const tog=()=>{ const on=$('#frm [name=riego]').checked; ['comunidad_id','olivos_riego'].forEach(n=>{ const el=$(`#frm [name=${n}]`); const box=n==='comunidad_id'?el.previousElementSibling:el.closest('label'); (n==='comunidad_id'?[box,box.previousElementSibling]:[box]).forEach(x=>x&&x.classList.toggle('hidden',!on)); }); };
    $('#frm [name=riego]').addEventListener('change',tog); tog();
    $('#btnGeo').onclick = ()=> navigator.geolocation ? navigator.geolocation.getCurrentPosition(p=>{ $('[name=lat]').value=p.coords.latitude.toFixed(6); $('[name=lon]').value=p.coords.longitude.toFixed(6); }, ()=>toast('No se pudo obtener la ubicación')) : toast('Sin geolocalización');
    $('[name=lat]').addEventListener('input', e=>{ const m=e.target.value.match(/(-?\d+[.,]\d+)\s*[,; ]\s*(-?\d+[.,]\d+)/); if(m){ e.target.value=m[1].replace(',','.'); $('[name=lon]').value=m[2].replace(',','.'); } });
  }
  if(k==='ingresos'){
    const calc=()=>{ const kg=pn($('[name=kilos]').value), p=pn($('[name=precio_kg]').value); if(kg&&p) $('[name=importe]').value=(kg*p).toFixed(2).replace('.',','); };
    $('[name=kilos]').addEventListener('input',calc); $('[name=precio_kg]').addEventListener('input',calc);
    $('[name=fecha]').addEventListener('change',e=>{ if(e.target.value) $('[name=campana]').value=campDe(e.target.value); });
  }
  if(k==='tratamientos') document.querySelectorAll('#frm [data-rtrat]').forEach(b=>b.onclick=()=>{
    const t=D.tratamientos.find(x=>x.id===b.dataset.rtrat); if(!t) return;
    ['producto','dosis','num_registro','motivo','plazo_seguridad_dias','repetir_dias','aplicador'].forEach(n=>{ const el=$(`#frm [name=${n}]`); if(el) el.value=t[n]??''; });
    const fb=$(`#frm [data-chips=finca_id] .chip[data-val="${t.finca_id||''}"]`); if(fb) fb.click();

function pn(s,miles=true){ if(s===''||s==null) return null; s=String(s).trim().replace(/\s/g,''); if(s===''){return null;}
  if(s.includes(',')) s=s.replace(/\./g,'').replace(',','.');
  else if(miles && /^-?\d{1,3}(\.\d{3})+$/.test(s)) s=s.replace(/\./g,''); // 1.000 -> 1000
  const n=Number(s); return isNaN(n)?NaN:n; }

async function guardar(k, reg, otro=false){
  const fd = new FormData($('#frm')); const obj={};
  for(const c of S[k].f()){
    if(c.t==='html') continue;
    if(c.t==='bool'){ obj[c.k] = fd.get(c.k)==='on'; continue; }
    let v = fd.get(c.k);
    if(c.t==='num'||c.t==='int'||c.t==='coord'){ v=pn(v,c.t!=='coord'); if(Number.isNaN(v)){ toast(`«${c.l}» no es un número`); return; } if(c.t==='int'&&v!=null) v=Math.round(v); }
    else if(v==='') v=null;
    if(c.req && (v==null)){ toast(`Falta «${c.l}»`); return; }
    obj[c.k]=v;
  }
  if(k==='ingresos' && !/^\d{4}\/\d{2}$/.test(obj.campana)){ toast('Campaña con formato 2026/27'); return; }
  if(k==='tareas') obj.hecha_fecha = obj.hecha ? (reg?.hecha_fecha || hoy()) : null;
  if(k==='jornales'||k==='servicios'||k==='riego_pagos') obj.pagado_fecha = obj.pagado ? (reg?.pagado_fecha || hoy()) : null;
  if(k==='jornales'){ const t=D.trabajadores.find(x=>x.id===obj.trabajador_id); obj.empresa_id = t&&t.empresa_id&&empresa(t.empresa_id) ? t.empresa_id : null; }
  document.querySelectorAll('#fOk,#fOtro').forEach(b=>b.disabled=true);
  if(k==='notas'&&!reg) await subirFotoNota(obj);
  if(k==='dias_perdidos'){ obj.coste=obj.coste||0; if(obj.hora_seco!=null) obj.hora_seco=Number(obj.hora_seco); await fotoTiempo(obj); }
  let error, offline=false;
  if(reg) ({error} = await sb.from('olv_'+k).update(obj).eq('id',reg.id));
  else { const r=await insertar(k,obj); error=r.error; offline=r.offline; }
  if(error){ document.querySelectorAll('#fOk,#fOtro').forEach(b=>b.disabled=false); if(!sinRed(error)) toast('Error: '+error.message); return; }
  // recordar últimas elecciones
  if(k==='gastos'){ recordar('g_cat',obj.categoria); recordar('g_finca',obj.finca_id||''); }
  if(k==='ingresos') recordar('i_finca',obj.finca_id||'');
  if(k==='pesadas'){ recordar('p_finca',obj.finca_id||''); recordar('p_tipo',obj.tipo); if(obj.almazara) recordar('p_alm',obj.almazara); }
  if(k==='tratamientos') recordar('t_finca',obj.finca_id||'');
  // efectos secundarios
  if(k==='tratamientos' && !reg && obj.repetir_dias>0){
    await insertar('tareas',{titulo:`Repetir tratamiento: ${obj.producto}`, tipo:'Curar / tratamiento', fecha:addDias(obj.fecha,obj.repetir_dias), finca_id:obj.finca_id});
    await cargar('tareas');
  }
  if(k==='tareas' && obj.hecha && !reg?.hecha && obj.repetir_dias>0) await repetirTarea({...reg,...obj});
  $('#dlg').close(); if(!offline) await cargar(k); if(['gastos','ingresos','jornales','servicios'].includes(k)) pintarCampanas(); render();
  toast((k==='gastos'&&!reg ? `Gasto de ${eur(obj.importe)} guardado` : 'Guardado') + (offline?' en el móvil (se subirá al tener cobertura)':''));
  if(otro) abrir(k);
}

// ===== Cálculo de la campaña =====
function calcular(c){
  const [ini,fin] = campRango(c);
  const fincas = D.fincas.filter(f=>f.activa); // las que reparten lo común
  const totOl = fincas.reduce((s,f)=>s+(f.olivos||0),0);
  const cuota = f => totOl ? (f.olivos||0)/totOl : (fincas.length?1/fincas.length:0);
  const R = {}; D.fincas.forEach(f=>R[f.id]={f, directo:0, comun:0, ingD:0, ingC:0, kilos:0});
  const gastos = D.gastos.filter(g=>g.fecha>=ini && g.fecha<=fin);
  // amortizaciones
  const a0=parseInt(c); const amort=[];
  D.maquinas.forEach(m=>{
    if(!(m.precio_compra>0 && m.anos_amortizacion>0 && m.fecha_compra)) return;
    const ac=parseInt(campDe(m.fecha_compra));
    if(a0>=ac && a0<ac+m.anos_amortizacion) amort.push({categoria:'Amortización maquinaria', concepto:m.nombre, importe:m.precio_compra/m.anos_amortizacion, finca_id:null});
  });
  const jorn=[...D.jornales.filter(j=>j.fecha>=ini && j.fecha<=fin).map(j=>({categoria:j.empresa_id?'Empresas de servicios':'Jornales', importe:j.importe, finca_id:j.finca_id})),
    ...D.servicios.filter(x=>x.fecha>=ini && x.fecha<=fin).map(x=>({categoria:'Empresas de servicios', importe:x.importe, finca_id:x.finca_id})),
    ...D.dias_perdidos.filter(x=>x.fecha>=ini && x.fecha<=fin && Number(x.coste)>0).map(x=>({categoria:'Días perdidos', importe:x.coste, finca_id:x.finca_id})),
    ...D.riego_pagos.filter(x=>x.fecha>=ini && x.fecha<=fin).map(x=>{ if(x.finca_id) return {categoria:'Riego', importe:x.importe, finca_id:x.finca_id};
      const fs=fincasDe(x.comunidad_id), tot=fs.reduce((a,f)=>a+olivosRiego(f),0);
      return {categoria:'Riego', importe:x.importe, finca_id:null, reparto: tot ? fs.map(f=>[f.id, olivosRiego(f)/tot]) : null}; })];
  const todos=[...gastos,...amort,...jorn];
  const porCat={}; let comunTot=0, totG=0;
  todos.forEach(g=>{
    const imp=Number(g.importe)||0; totG+=imp;
    porCat[g.categoria]=(porCat[g.categoria]||0)+imp;
    if(g.reparto) g.reparto.forEach(([fid,q])=>{ if(R[fid]) R[fid].directo+=imp*q; });
    else if(g.finca_id && R[g.finca_id]) R[g.finca_id].directo+=imp;
    else { comunTot+=imp; fincas.forEach(f=>R[f.id].comun+=imp*cuota(f)); }
  });
  const ingresos=D.ingresos.filter(i=>i.campana===c);
  let totI=0, kilos=0, ingC=0;
  ingresos.forEach(i=>{
    const imp=Number(i.importe)||0; totI+=imp; kilos+=Number(i.kilos)||0;
    if(i.finca_id && R[i.finca_id]){ R[i.finca_id].ingD+=imp; R[i.finca_id].kilos+=Number(i.kilos)||0; }
    else { ingC+=imp; fincas.forEach(f=>R[f.id].ingC+=imp*cuota(f)); }
  });
  const K=cosecha(c); if(K.tot){ kilos=K.tot; D.fincas.forEach(f=>{ R[f.id].kilos=K.porF[f.id]?.kilos||0; }); }
  const visibles = D.fincas.filter(f=>f.activa || R[f.id].directo || R[f.id].ingD);
  return {totG,totI,kilos,comunTot,ingC,porCat,R,fincas:visibles,totOl,amort,nG:gastos.length,nI:ingresos.length};
}

    const ult=out[out.length-1]; if(ult&&ult.id===t.id) ult.t=`<div class="row" style="flex-wrap:nowrap"><span style="flex:1">${ult.t}</span><button class="btn sec sm" data-hecha="${t.id}">Hecha</button></div>`;
  });
  D.maquinas.filter(m=>m.activa&&esAplicacion(m)&&m.tipo!=='Mochila'&&m.fecha_inspeccion).forEach(m=>{

    else if(d<=60) out.push({c:'',t:`Inspección (ITEAF) de <b>${esc(m.nombre)}</b> vence el ${fFecha(v)}`,ord:d,maq:m.id});
  });
  D.maquinas.filter(m=>m.activa).forEach(m=>{

      else if(d<=u.itv_dias) out.push({c:d<=7?'bad':'',t:`${n} de <b>${esc(m.nombre)}</b> el ${fFecha(m[k])} (${d} días)`,ord:d,maq:m.id});
    });
  });
  D.tratamientos.forEach(t=>{
    if(!t.plazo_seguridad_dias) return; const fin=addDias(t.fecha,t.plazo_seguridad_dias); const d=difDias(h,fin);
    if(d>0) out.push({c:'bad',t:`No recoger en <b>${esc(fincaNom(t.finca_id))}</b> hasta el ${fFecha(fin)} (plazo de seguridad de ${esc(t.producto)})`,ord:-100});
  });
  D.riego_pagos.filter(r=>!r.pagado&&r.vencimiento).forEach(r=>{ const d=difDias(h,r.vencimiento);
    if(d<0) out.push({c:'bad',t:`Recibo de riego vencido: <b>${esc(r.concepto)} ${esc(comNom(r.comunidad_id))}</b> ${eur(r.importe)} (venció el ${fFecha(r.vencimiento)})`,ord:d,riego:1});
    else if(d<=u.itv_dias) out.push({c:d<=7?'bad':'',t:`Riego: <b>${esc(r.concepto)} ${esc(comNom(r.comunidad_id))}</b> ${eur(r.importe)} vence el ${fFecha(r.vencimiento)}`,ord:d,riego:1}); });
  { const [ini,fin]=campRango(CAMP); const liq=D.ingresos.some(i=>i.fecha>=ini&&i.fecha<=fin&&/Liquidaci/.test(i.tipo||'')); const pr=rentas().reduce((a,r)=>a+r.pend,0);

  out.push(...avisosExtra(h));
  const deb=Object.values(pendientes()).reduce((a,b)=>a+b,0);
  if(deb>0) out.push({c:'',t:`Debes <b>${eur(deb)}</b> a trabajadores${D.empresas.length?' y empresas':''}`,ord:50,go:'jornales'});
  return out.sort((a,b)=>a.ord-b.ord);
}

function empNom(id){ const e=empresa(id); return e?e.nombre:'(borrada)'; }
function conIva(v,e){ return v*(1+(Number(e.iva_pct)||0)/100); }
function importeJornal(t,h){
  let v;
  const e = t.empresa_id && empresa(t.empresa_id);
  if(e){ v = e.forma_cobro==='hora' ? h*e.precio : e.forma_cobro==='jornal' ? e.precio*h/(Number(e.horas_jornada)||6.5) : 0; v=conIva(v,e); }
  else v = t.precio_hora ? h*t.precio_hora : (t.precio_dia||0)*h/(Number(t.horas_jornada)||6.5);
  return Math.round(v*100)/100;
}

function escanear(){

  if($('#dlg').open) $('#dlg').close();

async function prepararArchivo(file){
  if(file.type==='application/pdf'){ if(file.size>9.5e6) throw new Error('El PDF pasa de 10 MB'); return {blob:file, mime:'application/pdf'}; }
  const img=await createImageBitmap(file);
  const k=Math.min(1, 2000/Math.max(img.width,img.height));
  const cv=document.createElement('canvas'); cv.width=Math.round(img.width*k); cv.height=Math.round(img.height*k);
  cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
  const blob=await new Promise(r=>cv.toBlob(r,'image/jpeg',0.82));
  return {blob, mime:'image/jpeg'};
}

      let r=await sb.from('olv_facturas').insert({id, fecha, proveedor:prov, cif:F.cif.value.trim()||null, numero, base:n2(F.base.value), iva:n2(F.iva.value), total, finca_id:finca, foto_path:path, leida_por:ia});
      if(r.error){ await sb.storage.from('olv-facturas').remove([path]); throw r.error; }
      const lineas=vivas().map(i=>{ const orig=L[i]||{}; return {factura_id:id, producto:F[`p_${i}`].value.trim()||'(sin nombre)', nombre_comun:orig.nombre_comun||null, cantidad:n2(F[`c_${i}`].value), unidad:orig.unidad||null, precio_unitario:n2(F[`u_${i}`].value), descuento_pct:orig.descuento_pct??null, iva_pct:orig.iva_pct??null, importe:n2(F[`i_${i}`].value), categoria:F[`k_${i}`].value}; });
      if(lineas.length) r=await sb.from('olv_factura_lineas').insert(lineas);
      if(!r.error) r=await sb.from('olv_gastos').insert(reparto().map(x=>({fecha, categoria:x.categoria, importe:x.importe, concepto:`Factura ${prov||''}${numero?' nº '+numero:''}`.trim(), proveedor:prov, finca_id:finca, factura_id:id})));
      if(r.error){ await sb.from('olv_facturas').delete().eq('id',id); await sb.storage.from('olv-facturas').remove([path]); throw r.error; }

function comNom(id){ const c=D.comunidades.find(x=>x.id===id); return c?c.nombre:'(borrada)'; }
function olivosRiego(f){ return Number(f.olivos_riego!=null?f.olivos_riego:f.olivos)||0; }
function fincasDe(cid){ return D.fincas.filter(f=>f.activa&&f.riego&&f.comunidad_id===cid); }
function cuotaEstimada(c){ return Math.round(fincasDe(c.id).reduce((a,f)=>a+olivosRiego(f),0)*Number(c.cuota_olivo)*100)/100; }
async function pagarRecibo(id){

}

function ventana(meses, f=hoy()){
  if(!meses||!meses.length) return null;
  const [y,m]=f.split('-').map(Number); if(!meses.includes(m)) return null;
  const pm=x=>x===1?12:x-1, nm=x=>x===12?1:x+1;
  let s=m, ys=y, n=0; while(meses.includes(pm(s))&&n<11){ if(s===1) ys--; s=pm(s); n++; }
  let e=m, ye=y; n=0; while(meses.includes(nm(e))&&n<11){ if(e===12) ye++; e=nm(e); n++; }
  const ult=new Date(ye,e,0).getDate();
  return {ini:`${ys}-${String(s).padStart(2,'0')}-01`, fin:`${ye}-${String(e).padStart(2,'0')}-${ult}`};
}

function pendientesLabores(){
  const h=hoy(), evs=eventos(), out=[];
  const fincas=D.fincas.filter(f=>f.activa);
  const parado=(L,fid)=>D.labores.some(x=>x.labor===L.id&&x.finca_id===(fid||null)&&x.estado!=='hecha'&&x.hasta&&x.hasta>=h);
  laboresActivas().forEach(L=>{
    if(L.especial==='vuelta'){
      fincas.forEach(f=>{ const u=evs.filter(e=>e.finca===f.id&&e.fecha<=h).reduce((m,e)=>e.fecha>m?e.fecha:m,''); const d=u?difDias(u,h):999;
        if(d>=45 && !parado(L,f.id)) out.push({L,f,toca:1,resta:null,txt:u?`hace ${d} días que no apuntas nada`:'aún no has apuntado nada'}); });
      return;
    }
    const lista = L.global ? [null] : fincas.filter(f=>!L.riego||f.riego);
    lista.forEach(f=>{
      const fid=f?f.id:null; if(parado(L,fid)) return;
      let desde=null, resta=null, toca=false, pronto=null;
      if(L.tras){
        const base=LABORES.find(x=>x.fam===L.tras.fam)||{fam:L.tras.fam,nombre:''};
        const ub=ultimo(evs,base,fid,addDias(h,-Math.max(60,L.tras.a+10)));
        if(!ub) return;
        if(L.tras.fin && difDias(ub,h)<L.tras.de) return; // aún se está haciendo
        desde=ub; resta=L.tras.a-difDias(ub,h); toca=difDias(ub,h)>=L.tras.de;
        if(L.meses && !ventana(L.meses)) return;
        if(L.meses){ const v=ventana(L.meses); resta=Math.min(resta,difDias(h,v.fin)); }
      } else if(L.meses){
        const v=ventana(L.meses);
        if(v){ desde=v.ini; resta=difDias(h,v.fin); toca=true;
          if(L.cada){ const u=ultimo(evs,L,fid,v.ini); if(u && difDias(u,h)<L.cada) return; desde=null; } }
        else { const p=proxVentana(L.meses); if(p && difDias(h,p.ini)<=21){ pronto=p.ini; desde=p.ini; } else return; }
      } else return;

}

// ===== Curaciones (atomizador): qué lleva cada cuba, dosis y regulación =====
const nn=v=>num(v, Number.isInteger(Number(v))?0:2);
const DOSIS_U=[['g/100L','g/100 L'],['cc/100L','cc/100 L'],['%','%'],['kg/ha','kg/ha'],['l/ha','l/ha'],['kg/cuba','kg/cuba'],['l/cuba','l/cuba']];
const MOTIVOS_APL=['Repilo','Mosca','Prays','Abono foliar','Aminoácidos','Abonado al suelo','Herbicida','Otro'];
// Cantidad de producto por cuba según la dosis. lha = litros de caldo por hectárea (para dosis por ha)
function porCuba(valor, unidad, cuba, lha){
  const v=Number(valor), c=Number(cuba); if(!(v>0)||!(c>0)) return null;
  switch(unidad){
    case 'g/100L': return {n:v*c/100/1000, u:'kg'};
    case 'cc/100L': return {n:v*c/100/1000, u:'l'};
    case '%': return {n:v*c/100, u:'kg o l'};
    case 'kg/ha': return lha>0?{n:v*c/lha, u:'kg'}:null;
    case 'l/ha': return lha>0?{n:v*c/lha, u:'l'}:null;
    case 'kg/cuba': return {n:v, u:'kg'};
    case 'l/cuba': return {n:v, u:'l'};
  }
  return null;
}
const fCant=(x)=>x==null?'—':(x.n<1&&x.u!=='kg o l'? `${num(x.n*1000)} ${x.u==='kg'?'g':'cc'}` : `${num(x.n, x.n<10?2:1)} ${x.u}`);
const litrosHa=(caudal, vel, calle)=> (caudal>0&&vel>0&&calle>0) ? caudal*600/(vel*calle) : null;
const velPara=(caudal, lha, calle)=> (caudal>0&&lha>0&&calle>0) ? caudal*600/(lha*calle) : null;
function atomizadores(){ const a=D.maquinas.filter(m=>m.activa&&esAplicacion(m)); return a.length?a:D.maquinas.filter(m=>m.activa); }
function aplicacionesRecientes(){ return [...D.aplicaciones].sort((a,b)=>b.fecha.localeCompare(a.fecha)).slice(0,5); }

async function compartir(texto){

  try{ await navigator.clipboard.writeText(texto); toast('Copiado: pégalo en WhatsApp'); }catch(e){ prompt('Copia el texto:',texto); }

const DIAS=['dom','lun','mar','mié','jue','vie','sáb'];
let METEO_CACHE={};
async function getMeteo(f, pasados=1){
  const key=f.lat+','+f.lon+'|'+pasados; let w=METEO_CACHE[key];
  if(w && Date.now()-w._t<30*60e3) return w;
  const url=`https://api.open-meteo.com/v1/forecast?latitude=${f.lat}&longitude=${f.lon}&hourly=temperature_2m,relative_humidity_2m,dew_point_2m,precipitation,precipitation_probability,wind_speed_10m,wind_gusts_10m,cloud_cover&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_sum,precipitation_probability_max,wind_gusts_10m_max&timezone=Europe%2FMadrid&past_days=${pasados}&forecast_days=7`;
  const r=await fetch(url); if(!r.ok) throw new Error('error '+r.status);
  w=await r.json(); w._t=Date.now(); METEO_CACHE[key]=w; return w;
}
function horas(w){ const H=w.hourly; return H.time.map((t,i)=>({fecha:t.slice(0,10),h:+t.slice(11,13),t:H.temperature_2m[i],hr:H.relative_humidity_2m[i],td:H.dew_point_2m?.[i],p:H.precipitation[i]||0,pp:H.precipitation_probability?.[i]??0,v:H.wind_speed_10m[i],r:H.wind_gusts_10m?.[i],nub:H.cloud_cover?.[i]})); }
// ¿La oliva está mojada a esa hora? Lluvia, aire casi saturado (rocío/niebla) o temperatura pegada al punto de rocío
function mojado(x,hr){ const u=AJ.umb; const lim=hr??u.moj_hr; return x.p>0.1 || x.hr>=lim || (x.td!=null && x.t-x.td<=u.moj_dif); }
// Hora estimada a la que la oliva está seca ese día. {mojada:false} si amanece seca; seco:null si no se seca antes de las 19 h
// Horas en que el olivo está seco (se puede trabajar debajo sin mojarse), con el retraso propio de la finca
function horasSecas(H, fecha, finca){
  const u=AJ.umb; const i0=H.findIndex(x=>x.fecha===fecha&&x.h===0); if(i0<0) return null;
  const hr=finca?.umbral_hr??null, ret=Math.max(0,Math.round(Number(finca?.retraso_secado_h||0)));
  const seca={};
  for(let h=0;h<24;h++){
    const i=i0+h; if(!H[i]) break;
    const ll12=H.slice(Math.max(0,i-12),i).reduce((s,x)=>s+x.p,0);
    const k=(ll12>=1?u.seco_horas_lluvia:u.seco_horas)+ret;
    seca[h] = i-k+1>=0 && H.slice(i-k+1,i+1).every(x=>!mojado(x,hr));
  }
  return seca;
}
function tramos(seca,de,a){ const out=[]; let ini=null; for(let h=de;h<=a+1;h++){ const s=h<=a&&seca[h]; if(s&&ini==null) ini=h; if(!s&&ini!=null){ out.push([ini,h]); ini=null; } } return out; }
function horaSeco(H, fecha, retraso=0, hr=null){
  const moj=x=>mojado(x,hr);

function evaluarTiempo(w, finca){

      if(lluvia){ok=false;motivos.lluvia++;}
      if(x.t>u.spray_tmax){ok=false;motivos.calor++;}
      if(x.t<u.spray_tmin){ok=false;motivos.frio++;}
      if(x.hr<u.spray_hrmin){ok=false;motivos.seco++;}
      if(ok && !seca[x.h]){ok=false;motivos.mojada++;}

    });

    const peor=Object.entries(motivos).sort((a,b)=>b[1]-a[1])[0];
    const spray = mejor.length>=u.spray_min_horas ? {c:'g',txt:`${mejor[0]}–${mejor[mejor.length-1]+1} h`} : mejor.length ? {c:'a',txt:`solo ${mejor[0]}–${mejor[mejor.length-1]+1} h`} : {c:'r',txt:nomMot[peor[0]]};

    else work={c:'r',txt: ll>=3*u.work_lluvia?`lluvia (${num(ll,1)} mm)`:tmax>u.work_tmax?`calor (${num(tmax)}°)`:'viento fuerte'};

    const primera=tr.length?tr[0][0]:null;

// Ajuste por finca con los días perdidos apuntados: con qué humedad se moja y cuánto tarda en secarse
function calibrar(fid){
  const u=AJ.umb;
  const R=D.dias_perdidos.filter(x=>x.finca_id===fid&&x.motivo==='Mojada'&&x.hora_seco!=null&&Array.isArray(x.meteo)&&x.meteo.length>=10)
    .map(x=>({real:Number(x.hora_seco), H:x.meteo.map(m=>({...m,fecha:x.fecha,p:m.p||0})), fecha:x.fecha}));
  if(R.length<2) return null;
  // 1) días que la app daba por secos: la finca se moja con menos humedad
  let umbral=u.moj_hr;
  R.forEach(r=>{ const s=horaSeco(r.H,r.fecha,0,u.moj_hr); if(s&&!s.mojada){ const mx=Math.max(...r.H.filter(m=>m.h>=4&&m.h<=9).map(m=>m.hr)); umbral=Math.min(umbral, Math.floor(mx)-1); } });
  umbral=Math.max(80,umbral);
  // 2) con ese umbral, cuánto se retrasa el secado real respecto al calculado
  const dif=R.map(r=>{ const s=horaSeco(r.H,r.fecha,0,umbral); return s&&s.mojada&&s.base!=null ? r.real-s.base : null; }).filter(v=>v!=null).sort((a,b)=>a-b);
  const med=dif.length ? (dif.length%2?dif[(dif.length-1)/2]:(dif[dif.length/2-1]+dif[dif.length/2])/2) : 0;
  return {n:R.length, umbral: umbral<u.moj_hr?umbral:null, retraso: Math.round(med*2)/2};
}

function km(a,b,c,d){ const R=6371, r=x=>x*Math.PI/180, dl=r(c-a), dn=r(d-b); const h=Math.sin(dl/2)**2+Math.cos(r(a))*Math.cos(r(c))*Math.sin(dn/2)**2; return 2*R*Math.asin(Math.sqrt(h)); }
function centroFincas(){ const f=D.fincas.filter(x=>x.activa&&x.lat!=null&&x.lon!=null); if(!f.length) return {lat:38.175,lon:-3.0}; return {lat:f.reduce((a,x)=>a+Number(x.lat),0)/f.length, lon:f.reduce((a,x)=>a+Number(x.lon),0)/f.length}; }
let GAS=null;
async function cargarGasolineras(){
  if(GAS&&Date.now()-GAS.t<30*60e3) return GAS.l;
  const {data,error}=await sb.from('olv_gasolineras').select('*'); if(error||!data) return GAS?GAS.l:[];
  const c=centroFincas(); data.forEach(g=>g.km=g.lat!=null?km(c.lat,c.lon,g.lat,g.lon):999); data.sort((a,b)=>a.km-b.km);
  GAS={t:Date.now(),l:data}; return data;
}

let EST=null; const LLU={};
async function lluviaReal(f, codigo){
  if(!EST){ const {data}=await sb.from('olv_estaciones').select('*'); EST=data||[]; }
  if(!EST.length||f.lat==null) return null;
  const cer=EST.filter(e=>e.lat!=null).map(e=>({...e,km:km(Number(f.lat),Number(f.lon),e.lat,e.lon)})).filter(e=>e.km<=20).sort((a,b)=>a.km-b.km);
  if(!cer.length) return null;
  const h=hoy(), sep=`${parseInt(campDe(h))}-09-01`, desde=[sep,addDias(h,-30)].sort()[0];
  const cods=cer.slice(0,4).map(e=>e.codigo), clave=cods.join(',')+desde;
  if(!LLU[clave]||Date.now()-LLU[clave].t>20*60e3){ const {data}=await sb.from('olv_lluvia').select('*').in('codigo',cods).gte('fecha',desde); LLU[clave]={t:Date.now(),l:data||[]}; }

  const est=cer.find(e=>e.codigo===codigo&&conDatos.includes(e)) || conDatos.find(e=>e.codigo===f.estacion_lluvia) || conDatos[0]; if(!est) return null;
  const mias=filas.filter(r=>r.codigo===est.codigo).sort((a,b)=>a.fecha.localeCompare(b.fecha)); const suma=d=>Math.round(mias.filter(r=>r.fecha>=d).reduce((a,r)=>a+Number(r.prec||0),0)*10)/10;

}

let ACE=null;
async function cargarAceite(){
  if(ACE&&Date.now()-ACE.t<30*60e3) return ACE;
  const {data}=await sb.from('olv_aceite').select('*').gte('fecha',addDias(hoy(),-120));
  const l=(data||[]).sort((a,b)=>a.fecha.localeCompare(b.fecha)); const serie={extra:[],virgen:[],lampante:[]};

function sparkAceite(s,alto=34){

  return `<svg class="spark" viewBox="0 0 ${w} ${alto}" preserveAspectRatio="none" style="height:${alto}px" aria-hidden="true"><polyline points="${pts}" fill="none" stroke="var(--olv)" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>`;
}

  const dup=D.ingresos.find(i=>i.fecha===fecha&&Math.abs(Number(i.importe)-Number(neto||0))<0.01);
  $('#frm').innerHTML=`<h3>Revisar ${soloTicket?'entregas':'liquidación'}</h3>
    <p class="mut">Leído por ${ia==='gemini'?'Gemini':'Claude'}${d.resumen?': '+esc(d.resumen):''}. Repasa sobre todo el importe y los kilos.</p>
    ${dup?`<p class="neg">Ya tienes un cobro de ${eur(dup.importe)} del ${fFecha(dup.fecha)}.</p>`:''}
    ${soloTicket?'':`<label>Lo que cobras (€) *<input name="importe" class="big" inputmode="decimal" value="${fmt(neto)}"></label>
    <span class="clab">Tipo</span><div class="chips" data-chips="tipo">${ING_TIPOS.slice(0,3).map(t=>`<button type="button" class="chip ${t===tipo?'on':''}" data-val="${t}">${t}</button>`).join('')}</div><input type="hidden" name="tipo" value="${tipo}">`}
    <span class="clab">Almazara${d.tipo_documento==='venta_puesto'?' (puesto de compra)':''}</span><div class="chips" data-chips="almazara">${al.map(a=>`<button type="button" class="chip ${a===almDef?'on':''}" data-val="${esc(a)}">${esc(a)}</button>`).join('')}</div><input type="hidden" name="almazara" value="${esc(almDef)}">
    <div class="grid2"><label>Kilos de aceituna<input name="kilos" inputmode="decimal" value="${fmt(d.kilos_aceituna)}"></label><label>Rendimiento (%)<input name="rendimiento" inputmode="decimal" value="${fmt(d.rendimiento_pct)}"></label></div>
    ${soloTicket?'':`<div class="grid2"><label>Fecha<input type="date" name="fecha" value="${fecha}"></label><label>Campaña<input name="campana" value="${esc(camp)}"></label></div>
    <span class="clab">Finca</span><div class="chips" data-chips="finca_id">${opsFincas().map(([v,t])=>`<button type="button" class="chip ${v===''?'on':''}" data-val="${esc(v)}">${esc(t)}</button>`).join('')}</div><input type="hidden" name="finca_id" value="">`}
    ${(d.kilos_aceite||d.precio_kg_aceite||d.compensacion_reagp||d.retencion_irpf||desc.length||d.indice_corrector)?`<div class="lab" style="margin:8px 0"><b>Detalle leído</b><div class="mut">${[
      d.kilos_aceite?`${num(d.kilos_aceite)} kg de aceite`:'', d.precio_kg_aceite?`${num(d.precio_kg_aceite,3)} €/kg de aceite`:'', d.precio_kg_aceituna?`${num(d.precio_kg_aceituna,3)} €/kg de aceituna`:'', d.categoria_aceite?esc(d.categoria_aceite):'',
      d.indice_corrector?'índice corrector '+esc(d.indice_corrector):'', d.importe_bruto!=null?'bruto '+eur(d.importe_bruto):'', d.compensacion_reagp?'compensación IVA (REAGP) '+eur(d.compensacion_reagp):'', d.retencion_irpf?'retención IRPF '+eur(d.retencion_irpf):'',
      ...desc.map(x=>`${esc(x.concepto||'descuento')} ${eur(x.importe)}`)].filter(Boolean).join(' · ')}</div></div>`:''}
    ${ent.length?`<div class="lab" style="margin:8px 0"><label class="chk"><input type="checkbox" name="crearP" ${nuevas.length?'checked':''}> Apuntar también ${nuevas.length?`las <b>${nuevas.length}</b> pesadas nuevas`:'las pesadas'} (${ent.length-nuevas.length?`${ent.length-nuevas.length} ya las tenías`:'ninguna estaba apuntada'})</label>
      <div class="mut">${ent.slice(0,8).map(e=>`${fFecha(e.fecha)} · ${num(e.kilos)} kg${e.rendimiento_pct?' · '+num(e.rendimiento_pct,1)+' %':''}${e.paraje?' · '+esc(e.paraje):''}${yaEsta(e)?' (ya está)':''}`).join('<br>')}${ent.length>8?`<br>… y ${ent.length-8} más`:''}</div>
      ${fincas.length>1?`<span class="clab">Finca de esas pesadas</span><div class="chips" data-chips="p_finca">${fincas.map(([v,t],k)=>`<button type="button" class="chip ${k===0?'on':''}" data-val="${esc(v)}">${esc(t)}</button>`).join('')}</div><input type="hidden" name="p_finca" value="${esc(fincas[0]?.[0]||'')}">`:`<input type="hidden" name="p_finca" value="${esc(fincas[0]?.[0]||'')}">`}</div>`:''}
    <div class="row acciones" style="justify-content:flex-end"><button type="button" class="btn sec" id="fCancel">Cancelar</button><button class="btn" id="fOk">Guardar</button></div>`;
  const F=$('#frm'); activarChips(F); $('#fCancel').onclick=()=>$('#dlg').close();
  F.onsubmit=async e=>{ e.preventDefault();
    const imp=soloTicket?null:n2(F.importe.value); if(!soloTicket&&!(imp>0)){ toast('Pon lo que cobras'); return; }
    if(soloTicket&&!(F.crearP&&F.crearP.checked)){ toast('No hay nada que guardar'); return; }
    $('#fOk').disabled=true; $('#fOk').textContent='Guardando…';
    try{
      const alm=F.almazara.value.trim()||null, kg=n2(F.kilos.value), rend=n2(F.rendimiento.value);
      if(!soloTicket){
        const {data:{user}}=await sb.auth.getUser(); const id=nuevoId(); const path=`${user.id}/liquidaciones/${id}.${mime==='application/pdf'?'pdf':'jpg'}`;
        const up=await sb.storage.from('olv-facturas').upload(path, blob, {contentType:mime});
        const notas=[d.resumen, d.kilos_aceite?`${num(d.kilos_aceite)} kg aceite`:'', d.precio_kg_aceite?`${num(d.precio_kg_aceite,3)} €/kg aceite`:'', d.compensacion_reagp?`REAGP ${eur(d.compensacion_reagp)}`:'', d.retencion_irpf?`IRPF ${eur(d.retencion_irpf)}`:'', d.numero?`Doc. ${d.numero}`:''].filter(Boolean).join(' · ');
        const r=await insertar('ingresos',{id, fecha:F.fecha.value||hoy(), campana:F.campana.value.trim()||campDe(hoy()), tipo:F.tipo.value||'Liquidación', finca_id:F.finca_id.value||null, kilos:kg, rendimiento:rend, precio_kg:kg?Math.round(imp/kg*10000)/10000:null, importe:imp, almazara:alm, notas:notas||null, foto_path:up.error?null:path});
        if(!r.ok){ if(!up.error) await sb.storage.from('olv-facturas').remove([path]); throw r.error; }
      }
      let np=0;
      if(F.crearP&&F.crearP.checked){ const fid=F.p_finca.value||null; const filas=nuevas.map(x=>({fecha:x.fecha, kilos:Number(x.kilos), rendimiento:x.rendimiento_pct??null, ticket:x.ticket?String(x.ticket):null, tipo:/suelo/i.test(x.tipo||'')?'Suelo':'Vuelo', almazara:alm, finca_id:fid, notas:x.paraje?`Paraje: ${x.paraje}`:null}));
        if(filas.length){ const r=await insertar('pesadas',filas); if(!r.ok) throw r.error; np=filas.length; } }
      $('#dlg').close(); await Promise.all(['ingresos','pesadas'].map(cargar)); ACE=null; pintarCampanas(); render();
      toast(`${soloTicket?'':`Cobro de ${eur(imp)} guardado`}${np?`${soloTicket?'':' · '}${np} pesadas apuntadas`:''}`);
    }catch(err){ $('#fOk').disabled=false; $('#fOk').textContent='Guardar'; toast('Error: '+(err.message||err)); }
  };
}

// ===== Exportar =====
function bajar(nombre, contenido, tipo){ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([contenido],{type:tipo})); a.download=nombre; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1000); }
function csv(k){
  const [ini,fin]=campRango(CAMP); const sep=';'; const q=v=>`"${String(v??'').replace(/"/g,'""')}"`; const n=v=>v==null?'':String(v).replace('.',',');
  let rows;
  if(k==='gastos') rows=[['Fecha','Categoría','Concepto','Finca','Máquina','Proveedor','Importe','Notas'], ...D.gastos.filter(g=>g.fecha>=ini&&g.fecha<=fin).map(g=>[g.fecha,g.categoria,g.concepto,fincaNom(g.finca_id),maqNom(g.maquina_id),g.proveedor,n(g.importe),g.notas])];
  else if(k==='ingresos') rows=[['Fecha','Campaña','Tipo','Finca','Kilos','Rendimiento %','Precio €/kg','Importe','Notas'], ...D.ingresos.filter(i=>i.campana===CAMP).map(i=>[i.fecha,i.campana,i.tipo,fincaNom(i.finca_id),n(i.kilos),n(i.rendimiento),n(i.precio_kg),n(i.importe),i.notas])];
  else if(k==='jornales') rows=[['Fecha','Trabajador','Empresa','Finca','Faena','Horas','Kilos','Importe','Pagado','Fecha pago'], ...D.jornales.filter(j=>j.fecha>=ini&&j.fecha<=fin).map(j=>[j.fecha,trabNom(j.trabajador_id),j.empresa_id?empNom(j.empresa_id):'',fincaNom(j.finca_id),j.tarea,n(j.horas),'',n(j.importe),j.pagado?'sí':'no',j.pagado_fecha]), ...D.servicios.filter(x=>x.fecha>=ini&&x.fecha<=fin).map(x=>[x.fecha,'',empNom(x.empresa_id),fincaNom(x.finca_id),'Kilos','',n(x.kilos),n(x.importe),x.pagado?'sí':'no',x.pagado_fecha])];
  else rows=[['Fecha','Finca','Producto','Nº registro','Dosis','Cantidad total','Unidad','Caldo total (l)','Equipo','Plaga/motivo','Superficie ha','Aplicador','Plazo seguridad días','Notas'], ...D.tratamientos.map(t=>{ const a=D.aplicaciones.find(x=>x.id===t.aplicacion_id)||{}; return [t.fecha,fincaNom(t.finca_id),t.producto,t.num_registro,t.dosis,n(t.cantidad),t.unidad,n(a.litros_total),a.maquina_id?maqNom(a.maquina_id):'',t.motivo,n(t.superficie_ha),t.aplicador,t.plazo_seguridad_dias,t.notas]; })];
  bajar(`olivas_${k}_${CAMP.replace('/','-')}.csv`, '﻿'+rows.map(r=>r.map(q).join(sep)).join('\r\n'), 'text/csv;charset=utf-8');
}
function nuevaLabor(){
  $('#frm').oninput=null; $('#frm').onchange=null;
  $('#frm').innerHTML=`<h3>Labor propia</h3><label>Qué hay que hacer<input name="nombre" autocomplete="off"></label>
    <span class="clab">Meses en que toca</span><div class="chips" id="lMes">${MESES.slice(1).map((m,i)=>`<button type="button" class="chip" data-m="${i+1}">${m}</button>`).join('')}</div>
    <span class="clab">Tiempo</span><div class="chips" data-chips="tipo"><button type="button" class="chip on" data-val="">Da igual</button><button type="button" class="chip" data-val="olivo">Olivo seco</button><button type="button" class="chip" data-val="spray">Para curar</button></div><input type="hidden" name="tipo" value="">
    <div class="row acciones" style="justify-content:flex-end"><button type="button" class="btn sec" id="fCancel">Cancelar</button><button class="btn" id="fOk">Guardar</button></div>`;
  activarChips($('#frm')); $('#fCancel').onclick=()=>$('#dlg').close();
  document.querySelectorAll('#lMes .chip').forEach(b=>b.onclick=()=>b.classList.toggle('on'));
  $('#frm').onsubmit=async e=>{ e.preventDefault();
    const nombre=$('#frm [name=nombre]').value.trim(), meses=[...document.querySelectorAll('#lMes .chip.on')].map(b=>+b.dataset.m);
    if(!nombre||!meses.length){ toast('Pon qué hay que hacer y algún mes'); return; }
    AJ.labores_propias=[...(AJ.labores_propias||[]),{id:'p_'+Date.now(),nombre,meses,tipo:$('#frm [name=tipo]').value||undefined}];
    $('#dlg').close(); await guardarAjustes(); render(); };
  $('#dlg').showModal(); setTimeout(()=>$('#frm [name=nombre]').focus(),50);
}
async function borrarLabor(id){ AJ.labores_propias=(AJ.labores_propias||[]).filter(x=>x.id!==id); await guardarAjustes(); render(); }
function copia(){ AJ.ult_copia=hoy(); bajar(`olivas_copia_${hoy()}.json`, JSON.stringify({version:1, fecha:new Date().toISOString(), ajustes:AJ, datos:D}, null, 1), 'application/json'); guardarAjustes(); }
function ics(){
  const ev=[]; const f=s=>s.replace(/-/g,''); const e=s=>String(s).replace(/[\\;,]/g,m=>'\\'+m).replace(/\n/g,'\\n');
  const add=(uid,fecha,tit,alarmDias)=>ev.push(`BEGIN:VEVENT\r\nUID:${uid}@olivas\r\nDTSTAMP:${new Date().toISOString().replace(/[-:]/g,'').slice(0,15)}Z\r\nDTSTART;VALUE=DATE:${f(fecha)}\r\nDTEND;VALUE=DATE:${f(addDias(fecha,1))}\r\nSUMMARY:${e(tit)}\r\nBEGIN:VALARM\r\nACTION:DISPLAY\r\nDESCRIPTION:${e(tit)}\r\nTRIGGER:-P${alarmDias-1}DT15H\r\nEND:VALARM\r\nEND:VEVENT`);
  D.tareas.filter(t=>!t.hecha&&t.fecha>=hoy()).forEach(t=>add('t'+t.id,t.fecha,`Olivas: ${t.titulo}${t.finca_id?' ('+fincaNom(t.finca_id)+')':''}`,1));
  D.maquinas.filter(m=>m.activa).forEach(m=>{ if(m.itv_proxima>=hoy()) add('i'+m.id,m.itv_proxima,`ITV ${m.nombre}`,14); if(m.seguro_vence>=hoy()) add('s'+m.id,m.seguro_vence,`Seguro ${m.nombre}`,14); });
  D.reuniones.filter(r=>!r.hecha&&r.fecha>=hoy()).forEach(r=>add('r'+r.id,r.fecha,`${r.hora?r.hora+' ':''}${r.titulo}${r.lugar?' · '+r.lugar:''}`,1));
  const y=+hoy().slice(0,4); plazos().forEach(p=>{ [y,y+1].forEach(a=>{ const {ini,fin}=plazoAnio(p,a); if(fin>=hoy()&&!plazoHecho(p,a)){ if(ini>=hoy()) add('pi'+p.id+a,ini,`Se abre: ${p.nombre}`,1); add('pf'+p.id+a,fin,`Último día: ${p.nombre}`,15); } }); });
  carnes().forEach(c=>{ if(c.cad&&c.cad>=hoy()) add('c'+(c.id||'tit'),c.cad,`Caduca el carné de fitosanitarios de ${c.nombre}`,90); });
  if(!ev.length){ toast('No hay nada pendiente que exportar'); return; }
  bajar('olivas_avisos.ics',`BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//Olivas//ES\r\n${ev.join('\r\n')}\r\nEND:VCALENDAR\r\n`,'text/calendar');
}

$('#navCred').innerHTML = `Olivas v${VERSION} · ${VERSION_FECHA}<br>© 2026 Alfonso Carrascosa Martínez<br>Hecha con Claude (Anthropic)`;

$('#dlg').addEventListener('click', e=>{ if(e.target===$('#dlg') && !$('#fOk')?.disabled) $('#dlg').close(); });
arranque();
