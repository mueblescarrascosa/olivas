<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4b5d2a">
<title>Olivas</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#f6f5ef;--card:#fff;--ink:#22261c;--mut:#6b7060;--line:#e2e0d4;--olv:#4b5d2a;--olv2:#6f8a3c;--ok:#2f8a3e;--warn:#c58a0b;--bad:#c0392b;--sh:0 1px 3px rgba(0,0,0,.08)}
@media (prefers-color-scheme:dark){:root{--bg:#171a13;--card:#21251b;--ink:#ecebe3;--mut:#a3a796;--line:#353a2c;--olv:#9bb55f;--olv2:#b5cc7c;--sh:none}}
*{box-sizing:border-box}
body{margin:0;font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:80px}
header{position:sticky;top:0;z-index:5;background:var(--olv);color:#fff;padding:10px 16px;display:flex;align-items:center;gap:10px}
@media (prefers-color-scheme:dark){header{color:#171a13}}
header h1{font-size:18px;margin:0;flex:1}
header select{background:transparent;color:inherit;border:1px solid currentColor;border-radius:6px;padding:4px 6px;font:inherit}
header select option{color:#000}
main{max-width:900px;margin:0 auto;padding:12px 16px}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;z-index:6;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;color:var(--mut);padding:10px 2px;font:12px system-ui;cursor:pointer}
nav button.on{color:var(--olv);font-weight:700;box-shadow:inset 0 3px 0 var(--olv)}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:0 0 12px;box-shadow:var(--sh)}
.card h2{font-size:16px;margin:0 0 8px;display:flex;align-items:center;gap:8px}
.card h2 .sp{flex:1}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-bottom:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.kpi b{display:block;font-size:20px}
.kpi span{color:var(--mut);font-size:12px}
.pos{color:var(--ok)}.neg{color:var(--bad)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--mut);font-weight:600;font-size:12px}
td.n,th.n{text-align:right;white-space:nowrap}
tr.click{cursor:pointer}tr.click:hover{background:rgba(127,127,100,.08)}
.scroll{overflow-x:auto}
.btn{border:1px solid var(--olv);background:var(--olv);color:#fff;border-radius:8px;padding:8px 12px;font:inherit;cursor:pointer}
@media (prefers-color-scheme:dark){.btn{color:#171a13}}
.btn.sec{background:transparent;color:var(--olv)}
.btn.del{background:transparent;color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:4px 8px;font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.mut{color:var(--mut);font-size:13px}
.tag{display:inline-block;padding:1px 7px;border-radius:10px;font-size:12px;background:var(--line);color:var(--ink)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:middle}
.g{background:var(--ok)}.a{background:var(--warn)}.r{background:var(--bad)}
.aviso{padding:8px 10px;border-left:4px solid var(--warn);background:rgba(197,138,11,.08);border-radius:6px;margin-bottom:6px}
.aviso.bad{border-color:var(--bad);background:rgba(192,57,43,.08)}
.aviso.ok{border-color:var(--ok);background:rgba(47,138,62,.08)}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:8px;width:100%}
label{display:block;margin-bottom:10px;font-size:13px;color:var(--mut)}
label>input,label>select,label>textarea{margin-top:3px}
label.chk{display:flex;gap:8px;align-items:center}label.chk input{width:auto}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
dialog{border:0;border-radius:12px;padding:0;width:min(560px,94vw);background:var(--card);color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog form{padding:16px}
dialog h3{margin:0 0 12px}
.fab{position:fixed;right:16px;bottom:76px;width:54px;height:54px;border-radius:50%;font-size:28px;line-height:1;z-index:7;box-shadow:0 3px 10px rgba(0,0,0,.25)}
#login{max-width:360px;margin:12vh auto;padding:0 16px}
.hidden{display:none!important}
.bar{min-width:60px;height:8px;background:var(--line);border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--olv2)}
.tabs2{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.tabs2 button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:16px;padding:5px 12px;font:inherit;font-size:13px;cursor:pointer}
.tabs2 button.on{background:var(--olv);color:#fff;border-color:var(--olv)}
@media (max-width:420px){th,td{padding:6px 3px;font-size:13px}main{padding:10px 10px}}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 12px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:18px;padding:8px 13px;font:inherit;font-size:14px;cursor:pointer;min-height:38px}
.chip.on{background:var(--olv);border-color:var(--olv);color:#fff;font-weight:600}
@media (prefers-color-scheme:dark){.chip.on{color:#171a13}}
.clab{font-size:13px;color:var(--mut);display:block}
.big{font-size:26px!important;font-weight:700;padding:10px!important}
details.adv{margin:4px 0 10px}details.adv summary{cursor:pointer;color:var(--olv);font-size:14px;margin-bottom:8px}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.quick button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:12px 4px;font:inherit;font-size:14px;font-weight:600;cursor:pointer}
.quick button b{display:block;font-size:22px;color:var(--olv);line-height:1}
.grp{font-size:13px;color:var(--mut);font-weight:600;margin:12px 0 4px}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#222;color:#fff;padding:8px 14px;border-radius:8px;z-index:20;font-size:14px}
</style>
</head>
<body>

<div id="login" class="hidden">
  <div class="card">
    <h2>Olivas</h2>
    <p class="mut">Entra con tu correo. La primera vez pulsa «Crear cuenta».</p>
    <label>Correo<input id="lg_email" type="email" autocomplete="username"></label>
    <label>Contraseña<input id="lg_pass" type="password" autocomplete="current-password"></label>
    <div class="row"><button class="btn" id="lg_in">Entrar</button><button class="btn sec" id="lg_up">Crear cuenta</button></div>
    <p class="mut" id="lg_msg"></p>
  </div>
</div>

<div id="app" class="hidden">
  <header><h1>Olivas</h1><button id="cola" class="btn sm hidden" style="background:#c58a0b;border-color:#c58a0b;color:#fff" onclick="vaciarCola()"></button><select id="selCamp" title="Campaña"></select></header>
  <main id="view"></main>
  <button class="btn fab hidden" id="fab">+</button>
  <nav id="nav">
    <button data-v="inicio">Inicio</button>
    <button data-v="cuentas">Cuentas</button>
    <button data-v="jornales">Jornales</button>
    <button data-v="campo">Campo</button>
    <button data-v="tiempo">Tiempo</button>
    <button data-v="mas">Más</button>
  </nav>
</div>

<dialog id="dlg"><form id="frm" method="dialog"></form></dialog>
<div id="toast" class="hidden"></div>

<script>
// ===== Configuración =====
const SUPA_URL = 'https://kseyndjbmkaflpoqitsj.supabase.co';
const SUPA_KEY = 'sb_publishable_CbwajQX7DgAoK3fV6GVU5g_18CWeqMG';
const sb = supabase.createClient(SUPA_URL, SUPA_KEY);

const CATS_DEF = ['Gasoil / gasolina','Cuadrillas / destajo','Seguros sociales','Averías y reparaciones','Mantenimiento maquinaria','Fitosanitarios','Abonos','EPIs','Herramientas','Seguros','IBI / impuestos','Cuotas cooperativa','Transporte','Otros'];
const ING_TIPOS = ['Liquidación','Anticipo','Liquidación complementaria','Ayuda PAC','Compensación IVA (REAGP)','Otros'];
const TAREA_TIPOS = ['Poda','Curar / tratamiento','Abonado','Desvareto','Herbicida / suelo','Recogida','Riego','Mantenimiento','Papeles / trámites','Otra'];
const MAQ_TIPOS = ['Tractor','Coche / todoterreno','Remolque','Atomizador','Vibrador / vareadora','Desbrozadora','Motosierra','Otra'];
const UMB_DEF = {
  spray_vmin:2, spray_vmax:10, spray_rmax:20, spray_tmin:5, spray_tmax:28, spray_hrmin:40, spray_pmax:30, spray_horas_lluvia:4, spray_min_horas:3,
  work_tmax:35, work_rmax:50, work_lluvia:1,
  ace_lluvia_ayer:5, ace_lluvia_ayer_max:15,
  aviso_dias:7, itv_dias:30
};

// ===== Estado =====
let D = {fincas:[],maquinas:[],gastos:[],ingresos:[],tratamientos:[],tareas:[],trabajadores:[],jornales:[],empresas:[],servicios:[]};
const JOR_TAREAS = ['Recogida','Poda','Desvareto','Abonado','Curar','Desbrozar','Otra'];
let ULT = {}; try{ ULT = JSON.parse(localStorage.getItem('olv_ult')||'{}'); }catch(e){}
function recordar(k,v){ ULT[k]=v; try{ localStorage.setItem('olv_ult',JSON.stringify(ULT)); }catch(e){} }
let AJ = {cats:CATS_DEF.slice(), umb:{...UMB_DEF}};
let VIEW = 'inicio', SUB = {};
let CAMP = campDe(hoy());

// ===== Utilidades =====
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const eur = n => (Number(n)||0).toLocaleString('es-ES',{style:'currency',currency:'EUR'});
const num = (n,d=0) => (Number(n)||0).toLocaleString('es-ES',{maximumFractionDigits:d,minimumFractionDigits:d});
function hoy(){ const d=new Date(); return iso(d); }
function iso(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function addDias(s,n){ const [y,m,d]=s.split('-').map(Number); return iso(new Date(y,m-1,d+n)); }
function difDias(a,b){ const p=s=>{const [y,m,d]=s.split('-').map(Number);return Date.UTC(y,m-1,d)}; return Math.round((p(b)-p(a))/864e5); }
function fFecha(s){ if(!s) return ''; const [y,m,d]=s.split('-'); return `${d}/${m}/${y.slice(2)}`; }
function campDe(s){ const [y,m]=s.split('-').map(Number); const a = m>=10 ? y : y-1; return `${a}/${String(a+1).slice(2)}`; }
function campRango(c){ const a=parseInt(c); return [`${a}-10-01`,`${a+1}-09-30`]; }
function fincaNom(id){ if(!id) return 'Común'; const f=D.fincas.find(x=>x.id===id); return f?f.nombre:'(borrada)'; }
function maqNom(id){ const m=D.maquinas.find(x=>x.id===id); return m?m.nombre:''; }
function toast(t){ const e=$('#toast'); e.textContent=t; e.classList.remove('hidden'); clearTimeout(toast._t); toast._t=setTimeout(()=>e.classList.add('hidden'),2500); }

// ===== Autenticación =====
async function arranque(){
  const {data:{session}} = await sb.auth.getSession();
  if(session) entrar(); else { $('#login').classList.remove('hidden'); }
}
$('#lg_in').onclick = async () => {
  $('#lg_msg').textContent='Entrando…';
  const {error} = await sb.auth.signInWithPassword({email:$('#lg_email').value.trim(), password:$('#lg_pass').value});
  if(error){ $('#lg_msg').textContent = error.message.includes('confirm') ? 'Confirma primero el correo que te ha llegado.' : 'Correo o contraseña incorrectos.'; return; }
  entrar();
};
$('#lg_up').onclick = async () => {
  const p=$('#lg_pass').value; if(p.length<8){ $('#lg_msg').textContent='La contraseña necesita al menos 8 caracteres.'; return; }
  const {data,error} = await sb.auth.signUp({email:$('#lg_email').value.trim(), password:p});
  if(error){ $('#lg_msg').textContent=error.message; return; }
  if(data.session) entrar(); else $('#lg_msg').textContent='Cuenta creada. Revisa tu correo para confirmarla y luego entra.';
};
async function entrar(){
  $('#login').classList.add('hidden'); $('#app').classList.remove('hidden');
  await cargarTodo();
  ir('inicio');
  vaciarCola();
}
async function salir(){
  if(COLA.length && !confirm('Hay apuntes sin subir que se perderán si cierras sesión. ¿Cerrar igualmente?')) return;
  try{ localStorage.removeItem('olv_cache'); localStorage.removeItem('olv_cola'); }catch(e){}
  await sb.auth.signOut(); location.reload(); }

// ===== Datos =====
// --- Sin cobertura: los apuntes nuevos se guardan en el móvil y se suben solos
const esRed = e => !navigator.onLine || /fetch|network|load failed|timeout/i.test(e?.message||'');
let COLA=[]; try{ COLA=JSON.parse(localStorage.getItem('olv_cola')||'[]'); }catch(e){}
function guardarCola(){ try{ localStorage.setItem('olv_cola',JSON.stringify(COLA)); }catch(e){} pintarCola(); }
function pintarCola(){ const n=COLA.reduce((a,i)=>a+i.filas.length,0); const b=$('#cola'); if(!b) return; b.textContent=n?`${n} sin subir`:''; b.classList.toggle('hidden',!n); }
function nuevoId(){ if(crypto.randomUUID) return crypto.randomUUID(); return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{const r=Math.random()*16|0;return (c==='x'?r:(r&3|8)).toString(16);}); }
async function insertar(tabla, filas){
  filas=[].concat(filas).map(f=>({id:nuevoId(),...f}));
  const {error}=await sb.from('olv_'+tabla).insert(filas);
  if(!error) return {ok:true,filas};
  if(esRed(error)){ COLA.push({tabla,filas}); guardarCola(); D[tabla]=[...filas,...D[tabla]]; return {ok:true,offline:true,filas}; }
  return {ok:false,error};
}
let subiendo=false;
async function vaciarCola(){
  if(subiendo || !COLA.length || !navigator.onLine) return;
  subiendo=true; let subidos=0;
  try{
    for(const item of COLA.slice()){
      const {error}=await sb.from('olv_'+item.tabla).insert(item.filas);
      if(error && error.code!=='23505'){ if(esRed(error)) break; toast('No se pudo subir un apunte: '+error.message); continue; }
      COLA.splice(COLA.indexOf(item),1); subidos+=item.filas.length; guardarCola();
    }
  } finally { subiendo=false; }
  if(subidos){ await cargarTodo(); render(); toast(`${subidos} ${subidos===1?'apunte subido':'apuntes subidos'}`); }
}
window.addEventListener('online', vaciarCola); setInterval(vaciarCola, 60000);
function sinRed(error){ if(esRed(error)){ toast('Sin cobertura: para editar o borrar necesitas conexión'); return true; } return false; }

async function cargar(k){
  const ord = {fincas:'nombre',maquinas:'nombre',gastos:'fecha',ingresos:'fecha',tratamientos:'fecha',tareas:'fecha',trabajadores:'nombre',jornales:'fecha',empresas:'nombre',servicios:'fecha'}[k];
  const asc = !['gastos','ingresos','tratamientos','jornales','servicios'].includes(k);
  let todo=[], desde=0;
  for(;;){ // Supabase devuelve como mucho 1000 filas por consulta
    const {data,error} = await sb.from('olv_'+k).select('*').order(ord,{ascending:asc}).order('id').range(desde,desde+999);
    if(error){ if(!esRed(error)) toast('Error cargando '+k+': '+error.message); return error; }
    todo=todo.concat(data); if(data.length<1000) break; desde+=1000;
  }
  const pend=COLA.filter(i=>i.tabla===k).flatMap(i=>i.filas).filter(f=>!todo.some(r=>r.id===f.id));
  D[k]=[...pend,...todo];
}
async function cargarTodo(){
  const errs=(await Promise.all(Object.keys(D).map(cargar))).filter(Boolean);
  if(errs.some(esRed)){
    try{ const c=JSON.parse(localStorage.getItem('olv_cache')||'null'); if(c){ Object.keys(D).forEach(k=>{ if(c.D[k]) D[k]=[...COLA.filter(i=>i.tabla===k).flatMap(i=>i.filas),...c.D[k]]; }); AJ=c.AJ||AJ; } }catch(e){}
    toast('Sin cobertura: ves lo último guardado. Lo que apuntes se subirá solo.');
  } else {
    const {data} = await sb.from('olv_ajustes').select('datos').maybeSingle();
    if(data && data.datos){ AJ.cats = data.datos.cats?.length ? data.datos.cats : CATS_DEF.slice(); AJ.umb = {...UMB_DEF, ...(data.datos.umb||{})}; }
    try{ const sinPend={}; Object.keys(D).forEach(k=>sinPend[k]=D[k].filter(r=>!COLA.some(i=>i.filas.some(f=>f.id===r.id)))); localStorage.setItem('olv_cache',JSON.stringify({D:sinPend,AJ,t:Date.now()})); }catch(e){}
  }
  pintarCampanas(); pintarCola();
}
async function guardarAjustes(){
  const {data:{user}} = await sb.auth.getUser();
  const {error} = await sb.from('olv_ajustes').upsert({user_id:user.id, datos:AJ, updated_at:new Date().toISOString()});
  toast(error ? 'Error: '+error.message : 'Ajustes guardados');
}
function pintarCampanas(){
  const set = new Set([campDe(hoy())]);
  D.gastos.forEach(g=>set.add(campDe(g.fecha)));
  D.ingresos.forEach(i=>set.add(i.campana));
  D.jornales.forEach(j=>set.add(campDe(j.fecha)));
  D.servicios.forEach(j=>set.add(campDe(j.fecha)));
  const lista=[...set].sort().reverse();
  if(!lista.includes(CAMP)) CAMP=lista[0];
  $('#selCamp').innerHTML = lista.map(c=>`<option ${c===CAMP?'selected':''}>${c}</option>`).join('');
}
$('#selCamp').onchange = e => { CAMP=e.target.value; render(); };

// ===== Formularios genéricos =====
const opsFincas = (conComun=true) => [...(conComun?[['','Común']]:[['','—']]), ...D.fincas.filter(f=>f.activa).map(f=>[f.id,f.nombre])];
const opsMaq = () => [['','—'], ...D.maquinas.map(m=>[m.id,m.nombre])];
const opsTrab = () => D.trabajadores.map(t=>[t.id,t.nombre]);
const QF = [['Hoy',0],['Mañana',1],['En 1 semana',7],['En 1 mes',30]];
const S = {
  fincas:{tit:'Finca', f:()=>[
    {k:'nombre',l:'Nombre',req:1,focus:1},{k:'olivos',l:'Nº de olivos',t:'int',req:1,help:'Se usa para repartir gastos comunes'},
    {k:'lat',l:'Latitud',t:'coord'},{k:'lon',l:'Longitud',t:'coord'},
    {k:'_geo',t:'html',html:'<div class="row" style="margin-bottom:10px"><button type="button" class="btn sec sm" id="btnGeo">Usar mi ubicación</button><span class="mut">o pega «lat, lon» de Google Maps en Latitud</span></div>'},
    {k:'municipio',l:'Municipio',adv:1},{k:'poligono_parcela',l:'Polígono / parcela',adv:1},{k:'ha',l:'Hectáreas',t:'num',adv:1},
    {k:'activa',l:'Activa',t:'bool',def:true,adv:1},{k:'notas',l:'Notas',t:'area',adv:1}]},
  maquinas:{tit:'Vehículo / máquina', f:()=>[
    {k:'nombre',l:'Nombre',req:1,focus:1},{k:'itv_proxima',l:'Próxima ITV',t:'date'},{k:'seguro_vence',l:'Vence el seguro',t:'date'},
    {k:'tipo',l:'Tipo',t:'sel',ops:MAQ_TIPOS.map(x=>[x,x]),adv:1},{k:'matricula',l:'Matrícula',adv:1},
    {k:'fecha_compra',l:'Fecha de compra',t:'date',adv:1},{k:'precio_compra',l:'Precio de compra (€)',t:'num',adv:1},
    {k:'anos_amortizacion',l:'Años para amortizar',t:'int',adv:1,help:'0 = no amortizar. El coste anual se reparte como gasto común.'},
    {k:'activa',l:'En uso',t:'bool',def:true,adv:1},{k:'notas',l:'Notas',t:'area',adv:1}]},
  gastos:{tit:'Gasto', otro:1, f:()=>[
    {k:'importe',l:'Importe (€)',t:'num',req:1,big:1,focus:1},
    {k:'categoria',l:'¿De qué?',t:'chips',ops:AJ.cats.map(x=>[x,x]),req:1,def:()=>ULT.g_cat||AJ.cats[0]},
    {k:'finca_id',l:'Finca',t:'chips',ops:opsFincas(),def:()=>ULT.g_finca??''},
    {k:'fecha',l:'Fecha',t:'date',def:hoy,req:1,adv:1},{k:'concepto',l:'Concepto',adv:1},
    {k:'maquina_id',l:'Vehículo / máquina',t:'sel',ops:opsMaq(),adv:1},{k:'proveedor',l:'Proveedor',adv:1},{k:'notas',l:'Notas',t:'area',adv:1}]},
  ingresos:{tit:'Cobro', f:()=>[
    {k:'tipo',l:'Tipo',t:'chips',ops:ING_TIPOS.map(x=>[x,x]),req:1,def:'Liquidación'},
    {k:'kilos',l:'Kilos de aceituna',t:'num',focus:1},{k:'precio_kg',l:'Precio €/kg',t:'num'},
    {k:'importe',l:'Importe cobrado (€)',t:'num',req:1,big:1,help:'Kilos × precio se calcula solo'},
    {k:'finca_id',l:'Finca',t:'chips',ops:opsFincas(),def:()=>ULT.i_finca??''},
    {k:'rendimiento',l:'Rendimiento (%)',t:'num',adv:1},
    {k:'fecha',l:'Fecha de cobro',t:'date',def:hoy,req:1,adv:1},{k:'campana',l:'Campaña',def:()=>campDe(hoy()),req:1,adv:1,help:'Se pone sola según la fecha. Formato 2026/27'},

function campoHtml(c, v, reg){
  const lab = esc(c.l) + (c.req?' *':'');
  const help = c.help?`<span class="mut" style="display:block">${esc(c.help)}</span>`:'';
  switch(c.t){
    case 'html': return c.html;
    case 'bool': return `<label class="chk"><input type="checkbox" name="${c.k}" ${v?'checked':''}> ${lab}</label>`;
    case 'area': return `<label>${lab}<textarea name="${c.k}" rows="2">${esc(v)}</textarea></label>`;
    case 'sel': return `<label>${lab}<select name="${c.k}">${c.ops.map(([val,t])=>`<option value="${esc(val)}" ${String(v??'')===String(val)?'selected':''}>${esc(t)}</option>`).join('')}</select>${help}</label>`;
    case 'chips': return `<span class="clab">${lab}</span><div class="chips" data-chips="${c.k}">${c.ops.map(([val,t])=>`<button type="button" class="chip ${String(v??'')===String(val)?'on':''}" data-val="${esc(val)}">${esc(t)}</button>`).join('')}</div><input type="hidden" name="${c.k}" value="${esc(v??'')}">`;
    case 'date': return `<label>${lab}<input type="date" name="${c.k}" value="${esc(v)}" ${c.req?'required':''}></label>${c.q?`<div class="chips" style="margin-top:-6px">${c.q.map(([t,n])=>`<button type="button" class="chip" data-qf="${c.k}" data-n="${n}">${t}</button>`).join('')}</div>`:''}`;
    case 'num': case 'int': case 'coord': return `<label>${lab}<input name="${c.k}" inputmode="decimal" autocomplete="off" class="${c.big?'big':''}" value="${esc(v)}" ${c.req?'required':''}>${help}</label>`;
    default: return `<label>${lab}<input name="${c.k}" autocomplete="off" value="${esc(v)}" ${c.req?'required':''}>${help}</label>`;
  }
}

function pn(s,miles=true){ if(s===''||s==null) return null; s=String(s).trim().replace(/\s/g,''); if(s===''){return null;}
  if(s.includes(',')) s=s.replace(/\./g,'').replace(',','.');
  else if(miles && /^-?\d{1,3}(\.\d{3})+$/.test(s)) s=s.replace(/\./g,''); // 1.000 -> 1000
  const n=Number(s); return isNaN(n)?NaN:n; }

async function guardar(k, reg, otro=false){
  const fd = new FormData($('#frm')); const obj={};
  for(const c of S[k].f()){
    if(c.t==='html') continue;
    if(c.t==='bool'){ obj[c.k] = fd.get(c.k)==='on'; continue; }
    let v = fd.get(c.k);
    if(c.t==='num'||c.t==='int'||c.t==='coord'){ v=pn(v,c.t!=='coord'); if(Number.isNaN(v)){ toast(`«${c.l}» no es un número`); return; } if(c.t==='int'&&v!=null) v=Math.round(v); }
    else if(v==='') v=null;
    if(c.req && (v==null)){ toast(`Falta «${c.l}»`); return; }
    obj[c.k]=v;
  }
  if(k==='ingresos' && !/^\d{4}\/\d{2}$/.test(obj.campana)){ toast('Campaña con formato 2026/27'); return; }
  if(k==='tareas') obj.hecha_fecha = obj.hecha ? (reg?.hecha_fecha || hoy()) : null;
  if(k==='jornales'||k==='servicios') obj.pagado_fecha = obj.pagado ? (reg?.pagado_fecha || hoy()) : null;
  if(k==='jornales'){ const t=D.trabajadores.find(x=>x.id===obj.trabajador_id); obj.empresa_id = t&&t.empresa_id&&empresa(t.empresa_id) ? t.empresa_id : null; }
  document.querySelectorAll('#fOk,#fOtro').forEach(b=>b.disabled=true);
  let error, offline=false;
  if(reg) ({error} = await sb.from('olv_'+k).update(obj).eq('id',reg.id));
  else { const r=await insertar(k,obj); error=r.error; offline=r.offline; }
  if(error){ document.querySelectorAll('#fOk,#fOtro').forEach(b=>b.disabled=false); if(!sinRed(error)) toast('Error: '+error.message); return; }
  // recordar últimas elecciones
  if(k==='gastos'){ recordar('g_cat',obj.categoria); recordar('g_finca',obj.finca_id||''); }
  if(k==='ingresos') recordar('i_finca',obj.finca_id||'');
  if(k==='tratamientos') recordar('t_finca',obj.finca_id||'');
  // efectos secundarios
  if(k==='tratamientos' && !reg && obj.repetir_dias>0){
    await insertar('tareas',{titulo:`Repetir tratamiento: ${obj.producto}`, tipo:'Curar / tratamiento', fecha:addDias(obj.fecha,obj.repetir_dias), finca_id:obj.finca_id});
    await cargar('tareas');
  }
  if(k==='tareas' && obj.hecha && !reg?.hecha && obj.repetir_dias>0) await repetirTarea({...reg,...obj});
  $('#dlg').close(); if(!offline) await cargar(k); if(['gastos','ingresos','jornales','servicios'].includes(k)) pintarCampanas(); render();
  toast((k==='gastos'&&!reg ? `Gasto de ${eur(obj.importe)} guardado` : 'Guardado') + (offline?' en el móvil (se subirá al tener cobertura)':''));
  if(otro) abrir(k);
}

// ===== Cálculo de la campaña =====
function calcular(c){
  const [ini,fin] = campRango(c);
  const fincas = D.fincas.filter(f=>f.activa); // las que reparten lo común
  const totOl = fincas.reduce((s,f)=>s+(f.olivos||0),0);
  const cuota = f => totOl ? (f.olivos||0)/totOl : (fincas.length?1/fincas.length:0);
  const R = {}; D.fincas.forEach(f=>R[f.id]={f, directo:0, comun:0, ingD:0, ingC:0, kilos:0});
  const gastos = D.gastos.filter(g=>g.fecha>=ini && g.fecha<=fin);
  // amortizaciones
  const a0=parseInt(c); const amort=[];
  D.maquinas.forEach(m=>{
    if(!(m.precio_compra>0 && m.anos_amortizacion>0 && m.fecha_compra)) return;
    const ac=parseInt(campDe(m.fecha_compra));
    if(a0>=ac && a0<ac+m.anos_amortizacion) amort.push({categoria:'Amortización maquinaria', concepto:m.nombre, importe:m.precio_compra/m.anos_amortizacion, finca_id:null});
  });
  const jorn=[...D.jornales.filter(j=>j.fecha>=ini && j.fecha<=fin).map(j=>({categoria:j.empresa_id?'Empresas de servicios':'Jornales', importe:j.importe, finca_id:j.finca_id})),
    ...D.servicios.filter(x=>x.fecha>=ini && x.fecha<=fin).map(x=>({categoria:'Empresas de servicios', importe:x.importe, finca_id:x.finca_id}))];
  const todos=[...gastos,...amort,...jorn];
  const porCat={}; let comunTot=0, totG=0;
  todos.forEach(g=>{
    const imp=Number(g.importe)||0; totG+=imp;
    porCat[g.categoria]=(porCat[g.categoria]||0)+imp;
    if(g.finca_id && R[g.finca_id]) R[g.finca_id].directo+=imp;
    else { comunTot+=imp; fincas.forEach(f=>R[f.id].comun+=imp*cuota(f)); }
  });
  const ingresos=D.ingresos.filter(i=>i.campana===c);
  let totI=0, kilos=0, ingC=0;
  ingresos.forEach(i=>{
    const imp=Number(i.importe)||0; totI+=imp; kilos+=Number(i.kilos)||0;
    if(i.finca_id && R[i.finca_id]){ R[i.finca_id].ingD+=imp; R[i.finca_id].kilos+=Number(i.kilos)||0; }
    else { ingC+=imp; fincas.forEach(f=>R[f.id].ingC+=imp*cuota(f)); }
  });
  const visibles = D.fincas.filter(f=>f.activa || R[f.id].directo || R[f.id].ingD);
  return {totG,totI,kilos,comunTot,ingC,porCat,R,fincas:visibles,totOl,amort,nG:gastos.length,nI:ingresos.length};
}

// ===== Avisos =====
function avisos(){
  const h=hoy(), u=AJ.umb, out=[];
  D.tareas.filter(t=>!t.hecha).forEach(t=>{
    const d=difDias(h,t.fecha);
    if(d<0) out.push({c:'bad',t:`Tarea atrasada ${-d} día(s): <b>${esc(t.titulo)}</b> · ${esc(fincaNom(t.finca_id))}`,id:t.id,ord:d});
    else if(d<=u.aviso_dias) out.push({c:'',t:`${d===0?'Hoy':d===1?'Mañana':'En '+d+' días'}: <b>${esc(t.titulo)}</b>${t.finca_id?' · '+esc(fincaNom(t.finca_id)):''}`,id:t.id,ord:d});
    const ult=out[out.length-1]; if(ult&&ult.id===t.id) ult.t=`<div class="row" style="flex-wrap:nowrap"><span style="flex:1">${ult.t}</span><button class="btn sec sm" data-hecha="${t.id}">Hecha</button></div>`;
  });
  D.maquinas.filter(m=>m.activa).forEach(m=>{
    [['itv_proxima','ITV'],['seguro_vence','Seguro']].forEach(([k,n])=>{
      if(!m[k]) return; const d=difDias(h,m[k]);
      if(d<0) out.push({c:'bad',t:`${n} de <b>${esc(m.nombre)}</b> caducada desde el ${fFecha(m[k])}`,ord:d,maq:m.id});
      else if(d<=u.itv_dias) out.push({c:d<=7?'bad':'',t:`${n} de <b>${esc(m.nombre)}</b> el ${fFecha(m[k])} (${d} días)`,ord:d,maq:m.id});
    });
  });
  D.tratamientos.forEach(t=>{
    if(!t.plazo_seguridad_dias) return; const fin=addDias(t.fecha,t.plazo_seguridad_dias); const d=difDias(h,fin);
    if(d>0) out.push({c:'bad',t:`No recoger en <b>${esc(fincaNom(t.finca_id))}</b> hasta el ${fFecha(fin)} (plazo de seguridad de ${esc(t.producto)})`,ord:-100});
  });
  const deb=Object.values(pendientes()).reduce((a,b)=>a+b,0);
  if(deb>0) out.push({c:'',t:`Debes <b>${eur(deb)}</b> a trabajadores${D.empresas.length?' y empresas':''}`,ord:50,go:'jornales'});
  return out.sort((a,b)=>a.ord-b.ord);
}

const FORMAS={jornal:'por jornal',hora:'por hora',kilo:'por kilo'};
function empresa(id){ return D.empresas.find(e=>e.id===id); }
function empNom(id){ const e=empresa(id); return e?e.nombre:'(borrada)'; }
function conIva(v,e){ return v*(1+(Number(e.iva_pct)||0)/100); }
function importeJornal(t,h){
  let v;
  const e = t.empresa_id && empresa(t.empresa_id);
  if(e){ v = e.forma_cobro==='hora' ? h*e.precio : e.forma_cobro==='jornal' ? e.precio*h/(Number(e.horas_jornada)||6.5) : 0; v=conIva(v,e); }
  else v = t.precio_hora ? h*t.precio_hora : (t.precio_dia||0)*h/(Number(t.horas_jornada)||6.5);
  return Math.round(v*100)/100;
}
function horasJornada(t){ const e=t.empresa_id&&empresa(t.empresa_id); return Number(e?e.horas_jornada:t.horas_jornada)||6.5; }
function trabNom(id){ const t=D.trabajadores.find(x=>x.id===id); return t?t.nombre:'(borrado)'; }
function grupos(trab,todas=false){ // [{id, nombre, trab:[]}] propios primero
  const g=[{id:'',nombre:'Míos',trab:trab.filter(t=>!t.empresa_id||!empresa(t.empresa_id))}];
  D.empresas.filter(e=>todas||e.activa).forEach(e=>{ const l=trab.filter(t=>t.empresa_id===e.id); if(l.length) g.push({id:e.id,nombre:e.nombre+(e.activa?'':' (baja)'),trab:l,e}); });
  return g.filter(x=>x.trab.length);
}
function abrirParte(){
  const trab=D.trabajadores.filter(t=>t.activo);
  if(!trab.length){ toast('Primero añade a los trabajadores'); SUB.jornales='trab'; ir('jornales'); setTimeout(()=>abrir('trabajadores'),0); return; }
  const sel=new Set((ULT.j_trab||[]).filter(id=>trab.find(t=>t.id===id)));
  const fincaDef = ULT.j_finca ?? (D.fincas.find(f=>f.activa)?.id||'');
  const tareaDef = ULT.j_tarea || 'Recogida';
  const G=grupos(trab);
  const chips=(name,ops,v)=>`<div class="chips" data-chips="${name}">${ops.map(([val,t])=>`<button type="button" class="chip ${String(v)===String(val)?'on':''}" data-val="${esc(val)}">${esc(t)}</button>`).join('')}</div><input type="hidden" name="${name}" value="${esc(v)}">`;
  $('#frm').innerHTML = `<h3>Apuntar jornada</h3>
    ${G.map(g=>`<span class="clab">${G.length>1?esc(g.nombre)+(g.e?` · ${FORMAS[g.e.forma_cobro]}`:''):'¿Quién ha venido?'}</span>
      <div class="chips pTrab" data-g="${g.id}">${g.trab.map(t=>`<button type="button" class="chip ${sel.has(t.id)?'on':''}" data-id="${t.id}">${esc(t.nombre)}</button>`).join('')}<button type="button" class="chip pTodos">Todos</button></div>
      ${g.e&&g.e.forma_cobro==='kilo'?`<label class="hidden" id="kgL_${g.id}">Kilos recogidos por ${esc(g.nombre)} (si ya los sabes)<input name="kg_${g.id}" inputmode="decimal"></label>`:''}`).join('')}
    <span class="clab">Horas</span>${chips('modo',[['J','Jornada'],['M','Media'],['H','Otras…']],ULT.j_modo||'J')}
    <label id="pHorasL" class="${(ULT.j_modo||'J')==='H'?'':'hidden'}">Horas de cada uno<input name="horas" inputmode="decimal" value="${esc(ULT.j_horas||'')}"></label>
    <span class="clab">Finca</span>${chips('finca_id',opsFincas(),fincaDef)}
    <span class="clab">Faena</span>${chips('tarea',JOR_TAREAS.map(x=>[x,x]),tareaDef)}
    <label>Día<input type="date" name="fecha" value="${hoy()}"></label>
    <div class="chips" style="margin-top:-6px"><button type="button" class="chip" data-qf="fecha" data-n="0">Hoy</button><button type="button" class="chip" data-qf="fecha" data-n="-1">Ayer</button></div>
    <p id="pRes" class="mut"></p>
    <div class="row" style="justify-content:flex-end"><button type="button" class="btn sec" id="fCancel">Cancelar</button><button class="btn" id="fOk">Guardar</button></div>`;
  const F=$('#frm'); activarChips(F);
  const horasDe=t=>{ const m=F.modo.value; const j=horasJornada(t); return m==='J'?j:m==='M'?j/2:(pn(F.horas.value)||0); };
  const marcados=()=>[...F.querySelectorAll('.pTrab .chip.on[data-id]')].map(b=>b.dataset.id);
  const kgEmp=()=>G.filter(g=>g.e&&g.e.forma_cobro==='kilo').map(g=>({e:g.e, kg:pn(F[`kg_${g.id}`].value)})).filter(x=>x.kg>0);
  const resumen=()=>{
    const ids=marcados();
    G.filter(g=>g.e&&g.e.forma_cobro==='kilo').forEach(g=>$(`#kgL_${g.id}`).classList.toggle('hidden',!g.trab.some(t=>ids.includes(t.id))));
    let tot=ids.reduce((s,id)=>{ const t=trab.find(x=>x.id===id); return s+importeJornal(t,horasDe(t)); },0);
    tot+=kgEmp().reduce((s,x)=>s+conIva(x.kg*x.e.precio,x.e),0);
    const rep=ids.filter(id=>D.jornales.some(j=>j.trabajador_id===id&&j.fecha===F.fecha.value)).map(trabNom);
    $('#pRes').innerHTML = ids.length ? `<b>${ids.length} ${ids.length===1?'persona':'personas'} · ${eur(tot)}</b>${rep.length?`<br><span class="neg">Ya tienen jornada ese día: ${esc(rep.join(', '))}</span>`:''}` : 'Toca a quien haya venido.';
  };
  F.querySelectorAll('.pTrab .chip[data-id]').forEach(b=>b.onclick=()=>{ b.classList.toggle('on'); resumen(); });
  F.querySelectorAll('.pTodos').forEach(b=>b.onclick=()=>{ const all=b.parentElement.querySelectorAll('.chip[data-id]'); const on=[...all].every(x=>x.classList.contains('on')); all.forEach(x=>x.classList.toggle('on',!on)); resumen(); });
  F.modo.addEventListener('change',()=>{ $('#pHorasL').classList.toggle('hidden',F.modo.value!=='H'); if(F.modo.value==='H') F.horas.focus(); resumen(); });
  F.oninput=resumen; F.fecha.addEventListener('change',resumen);
  F.querySelectorAll('[data-qf]').forEach(b=>b.addEventListener('click',resumen));
  $('#fCancel').onclick=()=>$('#dlg').close();
  F.onsubmit=async e=>{
    e.preventDefault();
    const ids=marcados();
    if(!ids.length){ toast('Toca a quien haya venido'); return; }
    if(F.modo.value==='H' && !(pn(F.horas.value)>0)){ toast('Pon las horas'); return; }
    const fecha=F.fecha.value||hoy(), finca=F.finca_id.value||null;
    const filas=ids.map(id=>{ const t=trab.find(x=>x.id===id); const h=horasDe(t); return {fecha, trabajador_id:id, empresa_id:(t.empresa_id&&empresa(t.empresa_id))?t.empresa_id:null, finca_id:finca, horas:h, tarea:F.tarea.value||null, importe:importeJornal(t,h)}; });
    const serv=kgEmp().map(x=>({fecha, empresa_id:x.e.id, finca_id:finca, kilos:x.kg, importe:Math.round(conIva(x.kg*x.e.precio,x.e)*100)/100}));
    $('#fOk').disabled=true;
    let r=await insertar('jornales',filas); let offline=r.offline;
    if(r.ok && serv.length){ r=await insertar('servicios',serv); offline=offline||r.offline; }
    if(!r.ok){ $('#fOk').disabled=false; toast('Error: '+r.error.message); return; }
    recordar('j_trab',ids); recordar('j_finca',F.finca_id.value); recordar('j_tarea',F.tarea.value); recordar('j_modo',F.modo.value); recordar('j_horas',F.horas.value);
    $('#dlg').close(); if(!offline) await Promise.all([cargar('jornales'),cargar('servicios')]); pintarCampanas(); render();
    toast(`${filas.length} ${filas.length===1?'jornada guardada':'jornadas guardadas'} · ${eur(filas.reduce((s,f)=>s+f.importe,0)+serv.reduce((s,f)=>s+f.importe,0))}${offline?' en el móvil':''}`);
  };
  $('#dlg').showModal(); resumen();
}
function claveDeuda(j){ return j.empresa_id ? 'e:'+j.empresa_id : 't:'+j.trabajador_id; }
function pendientes(){ const p={}; const add=(k,v)=>p[k]=(p[k]||0)+Number(v);
  D.jornales.filter(j=>!j.pagado).forEach(j=>add(claveDeuda(j),j.importe));
  D.servicios.filter(s=>!s.pagado).forEach(s=>add('e:'+s.empresa_id,s.importe));
  return p; }
async function pagar(clave){
  if(COLA.length){ toast('Primero tienen que subirse los apuntes pendientes'); vaciarCola(); return; }
  const deuda=pendientes()[clave]||0; const [tipo,id]=clave.split(':');
  const nom = tipo==='e'?empNom(id):trabNom(id);
  if(!confirm(`¿Marcar como pagado todo lo de ${nom}? (${eur(deuda)})`)) return;
  const upd={pagado:true,pagado_fecha:hoy()}; let r;
  if(tipo==='t') r=await sb.from('olv_jornales').update(upd).eq('trabajador_id',id).eq('pagado',false).is('empresa_id',null);
  else { r=await sb.from('olv_jornales').update(upd).eq('empresa_id',id).eq('pagado',false); if(!r.error) r=await sb.from('olv_servicios').update(upd).eq('empresa_id',id).eq('pagado',false); }
  if(r.error){ if(!sinRed(r.error)) toast('Error: '+r.error.message); return; }
  await Promise.all([cargar('jornales'),cargar('servicios')]); render(); toast(`Pagado ${eur(deuda)} a ${nom}`);
}
function vJornales(){
  const s=SUB.jornales||'libreta';
  fab(s==='trab'?'trabajadores':abrirParte);
  const tabs=`<div class="tabs2"><button data-sub="jornales:libreta" class="${s==='libreta'?'on':''}">Libreta</button><button data-sub="jornales:cuentas" class="${s==='cuentas'?'on':''}">Qué debo</button><button data-sub="jornales:trab" class="${s==='trab'?'on':''}">Gente y empresas</button></div>`;
  const [ini,fin]=campRango(CAMP);
  const l=D.jornales.filter(j=>j.fecha>=ini&&j.fecha<=fin);
  const sv=D.servicios.filter(x=>x.fecha>=ini&&x.fecha<=fin);
  if(s==='trab'){
    const G=grupos(D.trabajadores.slice().sort((a,b)=>Number(b.activo)-Number(a.activo)),true);
    return tabs+`<div class="card"><h2>Empresas de servicios<span class="sp"></span><button class="btn sec sm" onclick="abrir('empresas')">+ Empresa</button></h2>${D.empresas.length?`<table>${D.empresas.map(e=>`<tr class="click" data-ed="empresas:${e.id}"><td>${esc(e.nombre)}${e.activa?'':' <span class="tag">baja</span>'}<div class="mut">${FORMAS[e.forma_cobro]}${e.cif?' · '+esc(e.cif):''}</div></td><td class="n">${eur(e.precio)}${e.forma_cobro==='kilo'?'/kg':e.forma_cobro==='hora'?'/h':'/jornal'}<div class="mut">+ ${num(e.iva_pct)} % IVA</div></td></tr>`).join('')}</table>`:'<p class="mut">Si te mandan cuadrillas de una empresa, dala de alta aquí con su precio.</p>'}</div>
    <div class="card"><h2>Trabajadores</h2>${D.trabajadores.length?G.map(g=>`<div class="grp">${esc(g.nombre)}</div><table>${g.trab.map(t=>`<tr class="click" data-ed="trabajadores:${t.id}"><td>${esc(t.nombre)}${t.activo?'':' <span class="tag">baja</span>'}${t.telefono?`<div class="mut">${esc(t.telefono)}</div>`:''}</td><td class="n">${g.e?'<span class="mut">precio de la empresa</span>':t.precio_hora?eur(t.precio_hora)+'/h':eur(t.precio_dia)}</td></tr>`).join('')}</table>`).join(''):'<p class="mut">Pulsa + para añadir a quien trabaja contigo.</p>'}</div>`;
  }
  if(s==='cuentas'){
    const p=pendientes();
    const filas=[];
    D.trabajadores.forEach(t=>{ const js=l.filter(j=>!j.empresa_id&&j.trabajador_id===t.id); const deb=p['t:'+t.id]||0; if(js.length||deb) filas.push({clave:'t:'+t.id, nom:t.nombre, sub:'', dias:new Set(js.map(j=>j.fecha)).size, horas:js.reduce((a,j)=>a+Number(j.horas),0), imp:js.reduce((a,j)=>a+Number(j.importe),0), deb}); });
    D.empresas.forEach(e=>{ const js=l.filter(j=>j.empresa_id===e.id), ss=sv.filter(x=>x.empresa_id===e.id); const deb=p['e:'+e.id]||0; const kg=ss.reduce((a,x)=>a+(Number(x.kilos)||0),0);
      if(js.length||ss.length||deb) filas.push({clave:'e:'+e.id, nom:e.nombre, e, sub:`${js.length} ${js.length===1?'jornal':'jornales'}${kg?' · '+num(kg)+' kg':''}`, dias:new Set([...js,...ss].map(j=>j.fecha)).size, horas:js.reduce((a,j)=>a+Number(j.horas),0), imp:js.reduce((a,j)=>a+Number(j.importe),0)+ss.reduce((a,x)=>a+Number(x.importe),0), deb}); });
    const totDeb=Object.values(p).reduce((a,b)=>a+b,0);
    const kiloE=D.empresas.filter(e=>e.activa&&e.forma_cobro==='kilo');
    return tabs+`<div class="card"><h2>Qué debo<span class="sp"></span><button class="btn sec sm" onclick="csv('jornales')">CSV</button></h2><p class="mut">Pendiente de pagar: <b class="${totDeb?'neg':''}">${eur(totDeb)}</b> · Campaña ${esc(CAMP)}: ${eur(filas.reduce((a,r)=>a+r.imp,0))}</p>
    ${filas.length?`<div class="scroll"><table><tr><th>Quién</th><th class="n">Días</th><th class="n">Horas</th><th class="n">Campaña</th><th class="n">Debo</th></tr>${filas.map(r=>`<tr><td>${esc(r.nom)}${r.sub?`<div class="mut">${esc(r.sub)}</div>`:''}</td><td class="n">${r.dias}</td><td class="n">${num(r.horas,1)}</td><td class="n">${eur(r.imp)}</td><td class="n">${r.deb?`<button class="btn sm" onclick="pagar('${r.clave}')">Pagar ${eur(r.deb)}</button>`:'<span class="pos">al día</span>'}</td></tr>`).join('')}</table></div>`:'<p class="mut">Sin jornadas todavía.</p>'}
    ${kiloE.length?`<div class="row" style="margin-top:10px">${kiloE.map(e=>`<button class="btn sec sm" onclick="abrir('servicios',null,{empresa_id:'${e.id}'})">+ Kilos de ${esc(e.nombre)}</button>`).join('')}</div>`:''}</div>`;
  }
  const dias=[...new Set([...l,...sv].map(j=>j.fecha))].sort().reverse();
  return tabs+`<button class="btn" style="width:100%;padding:14px;font-size:16px;margin-bottom:12px" onclick="abrirParte()">+ Apuntar jornada</button>
  <div class="card">${dias.length?dias.map(d=>{ const js=l.filter(j=>j.fecha===d), ss=sv.filter(x=>x.fecha===d); const [y,m,dd]=d.split('-').map(Number);
    return `<div class="grp">${DIAS[new Date(y,m-1,dd).getDay()]} ${fFecha(d)} · ${js.length} ${js.length===1?'persona':'personas'} · ${eur(js.reduce((a,j)=>a+Number(j.importe),0)+ss.reduce((a,x)=>a+Number(x.importe),0))}</div><table>${js.map(j=>`<tr class="click" data-ed="jornales:${j.id}"><td>${esc(trabNom(j.trabajador_id))}<div class="mut">${j.empresa_id?esc(empNom(j.empresa_id))+' · ':''}${esc(j.tarea||'')}${j.tarea?' · ':''}${esc(fincaNom(j.finca_id))}</div></td><td class="n">${num(j.horas,1)} h</td><td class="n">${eur(j.importe)}${j.pagado?'<div class="pos" style="font-size:12px">pagado</div>':''}</td></tr>`).join('')}${ss.map(x=>`<tr class="click" data-ed="servicios:${x.id}"><td>${esc(empNom(x.empresa_id))}<div class="mut">kilos recogidos · ${esc(fincaNom(x.finca_id))}</div></td><td class="n">${num(x.kilos)} kg</td><td class="n">${eur(x.importe)}${x.pagado?'<div class="pos" style="font-size:12px">pagado</div>':''}</td></tr>`).join('')}</table>`; }).join(''):'<p class="mut">Aún no hay jornadas en esta campaña.</p>'}</div>`;
}
function vCuentas(){
  const s=SUB.cuentas||'gastos';
  const tabs=`<div class="tabs2"><button data-sub="cuentas:gastos" class="${s==='gastos'?'on':''}">Gastos</button><button data-sub="cuentas:ingresos" class="${s==='ingresos'?'on':''}">Cobros</button></div>`;
  return tabs+(s==='gastos'?vGastos():vIngresos());
}

// ===== Vistas =====
function ir(v){ VIEW=v; document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===v)); render(); scrollTo(0,0); }
document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>ir(b.dataset.v));
function fab(k){ const f=$('#fab'); if(!k){f.classList.add('hidden');return;} f.classList.remove('hidden'); f.onclick= typeof k==='function' ? k : ()=>abrir(k); }

function render(){
  const V={inicio:vInicio,cuentas:vCuentas,jornales:vJornales,campo:vCampo,tiempo:vTiempo,mas:vMas}[VIEW];
  $('#view').innerHTML = V();
  const post={tiempo:postTiempo,mas:postMas}[VIEW]; if(post) post();
  document.querySelectorAll('[data-ed]').forEach(el=>el.onclick=e=>{ if(e.target.closest('[data-hecha]')) return; const [k,id]=el.dataset.ed.split(':'); abrir(k, D[k].find(x=>x.id===id)); });
  document.querySelectorAll('[data-hecha]').forEach(el=>el.onclick=e=>{ e.stopPropagation(); marcarHecha(el.dataset.hecha); });
  document.querySelectorAll('[data-sub]').forEach(el=>el.onclick=()=>{ const [v,s]=el.dataset.sub.split(':'); SUB[v]=s; render(); });
  document.querySelectorAll('[data-go]').forEach(el=>el.onclick=()=>ir(el.dataset.go));
}

function vInicio(){
  fab(null);
  if(!D.fincas.length) return `<div class="card"><h2>Empieza por aquí</h2><p>Da de alta tus fincas con su número de olivos (sirve para repartir los gastos comunes) y sus coordenadas (para el tiempo).</p><button class="btn" onclick="ir('mas');setTimeout(()=>abrir('fincas'),0)">Añadir finca</button></div>`;
  const C=calcular(CAMP), m=C.totI-C.totG, av=avisos();
  const avHtml = av.length ? av.map(a=>`<div class="aviso ${a.c}" ${a.id?`data-ed="tareas:${a.id}" style="cursor:pointer"`:a.maq?`data-ed="maquinas:${a.maq}" style="cursor:pointer"`:a.go?`onclick="SUB.jornales='cuentas';ir('jornales')" style="cursor:pointer"`:''}>${a.t}</div>`).join('') : '<div class="aviso ok">Nada pendiente en los próximos días.</div>';
  const cats=Object.entries(C.porCat).sort((a,b)=>b[1]-a[1]); const mx=cats[0]?.[1]||1;
  const filas=C.fincas.map(f=>{ const r=C.R[f.id]; const g=r.directo+r.comun, i=r.ingD+r.ingC, mg=i-g;
    return `<tr><td>${esc(f.nombre)}<div class="mut">${f.activa?`${num(f.olivos)} olivos · ${num(C.totOl?f.olivos/C.totOl*100:0,1)} %`:'inactiva'}</div></td><td class="n">${eur(g)}<div class="mut">${eur(r.directo)} propios<br>${eur(r.comun)} común</div></td><td class="n">${eur(i)}</td><td class="n ${mg>=0?'pos':'neg'}"><b>${eur(mg)}</b><div class="mut">${f.olivos?eur(g/f.olivos)+'/olivo':''}</div></td></tr>`; }).join('');
  return `
  <div class="quick"><button onclick="abrir('gastos')"><b>+</b>Gasto</button><button onclick="abrirParte()"><b>+</b>Jornada</button><button onclick="abrir('ingresos')"><b>+</b>Cobro</button><button onclick="abrir('tareas')"><b>+</b>Tarea</button></div>
  <div class="card"><h2>Avisos</h2>${avHtml}</div>
  <div class="kpis">
    <div class="kpi"><span>Ingresos ${esc(CAMP)}</span><b>${eur(C.totI)}</b></div>
    <div class="kpi"><span>Gastos ${esc(CAMP)}</span><b>${eur(C.totG)}</b></div>
    <div class="kpi"><span>Margen</span><b class="${m>=0?'pos':'neg'}">${eur(m)}</b></div>
    <div class="kpi"><span>Kilos aceituna</span><b>${num(C.kilos)}</b></div>
    <div class="kpi"><span>Coste por kg</span><b>${C.kilos?eur(C.totG/C.kilos):'—'}</b></div>
    <div class="kpi"><span>Coste por olivo</span><b>${C.totOl?eur(C.totG/C.totOl):'—'}</b></div>
  </div>
  <div class="card"><h2>Por finca</h2><div class="scroll"><table>
    <tr><th>Finca</th><th class="n">Gastos</th><th class="n">Ingresos</th><th class="n">Margen</th></tr>${filas}
  </table></div><p class="mut">Gastos comunes (${eur(C.comunTot)}) e ingresos sin finca (${eur(C.ingC)}) se reparten por nº de olivos.${C.amort.length?` Incluye ${eur(C.amort.reduce((s,a)=>s+a.importe,0))} de amortización de maquinaria.`:''}</p></div>
  <div class="card"><h2>Gastos por categoría</h2>${cats.length?`<table>${cats.map(([k,v])=>`<tr><td style="width:40%">${esc(k)}</td><td style="min-width:70px"><div class="bar"><i style="width:${v/mx*100}%"></i></div></td><td class="n">${eur(v)}</td><td class="n mut">${num(C.totG?v/C.totG*100:0)} %</td></tr>`).join('')}</table>`:'<p class="mut">Sin gastos en esta campaña.</p>'}</div>`;
}

function filtroFinca(v){
  const s=SUB[v+'F']||'*';
  return `<select onchange="SUB['${v}F']=this.value;render()" style="width:auto"><option value="*">Todas</option><option value="" ${s===''?'selected':''}>Común</option>${D.fincas.map(f=>`<option value="${f.id}" ${s===f.id?'selected':''}>${esc(f.nombre)}</option>`).join('')}</select>`;
}
function vGastos(){
  fab('gastos'); const [ini,fin]=campRango(CAMP); const fF=SUB.gastosF||'*', fC=SUB.gastosC||'*';
  const l=D.gastos.filter(g=>g.fecha>=ini&&g.fecha<=fin&&(fF==='*'||(g.finca_id||'')===fF)&&(fC==='*'||g.categoria===fC));
  const tot=l.reduce((s,g)=>s+Number(g.importe),0);
  const catsU=[...new Set([...AJ.cats,...D.gastos.map(g=>g.categoria)])];
  return `<div class="card"><h2>Gastos ${esc(CAMP)}<span class="sp"></span><button class="btn sec sm" onclick="csv('gastos')">CSV</button></h2>
  <div class="row" style="margin-bottom:8px">${filtroFinca('gastos')}<select onchange="SUB.gastosC=this.value;render()" style="width:auto"><option value="*">Todas las categorías</option>${catsU.map(c=>`<option ${c===fC?'selected':''}>${esc(c)}</option>`).join('')}</select></div>
  <p class="mut">${l.length} gastos · <b>${eur(tot)}</b></p>

// ===== Tiempo =====
const WCODE = c => c===0?'Despejado':c<=2?'Poco nuboso':c===3?'Nublado':c<=48?'Niebla':c<=57?'Llovizna':c<=67?'Lluvia':c<=77?'Nieve':c<=82?'Chubascos':c<=86?'Nieve':'Tormenta';
const DIAS=['dom','lun','mar','mié','jue','vie','sáb'];
let METEO_CACHE={};
function vTiempo(){
  fab(null);
  const conCoord=D.fincas.filter(f=>f.activa&&f.lat!=null&&f.lon!=null);
  if(!conCoord.length) return `<div class="card"><h2>Tiempo</h2><p>Pon latitud y longitud a alguna finca (Más → Fincas) para ver la previsión.</p></div>`;
  if(!SUB.tiempo || !conCoord.find(f=>f.id===SUB.tiempo)) SUB.tiempo=conCoord[0].id;
  return `<div class="card"><div class="row"><select id="tFinca" style="width:auto" onchange="SUB.tiempo=this.value;render()">${conCoord.map(f=>`<option value="${f.id}" ${f.id===SUB.tiempo?'selected':''}>${esc(f.nombre)}</option>`).join('')}</select><span class="mut">Previsión 7 días · Open-Meteo</span></div></div><div id="tOut"><div class="card mut">Cargando previsión…</div></div>`;
}
async function postTiempo(){
  const f=D.fincas.find(x=>x.id===SUB.tiempo); if(!f) return;
  const key=f.lat+','+f.lon; let w=METEO_CACHE[key];
  if(!w || Date.now()-w._t>30*60e3){
    try{
      const url=`https://api.open-meteo.com/v1/forecast?latitude=${f.lat}&longitude=${f.lon}&hourly=temperature_2m,relative_humidity_2m,precipitation,precipitation_probability,wind_speed_10m,wind_gusts_10m&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_sum,precipitation_probability_max,wind_gusts_10m_max&timezone=Europe%2FMadrid&past_days=1&forecast_days=7`;
      const r=await fetch(url); if(!r.ok) throw new Error(r.status); w=await r.json(); w._t=Date.now(); METEO_CACHE[key]=w;
    }catch(e){ const o=$('#tOut'); if(o) o.innerHTML=`<div class="card neg">No se pudo cargar la previsión (${esc(e.message)}).</div>`; return; }
  }
  const o=$('#tOut'); if(!o||SUB.tiempo!==f.id) return;
  const dias=evaluarTiempo(w);
  const sel=SUB.tDia;
  o.innerHTML=`<div class="card"><div class="scroll"><table>
    <tr><th>Día</th><th>Tiempo</th><th>Atomizar</th><th>Trabajar</th><th>Aceituna</th></tr>
    ${dias.map(d=>`<tr class="click" onclick="SUB.tDia=SUB.tDia==='${d.fecha}'?null:'${d.fecha}';postTiempo()" ${d.fecha===sel?'style="background:rgba(127,127,100,.1)"':''}><td><b>${d.nombre}</b><div class="mut">${fFecha(d.fecha)}</div></td>
      <td>${WCODE(d.code)}<div class="mut">${num(d.tmin)}–${num(d.tmax)}° · ${d.lluvia>0?num(d.lluvia,1)+' mm':'sin lluvia'} · ráf. ${num(d.rafaga)} km/h</div></td>
      <td><span class="dot ${d.spray.c}"></span>${esc(d.spray.txt)}</td><td><span class="dot ${d.work.c}"></span>${esc(d.work.txt)}</td><td><span class="dot ${d.ace.c}"></span>${esc(d.ace.txt)}</td></tr>`).join('')}
  </table></div><p class="mut">Pulsa un día para ver hora a hora. Los criterios se cambian en Más → Ajustes del tiempo. Viento medido a 10 m; en la copa del olivo suele ser algo menor.</p></div>
  ${sel?horario(w,sel):''}`;
}
function horas(w){ const H=w.hourly; return H.time.map((t,i)=>({fecha:t.slice(0,10),h:+t.slice(11,13),t:H.temperature_2m[i],hr:H.relative_humidity_2m[i],p:H.precipitation[i]||0,pp:H.precipitation_probability[i]??0,v:H.wind_speed_10m[i],r:H.wind_gusts_10m[i]})); }
function evaluarTiempo(w){
  const u=AJ.umb, H=horas(w), Dd=w.daily, out=[];
  Dd.time.forEach((fecha,i)=>{
    if(fecha<hoy()) return;
    const ayer=i>0?(Dd.precipitation_sum[i-1]||0):0;
    const hh=H.filter(x=>x.fecha===fecha);
    // atomizar
    const motivos={viento:0,calma:0,lluvia:0,calor:0,frio:0,seco:0}; let mejor=[],act=[];
    hh.filter(x=>x.h>=6&&x.h<=21).forEach(x=>{
      const idx=H.indexOf(x); const sig=H.slice(idx,idx+u.spray_horas_lluvia+1);
      const lluvia=sig.some(y=>y.p>0||y.pp>=u.spray_pmax);
      let ok=true;
      if(x.v>u.spray_vmax||x.r>u.spray_rmax){ok=false;motivos.viento++;}
      if(x.v<u.spray_vmin){ok=false;motivos.calma++;}
      if(lluvia){ok=false;motivos.lluvia++;}
      if(x.t>u.spray_tmax){ok=false;motivos.calor++;}
      if(x.t<u.spray_tmin){ok=false;motivos.frio++;}
      if(x.hr<u.spray_hrmin){ok=false;motivos.seco++;}
      if(ok){act.push(x.h); if(act.length>mejor.length) mejor=act.slice();} else act=[];
    });
    const nomMot={viento:'mucho viento',calma:'viento en calma',lluvia:'lluvia',calor:'calor',frio:'frío',seco:'aire seco'};
    const peor=Object.entries(motivos).sort((a,b)=>b[1]-a[1])[0];
    const spray = mejor.length>=u.spray_min_horas ? {c:'g',txt:`${mejor[0]}–${mejor[mejor.length-1]+1} h`} : mejor.length ? {c:'a',txt:`solo ${mejor[0]}–${mejor[mejor.length-1]+1} h`} : {c:'r',txt:nomMot[peor[0]]};
    // trabajar
    const dia=hh.filter(x=>x.h>=8&&x.h<=18);
    const ll=dia.reduce((s,x)=>s+x.p,0), tmax=Math.max(...dia.map(x=>x.t)), rmax=Math.max(...dia.map(x=>x.r));
    let work;
    if(ll<u.work_lluvia && tmax<=u.work_tmax && rmax<u.work_rmax) work={c:'g',txt:'bien'};
    else if(ll<3*u.work_lluvia && tmax<=u.work_tmax+3) work={c:'a',txt: ll>=u.work_lluvia?`algo de lluvia (${num(ll,1)} mm)`:tmax>u.work_tmax?`calor (${num(tmax)}°)`:'viento fuerte'};
    else work={c:'r',txt: ll>=3*u.work_lluvia?`lluvia (${num(ll,1)} mm)`:tmax>u.work_tmax?`calor (${num(tmax)}°)`:'viento fuerte'};
    // aceituna
    let ace;
    if(work.c==='r') ace={c:'r',txt:work.txt};
    else if(ayer>=u.ace_lluvia_ayer_max) ace={c:'r',txt:`barro: ${num(ayer,1)} mm el día antes`};
    else if(ayer>=u.ace_lluvia_ayer) ace={c:'a',txt:`suelo húmedo (${num(ayer,1)} mm ayer)`};
    else ace=work.c==='g'?{c:'g',txt:'bien'}:{c:'a',txt:work.txt};
    const [y,m,d]=fecha.split('-').map(Number);
    out.push({fecha,nombre:fecha===hoy()?'Hoy':DIAS[new Date(y,m-1,d).getDay()],code:Dd.weather_code[i],tmin:Dd.temperature_2m_min[i],tmax:Dd.temperature_2m_max[i],lluvia:Dd.precipitation_sum[i]||0,rafaga:Dd.wind_gusts_10m_max[i],spray,work,ace});
  });
  return out;
}
function horario(w,fecha){
  const hh=horas(w).filter(x=>x.fecha===fecha&&x.h>=6&&x.h<=21);
  return `<div class="card"><h2>${fFecha(fecha)} hora a hora</h2><div class="scroll"><table><tr><th>Hora</th><th class="n">Temp.</th><th class="n">Humedad</th><th class="n">Viento</th><th class="n">Ráfagas</th><th class="n">Lluvia</th></tr>
  ${hh.map(x=>`<tr><td>${x.h}:00</td><td class="n">${num(x.t)}°</td><td class="n">${num(x.hr)} %</td><td class="n">${num(x.v)} km/h</td><td class="n">${num(x.r)} km/h</td><td class="n">${x.p?num(x.p,1)+' mm':''} <span class="mut">${num(x.pp)} %</span></td></tr>`).join('')}</table></div></div>`;
}

    <b>Trabajar en el campo</b><div class="grid2">${inp('work_tmax','Temp. máxima (°)')}${inp('work_rmax','Ráfagas máximas (km/h)')}${inp('work_lluvia','Lluvia máx. de 8 a 18 h (mm)')}</div>

function bajar(nombre, contenido, tipo){ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([contenido],{type:tipo})); a.download=nombre; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1000); }
function csv(k){
  const [ini,fin]=campRango(CAMP); const sep=';'; const q=v=>`"${String(v??'').replace(/"/g,'""')}"`; const n=v=>v==null?'':String(v).replace('.',',');
  let rows;
  if(k==='gastos') rows=[['Fecha','Categoría','Concepto','Finca','Máquina','Proveedor','Importe','Notas'], ...D.gastos.filter(g=>g.fecha>=ini&&g.fecha<=fin).map(g=>[g.fecha,g.categoria,g.concepto,fincaNom(g.finca_id),maqNom(g.maquina_id),g.proveedor,n(g.importe),g.notas])];
  else if(k==='ingresos') rows=[['Fecha','Campaña','Tipo','Finca','Kilos','Rendimiento %','Precio €/kg','Importe','Notas'], ...D.ingresos.filter(i=>i.campana===CAMP).map(i=>[i.fecha,i.campana,i.tipo,fincaNom(i.finca_id),n(i.kilos),n(i.rendimiento),n(i.precio_kg),n(i.importe),i.notas])];
  else if(k==='jornales') rows=[['Fecha','Trabajador','Empresa','Finca','Faena','Horas','Kilos','Importe','Pagado','Fecha pago'], ...D.jornales.filter(j=>j.fecha>=ini&&j.fecha<=fin).map(j=>[j.fecha,trabNom(j.trabajador_id),j.empresa_id?empNom(j.empresa_id):'',fincaNom(j.finca_id),j.tarea,n(j.horas),'',n(j.importe),j.pagado?'sí':'no',j.pagado_fecha]), ...D.servicios.filter(x=>x.fecha>=ini&&x.fecha<=fin).map(x=>[x.fecha,'',empNom(x.empresa_id),fincaNom(x.finca_id),'Kilos','',n(x.kilos),n(x.importe),x.pagado?'sí':'no',x.pagado_fecha])];
  else rows=[['Fecha','Finca','Producto','Nº registro','Dosis','Plaga/motivo','Superficie ha','Aplicador','Plazo seguridad días','Notas'], ...D.tratamientos.map(t=>[t.fecha,fincaNom(t.finca_id),t.producto,t.num_registro,t.dosis,t.motivo,n(t.superficie_ha),t.aplicador,t.plazo_seguridad_dias,t.notas])];
  bajar(`olivas_${k}_${CAMP.replace('/','-')}.csv`, '﻿'+rows.map(r=>r.map(q).join(sep)).join('\r\n'), 'text/csv;charset=utf-8');
}
function copia(){ bajar(`olivas_copia_${hoy()}.json`, JSON.stringify({version:1, fecha:new Date().toISOString(), ajustes:AJ, datos:D}, null, 1), 'application/json'); }
function ics(){
  const ev=[]; const f=s=>s.replace(/-/g,''); const e=s=>String(s).replace(/[\\;,]/g,m=>'\\'+m).replace(/\n/g,'\\n');
  const add=(uid,fecha,tit,alarmDias)=>ev.push(`BEGIN:VEVENT\r\nUID:${uid}@olivas\r\nDTSTAMP:${new Date().toISOString().replace(/[-:]/g,'').slice(0,15)}Z\r\nDTSTART;VALUE=DATE:${f(fecha)}\r\nDTEND;VALUE=DATE:${f(addDias(fecha,1))}\r\nSUMMARY:${e(tit)}\r\nBEGIN:VALARM\r\nACTION:DISPLAY\r\nDESCRIPTION:${e(tit)}\r\nTRIGGER:-P${alarmDias-1}DT15H\r\nEND:VALARM\r\nEND:VEVENT`);
  D.tareas.filter(t=>!t.hecha&&t.fecha>=hoy()).forEach(t=>add('t'+t.id,t.fecha,`Olivas: ${t.titulo}${t.finca_id?' ('+fincaNom(t.finca_id)+')':''}`,1));
  D.maquinas.filter(m=>m.activa).forEach(m=>{ if(m.itv_proxima>=hoy()) add('i'+m.id,m.itv_proxima,`ITV ${m.nombre}`,14); if(m.seguro_vence>=hoy()) add('s'+m.id,m.seguro_vence,`Seguro ${m.nombre}`,14); });
  if(!ev.length){ toast('No hay nada pendiente que exportar'); return; }
  bajar('olivas_avisos.ics',`BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//Olivas//ES\r\n${ev.join('\r\n')}\r\nEND:VCALENDAR\r\n`,'text/calendar');
}

arranque();
</script>
</body>
</html>
