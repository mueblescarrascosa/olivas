<style>
:root{--bg:#f6f5ef;--card:#fff;--ink:#22261c;--mut:#6b7060;--line:#e2e0d4;--olv:#4b5d2a;--olv2:#6f8a3c;--ok:#2a7d38;--warn:#c58a0b;--bad:#c0392b;--sh:0 1px 3px rgba(0,0,0,.08)}
@media (prefers-color-scheme:dark){:root{--bg:#171a13;--card:#21251b;--ink:#ecebe3;--mut:#a3a796;--line:#353a2c;--olv:#9bb55f;--olv2:#b5cc7c;--sh:none}}
*{box-sizing:border-box}
body{margin:0;font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:140px}
header{position:sticky;top:0;z-index:5;background:var(--olv);color:#fff;padding:10px 16px;display:flex;align-items:center;gap:10px}
@media (prefers-color-scheme:dark){header{color:#171a13}}
header h1{font-size:18px;margin:0;flex:1}
header select{background:transparent;color:inherit;border:1px solid currentColor;border-radius:6px;padding:4px 6px;font:inherit;width:auto}
header select option{color:#000}
main{max-width:900px;margin:0 auto;padding:12px 16px}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;z-index:6;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;min-width:0;border:0;background:none;color:var(--mut);padding:7px 2px 6px;font:12px system-ui;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:58px}
nav button svg{width:24px;height:24px;flex:none}
nav button span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
nav button.on,nav button.onm{color:var(--olv);font-weight:700;box-shadow:inset 0 3px 0 var(--olv)}
nav button.on svg,nav button.onm svg{stroke-width:2.2}
nav button.pc{display:none}
.irCuentas{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:12px 14px;margin:0 0 12px;font:inherit;cursor:pointer;box-shadow:var(--sh)}
.irCuentas svg{width:30px;height:30px;color:var(--olv);flex:none}.irCuentas .tx{flex:1;display:flex;flex-direction:column;gap:2px}.irCuentas .tx b{font-size:16px}.irCuentas .fl{font-size:24px;color:var(--mut)}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:0 0 12px;box-shadow:var(--sh)}
.card h2{font-size:16px;margin:0 0 8px;display:flex;align-items:center;gap:8px}
.card h2 .sp{flex:1}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-bottom:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.kpi b{display:block;font-size:20px}
.kpis.cmp{gap:6px;margin-bottom:10px}.kpis.cmp .kpi{padding:6px 10px}.kpis.cmp .kpi b{font-size:18px}
.kpi span{color:var(--mut);font-size:12px}.kpi b span.neg{color:var(--bad);font-size:inherit}.kpi b span.pos{color:var(--ok);font-size:inherit}
.crono{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;background:var(--olv);color:#fff;border-radius:12px;padding:8px 12px;margin-bottom:10px}
.crono .btn.sec{background:rgba(255,255,255,.15);color:#fff;border-color:rgba(255,255,255,.4)}.crono .btn:not(.sec){background:#fff;color:var(--olv)}
.wid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:12px}
@media(min-width:900px){.wid{grid-template-columns:repeat(6,1fr)}}
.wg.ancho{grid-column:span 2}
.spark{display:block;width:100%;height:34px;margin-top:4px}
.wg{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;min-height:86px;display:flex;flex-direction:column;gap:2px}
.wg:hover{border-color:var(--olv)}
.wg .wt{color:var(--mut);font-size:12px;display:flex;justify-content:space-between;gap:6px}
.wg .wt span:nth-child(2){overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.wg .wv{font-size:22px;font-weight:700;line-height:1.15}
.wg .wv .ic{font-size:24px;margin-right:4px}
.wg .ws{font-size:12.5px;color:var(--mut)}
.pos{color:var(--ok)}.neg{color:var(--bad)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--mut);font-weight:600;font-size:12px}
td.n,th.n{text-align:right;white-space:nowrap}
tr.click{cursor:pointer}tr.click:hover{background:rgba(127,127,100,.08)}
.scroll{overflow-x:auto}
.btn{border:1px solid var(--olv);background:var(--olv);color:#fff;border-radius:8px;padding:8px 12px;font:inherit;cursor:pointer}
@media (prefers-color-scheme:dark){.btn{color:#171a13}}
.btn.sec{background:transparent;color:var(--olv)}
.btn.del{background:transparent;color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:4px 8px;font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.mut{color:var(--mut);font-size:13px}
.tag{display:inline-block;padding:1px 7px;border-radius:10px;font-size:12px;background:var(--line);color:var(--ink)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:middle}
a,.lnk{color:var(--olv);font-weight:600;text-decoration:underline;text-decoration-color:color-mix(in srgb,var(--olv) 45%,transparent);text-underline-offset:2px;cursor:pointer}
a:active,.lnk:active{opacity:.6}
.g{background:var(--ok)}.a{background:var(--warn)}.r{background:var(--bad)}
.aviso{padding:8px 10px;border-left:4px solid var(--warn);background:rgba(197,138,11,.08);border-radius:6px;margin-bottom:6px}
.aviso.bad{border-color:var(--bad);background:rgba(192,57,43,.08)}
.aviso.ok{border-color:var(--ok);background:rgba(47,138,62,.08)}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:8px;width:100%}
label{display:block;margin-bottom:10px;font-size:13px;color:var(--mut)}
label>input,label>select,label>textarea{margin-top:3px}
label.chk{display:flex;gap:8px;align-items:center}label.chk input{width:auto}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
dialog{border:0;border-radius:12px;padding:0;width:min(560px,94vw);max-height:92vh;overflow:auto;background:var(--card);color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog form{padding:16px 16px 0}
.acciones{position:sticky;bottom:0;background:var(--card);margin:6px -16px 0;padding:10px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);z-index:2}
dialog h3{margin:0 0 12px}
.lab{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:10px;background:var(--bg)}
.lab-pronto{opacity:.8}
.lab .row .btn{margin-top:2px}
.apuntar{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-bottom:6px}
.apuntar button{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:14px 8px;font:inherit;font-weight:600;display:flex;align-items:center;gap:10px;cursor:pointer;text-align:left;min-width:0;overflow-wrap:anywhere;hyphens:auto}
.apuntar button span{font-size:22px}
@media (min-width:600px){.apuntar{grid-template-columns:repeat(3,1fr)}}
@media (max-width:400px){.apuntar button{padding:12px 7px;gap:7px;font-size:15px}.apuntar button span{font-size:19px}}
.hbtn{background:transparent;border:1px solid currentColor;color:inherit;border-radius:6px;padding:3px 7px;cursor:pointer;display:flex;align-items:center}
.lab.click{cursor:pointer}
.creditos{font-size:12px;color:var(--mut);text-align:center;margin:18px 0 6px;line-height:1.5}
#navCred{display:none}
.fab{position:fixed;right:16px;bottom:calc(74px + env(safe-area-inset-bottom));width:54px;height:54px;border-radius:50%;font-size:28px;line-height:1;z-index:7;box-shadow:0 3px 10px rgba(0,0,0,.25)}
#login{max-width:360px;margin:12vh auto;padding:0 16px}
.hidden{display:none!important}
.bar{min-width:60px;height:8px;background:var(--line);border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--olv2)}
.tabs2{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.tabs2 button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:16px;padding:5px 12px;font:inherit;font-size:13px;cursor:pointer}
.tabs2 button.on{background:var(--olv);color:#fff;border-color:var(--olv)}
@media (prefers-color-scheme:dark){.tabs2 button.on,.crono{color:#171a13}.crono .btn.sec{color:#171a13;border-color:rgba(0,0,0,.35);background:rgba(0,0,0,.08)}.crono .btn:not(.sec){color:#4b5d2a}}
/* En el móvil, todo lo que se toca con el dedo al menos de 40 px de alto */
@media (pointer:coarse){.btn.sm{min-height:40px;padding:6px 12px}.tabs2 button{min-height:40px;padding:8px 14px}}
@media (max-width:420px){th,td{padding:6px 3px;font-size:13px}main{padding:10px 10px}.hide-m{display:none}}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 12px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:18px;padding:8px 13px;font:inherit;font-size:14px;cursor:pointer;min-height:38px}
.chips.scrollx{flex-wrap:nowrap;overflow-x:auto;margin:0 0 8px;padding-bottom:2px;scrollbar-width:none}.chips.scrollx::-webkit-scrollbar{display:none}.chips.scrollx .chip{flex:none;min-height:34px;padding:6px 12px}
.chip.on{background:var(--olv);border-color:var(--olv);color:#fff;font-weight:600}
@media (prefers-color-scheme:dark){.chip.on{color:#171a13}}
.clab{font-size:13px;color:var(--mut);display:block}
.big{font-size:26px!important;font-weight:700;padding:10px!important}
details.adv{margin:4px 0 10px}details.adv summary{cursor:pointer;color:var(--olv);font-size:14px;margin-bottom:8px}
.quick{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:12px}
.quick button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:12px 2px;font:inherit;font-size:13px;font-weight:600;cursor:pointer}
.quick button b{display:block;font-size:22px;color:var(--olv);line-height:1}
.grp{font-size:13px;color:var(--mut);font-weight:600;margin:12px 0 4px}
/* ===== Ordenador ===== */
@media (min-width:1000px){
  body{padding-bottom:0}
  header{padding:12px 24px;height:56px}
  header h1{flex:none;width:186px;font-size:19px}
  nav{top:56px;bottom:0;right:auto;width:210px;flex-direction:column;justify-content:flex-start;gap:2px;padding:14px 12px;border-top:0;border-right:1px solid var(--line)}
  nav button{flex:none;text-align:left;padding:10px 14px;font-size:15px;border-radius:8px;color:var(--ink);flex-direction:row;justify-content:flex-start;gap:12px;min-height:0}
  nav button svg{width:22px;height:22px}
  nav button.pc{display:flex}
  nav button:hover{background:rgba(127,127,100,.1)}
  nav button.on{box-shadow:none;background:rgba(111,138,60,.16);color:var(--olv)}
  nav button.onm:not(.on){box-shadow:none;color:var(--ink);font-weight:400}nav button.onm:not(.on) svg{stroke-width:1.8}
  .irCuentas{display:none}
  main{margin-left:210px;max-width:1240px;padding:24px 32px}
  .cols2{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px;align-items:start;margin-bottom:16px}
  .cols2>.card,.cols2>.kpis{margin:0}
  .kpis{grid-template-columns:repeat(2,1fr)}
  .kpi{padding:14px 16px}.kpi b{font-size:24px}
  .quick{grid-template-columns:repeat(5,minmax(0,170px));margin-bottom:16px}
  .quick button{display:flex;align-items:center;gap:8px;justify-content:center;padding:12px 10px;font-size:14px}
  .quick button b{display:inline;font-size:20px}
  .card{padding:16px 20px;margin-bottom:16px}
  .card h2{font-size:17px}
  th,td{padding:9px 10px}
  .fab{right:32px;bottom:32px}
  dialog{width:min(640px,90vw)}

<script>
// ===== Configuración =====

const CATS_DEF = ['Gasoil / gasolina','Cuadrillas / destajo','Seguros sociales','Averías y reparaciones','Mantenimiento maquinaria','Fitosanitarios','Abonos','EPIs','Herramientas','Seguros','IBI / impuestos','Cuotas cooperativa','Transporte','Compra de maquinaria','Otros'];

const esAplicacion=m=>TIPOS_APL.includes(m.tipo) || /atomiz|pulveriz|cuba|mochila|barra|pistol|abonad/i.test(`${m.tipo||''} ${m.nombre||''}`);
const UMB_DEF = {
  spray_vmin:2, spray_vmax:10, spray_rmax:20, spray_tmin:5, spray_tmax:28, spray_hrmin:40, spray_pmax:30, spray_horas_lluvia:4, spray_min_horas:3,
  work_tmax:35, work_rmax:50, work_lluvia:1,

};

// ===== Estado =====
let D = {fincas:[],maquinas:[],gastos:[],ingresos:[],tratamientos:[],tareas:[],trabajadores:[],jornales:[],empresas:[],servicios:[],facturas:[],factura_lineas:[],dias_perdidos:[],comunidades:[],riego_pagos:[],labores:[],consejos:[],aplicaciones:[],pesadas:[],notas:[],recintos:[],reuniones:[],almacen:[],viajes:[],muestras:[],mantenimientos:[],adelantos:[],riegos:[]};
// Recogida de ACEITUNA (no de lechuga u otra cosa): la faena «Recogida» tal cual o que hable de aceituna, vareo, vibrar o suelo
const esRecAce=t=>{ t=(t||'').toLowerCase().trim(); if(/revis|repar|arregl|manten|engras|afila|cambi.*(aceite|filtro)/.test(t)) return false; return t==='recogida'||/aceitun|oliva|vare|vibr|suelo|vuelo/.test(t)||(/recog/.test(t)&&!/[a-zñ]{3,}/.test(t.replace(/recog\w*|de|la|el|los|las|\s/g,''))); };
const JOR_TAREAS = ['Recogida','Poda','Pestugar','Juntar ramas','Desbrozar','Soplar','Curar','Abonar','Día perdido','Otra'];
let ULT = {}; try{ ULT = JSON.parse(localStorage.getItem('olv_ult')||'{}'); }catch(e){}
function recordar(k,v){ ULT[k]=v; try{ localStorage.setItem('olv_ult',JSON.stringify(ULT)); }catch(e){} }
let AJ = {cats:CATS_DEF.slice(), umb:{...UMB_DEF}};
let VIEW = 'inicio', SUB = {};
let CAMP = campDe(hoy());

// ===== Utilidades =====
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
// Los formateadores se crean una vez: crearlos en cada número era lo que más tardaba al pintar
const FMT_EUR=new Intl.NumberFormat('es-ES',{style:'currency',currency:'EUR',useGrouping:'always'}), FMT_NUM={};
const eur = n => FMT_EUR.format(Number(n)||0);
const num = (n,d=0) => (FMT_NUM[d]||(FMT_NUM[d]=new Intl.NumberFormat('es-ES',{maximumFractionDigits:d,minimumFractionDigits:d,useGrouping:'always'}))).format(Number(n)||0);
var HOY_T=0, HOY_V='';
function hoy(){ const t=Date.now(); if(!(t-HOY_T<=2000)||!HOY_V){ HOY_T=t; HOY_V=iso(new Date(t)); } return HOY_V; }
function iso(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function addDias(s,n){ const [y,m,d]=s.split('-').map(Number); return iso(new Date(y,m-1,d+n)); }
function difDias(a,b){ const p=s=>{const [y,m,d]=s.split('-').map(Number);return Date.UTC(y,m-1,d)}; return Math.round((p(b)-p(a))/864e5); }
function fFecha(s){ if(!s) return ''; const [y,m,d]=s.split('-'); return `${d}/${m}/${y.slice(2)}`; }
function campDe(s){ const [y,m]=s.split('-').map(Number); const a = m>=10 ? y : y-1; return `${a}/${String(a+1).slice(2)}`; }
// «2025/2026», «2025-26» o «2025/26» → «2025/26» (o null si no es una campaña)
function normCamp(c){ const m=/^\s*(\d{4})\s*[\/-]\s*(\d{2}|\d{4})\s*$/.exec(String(c||'')); if(!m) return null; const a=+m[1], b=+m[2].slice(-2); return b===(a+1)%100?`${a}/${String(a+1).slice(2)}`:null; }
// El 1 de septiembre más reciente (el «año de lluvias» empieza en septiembre, no con la campaña de octubre)
const sepDe=h=>`${+h.slice(5,7)>=9?+h.slice(0,4):+h.slice(0,4)-1}-09-01`;
function campRango(c){ const a=parseInt(c); return [`${a}-10-01`,`${a+1}-09-30`]; }
function fincaNom(id){ if(!id) return 'Común'; const f=D.fincas.find(x=>x.id===id); return f?f.nombre:'(borrada)'; }
function maqNom(id){ const m=D.maquinas.find(x=>x.id===id); return m?m.nombre:''; }
function toast(t, deshacer, etq){
  const e=$('#toast'); e.textContent=t; e.classList.remove('hidden'); clearTimeout(toast._t); toast._reabrir=false;
  if(deshacer){ const b=document.createElement('button'); b.textContent=etq||'Deshacer'; b.className='tdes'; b.onclick=async()=>{ e.classList.add('hidden'); await deshacer(); }; e.append(' ',b); }
  toast._t=setTimeout(()=>e.classList.add('hidden'), deshacer?(etq?9000:6000):2500);
}

// ===== Autenticación =====
async function arranque(){
  const {data:{session}} = await sb.auth.getSession();
  if(session) entrar(); else { $('#login').classList.remove('hidden'); }
}
$('#lg_in').onclick = async () => {
  $('#lg_msg').textContent='Entrando…';
  const {error} = await sb.auth.signInWithPassword({email:$('#lg_email').value.trim(), password:$('#lg_pass').value});
  if(error){ $('#lg_msg').textContent = error.message.includes('confirm') ? 'Confirma primero el correo que te ha llegado.' : 'Correo o contraseña incorrectos.'; return; }
  entrar();
};
$('#lg_up').onclick = async () => {
  const p=$('#lg_pass').value; if(p.length<8){ $('#lg_msg').textContent='La contraseña necesita al menos 8 caracteres.'; return; }
  const {data,error} = await sb.auth.signUp({email:$('#lg_email').value.trim(), password:p});
  if(error){ $('#lg_msg').textContent=error.message; return; }
  if(data.session) entrar(); else $('#lg_msg').textContent='Cuenta creada. Revisa tu correo para confirmarla y luego entra.';
};
var USUARIO=null, AJ_LOCAL=false; // AJ_LOCAL: los ajustes que hay en memoria vienen de la copia del móvil
async function entrar(){
  $('#login').classList.add('hidden'); $('#app').classList.remove('hidden');
  try{ const {data}=await sb.auth.getSession(); USUARIO=data?.session?.user?.id||null; }catch(e){}
  // Se enseña al momento lo último que se guardó en el móvil y se actualiza por detrás
  let pintado=false;
  try{ const c=JSON.parse(localStorage.getItem('olv_cache')||'null');
    if(c&&c.uid&&c.uid===USUARIO&&c.D){ Object.keys(D).forEach(k=>{ if(c.D[k]) D[k]=[...COLA.filter(i=>i.tabla===k).flatMap(i=>i.filas),...c.D[k]]; }); if(c.AJ){ AJ={...AJ,...c.AJ}; AJ_LOCAL=true; } DV++; ir('inicio'); pintado=true; $('#sync')?.classList.remove('hidden'); } }catch(e){}
  await cargarTodo(); $('#sync')?.classList.add('hidden');
  if(pintado) render(); else ir('inicio');
  if(/^#(tiempo|raif|avisos)$/.test(location.hash)){ const h=location.hash; try{ history.replaceState(null,'',location.pathname); }catch(e){} setTimeout(()=>irAviso(h),300); }
  vaciarCola().then(aplicarAlmPend).then(subirFotosPend);
  buscarVersion(); document.addEventListener('visibilitychange',()=>{ if(!document.hidden){ buscarVersion(); vaciarCola(); } });
}
// ¿Hay una versión nueva subida a la web? El móvil a veces guarda la vieja: se avisa y se recarga con un toque
let VER_AVISADA=false, VER_ULT=0;
async function buscarVersion(){ if(VER_AVISADA||!navigator.onLine||!/^https?:/.test(location.protocol)||Date.now()-VER_ULT<10*60e3) return; VER_ULT=Date.now();
  try{ const r=await fetch(location.pathname+'?v='+Date.now(),{cache:'no-store'}); if(!r.ok) return; const t=await r.text(); const m=/const VERSION = '([^']+)'/.exec(t);
    if(m&&m[1]!==VERSION){ VER_AVISADA=true; const b=document.createElement('div'); b.className='aviso ok'; b.style.cssText='position:fixed;left:12px;right:12px;bottom:calc(74px + env(safe-area-inset-bottom));z-index:50;display:flex;gap:10px;align-items:center;box-shadow:var(--sh)';
      b.innerHTML=`<span style="flex:1">Hay una versión nueva de Olivas (v${esc(m[1])}).</span><button class="btn sm" onclick="location.replace(location.pathname+'?v='+Date.now())">Actualizar</button>`; document.body.appendChild(b); } }catch(e){} }
async function salir(){
  if(COLA.length && !confirm('Hay apuntes sin subir que se perderán si cierras sesión. ¿Cerrar igualmente?')) return;
  try{ localStorage.removeItem('olv_cache'); localStorage.removeItem('olv_cola'); }catch(e){}
  await sb.auth.signOut(); location.reload(); }

// ===== Datos =====
// --- Sin cobertura: los apuntes nuevos se guardan en el móvil y se suben solos
const esRed = e => !navigator.onLine || /fetch|network|load failed|timeout/i.test(e?.message||'');
let COLA=[]; try{ COLA=JSON.parse(localStorage.getItem('olv_cola')||'[]'); }catch(e){}
// La cola es lo más importante del móvil: si no cabe, se tira la copia de la caché (se puede volver a bajar) y se reintenta
function guardarCola(){ try{ localStorage.setItem('olv_cola',JSON.stringify(COLA)); }catch(e){ try{ localStorage.removeItem('olv_cache'); localStorage.setItem('olv_cola',JSON.stringify(COLA)); }catch(e2){ toast('⚠️ El móvil no tiene sitio para guardar lo apuntado sin cobertura: no cierres la app hasta que se suba'); } } pintarCola(); }
function pintarCola(){ const n=COLA.reduce((a,i)=>a+i.filas.length,0); const b=$('#cola'); if(!b) return; b.textContent=n?`${n} sin subir`:''; b.classList.toggle('hidden',!n); }
// En el móvil el teclado solo sale cuando tocas tú una casilla: al abrir una ventana no se enfoca ningún campo de texto
const TACTIL=matchMedia('(pointer:coarse)').matches||('ontouchstart' in window);
(()=>{ const sm=HTMLDialogElement.prototype.showModal; HTMLDialogElement.prototype.showModal=function(){ const r=sm.apply(this,arguments);
  if(this.id==='dlg'){ DLG_SUCIO=false; DLG_ACCION=0; ponerGuardia(); if(toast._reabrir){ toast._reabrir=false; $('#toast')?.classList.add('hidden'); } }
  if(TACTIL){ const a=document.activeElement; if(a&&this.contains(a)&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)) a.blur(); } return r; }; })();
// Botón «atrás» del móvil: cierra la ventana abierta (preguntando si hay algo escrito), vuelve de una ficha o a Inicio; en Inicio, dos veces para salir
var DLG_SUCIO=false, GUARDIA=false, DLG_ACCION=0;
function ponerGuardia(){ if(!GUARDIA){ try{ history.pushState({olv:1},''); GUARDIA=true; }catch(e){} } }
const salirSinGuardar=()=>!DLG_SUCIO||confirm('¿Salir sin guardar lo que has puesto?');
window.addEventListener('popstate',()=>{ GUARDIA=false; const dlg=$('#dlg');
  if(dlg?.open){ if(salirSinGuardar()) dlg.close(); ponerGuardia(); return; }
  if(VIEW==='ficha'){ volverFicha(); ponerGuardia(); return; }
  if(VIEW!=='inicio'){ ir(VIEW==='cuentas'&&VIEW_ANT==='mas'&&enTemporada()?'mas':'inicio'); ponerGuardia(); return; }
  toast('Pulsa otra vez atrás para salir'); setTimeout(ponerGuardia,2500); });
document.addEventListener('DOMContentLoaded',()=>{ const dlg=$('#dlg'); if(!dlg) return;
  dlg.addEventListener('cancel',e=>{ if(!salirSinGuardar()) e.preventDefault(); });
  dlg.addEventListener('input',e=>{ if(e.isTrusted) DLG_SUCIO=true; }, true);
  dlg.addEventListener('click',e=>{ if(e.isTrusted&&e.target.closest('.chip,input[type=checkbox]')) DLG_SUCIO=true; }, true);
  dlg.addEventListener('click',e=>{ if(e.target.closest('button,[type=submit]')&&!e.target.closest('.chip')) DLG_ACCION=Date.now(); }, true);
  dlg.addEventListener('submit',()=>{ DLG_ACCION=Date.now(); }, true);
  dlg.addEventListener('close',()=>{ const perdido=DLG_SUCIO&&!(DLG_ACCION&&Date.now()-DLG_ACCION<60e3); DLG_SUCIO=false;
    if(perdido){ toast('Se ha cerrado sin guardar',()=>{ $('#dlg').showModal(); DLG_SUCIO=true; },'Volver a abrirla'); toast._reabrir=true; } }); });
function nuevoId(){ if(crypto.randomUUID) return crypto.randomUUID(); return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{const r=Math.random()*16|0;return (c==='x'?r:(r&3|8)).toString(16);}); }
async function insertar(tabla, filas){
  filas=[].concat(filas).map(f=>({id:nuevoId(),...f}));
  // si unas filas traen un campo y otras no, a las que no lo traen se les pone su valor por defecto (no un vacío)
  const {error}=await sb.from('olv_'+tabla).insert(filas,{defaultToNull:false});
  if(!error) return {ok:true,filas};
  if(esRed(error)){ COLA.push({tabla,filas}); guardarCola(); D[tabla]=[...filas,...D[tabla]]; DV++; return {ok:true,offline:true,filas}; }
  return {ok:false,error};
}
let subiendo=false;
const motivoError=e=>({'23503':'la finca, persona o máquina ya no existe','23502':'le falta un dato obligatorio','23514':'un dato no cumple las reglas','22P02':'un dato no es válido'})[e?.code]||(/^22/.test(e?.code||'')?'un dato no es válido':e?.message||'error');
const fallosCola=()=>{ try{ return JSON.parse(localStorage.getItem('olv_cola_fallos')||'[]'); }catch(e){ return []; } };
function guardarFallos(m){ try{ localStorage.setItem('olv_cola_fallos',JSON.stringify(m.slice(-50))); }catch(e){} }
async function vaciarCola(){
  if(subiendo || !COLA.length || !navigator.onLine) return;
  subiendo=true; let subidos=0, fallos=0, ultErr=null;
  try{
    for(const item of COLA.slice()){
      const {error}=await sb.from('olv_'+item.tabla).insert(item.filas,{defaultToNull:false});
      if(error && error.code!=='23505'){ if(esRed(error)) break;
        if(/JWT|PGRST30|42501|401|403/.test((error.code||'')+' '+(error.message||''))){ try{ await sb.auth.refreshSession(); }catch(_){} break; }
        if(!/^(22|23|42|PGRST2)/.test(error.code||'')) break; // fallo pasajero del servidor: se reintenta luego
        // ese apunte no vale tal cual (la finca ya no existe, falta un dato…): se aparta para verlo y se sigue con los demás
        fallos+=item.filas.length; ultErr=error; const m=fallosCola(); m.push({...item,error:motivoError(error),cuando:new Date().toISOString()}); guardarFallos(m);
      } else subidos+=item.filas.length;
      COLA.splice(COLA.indexOf(item),1); guardarCola();
    }
  } finally { subiendo=false; }
  if(subidos||fallos){ await cargarTodo(); await aplicarAlmPend(); render(); }
  subirFotosPend();
  if(fallos) toast(`${subidos?`${subidos} subidos · `:''}${fallos} NO se ${fallos===1?'pudo':'pudieron'} subir (${motivoError(ultErr)}). Míralos en Más → Ajustes → Copia de seguridad.`);
  else if(subidos) toast(`${subidos} ${subidos===1?'apunte subido':'apuntes subidos'}`);
}
window.addEventListener('online', ()=>vaciarCola().then(aplicarAlmPend).then(subirFotosPend)); setInterval(vaciarCola, 60000);
// Un apunte que aún no se ha subido se cambia (o se quita) en la propia cola del móvil
const enCola=(k,id)=>COLA.find(i=>i.tabla===k&&i.filas.some(f=>f.id===id));
function cambiarEnCola(k,id,u){ const it=enCola(k,id); if(!it) return false; Object.assign(it.filas.find(f=>f.id===id),u); guardarCola(); const d=D[k].find(x=>x.id===id); if(d) Object.assign(d,u); DV++; return true; }
function sinRed(error){ if(esRed(error)){ toast('Sin cobertura: para editar o borrar necesitas conexión'); return true; } return false; }

async function cargar(k, ids){
  const ord = {adelantos:'fecha',fincas:'nombre',maquinas:'nombre',gastos:'fecha',ingresos:'fecha',tratamientos:'fecha',tareas:'fecha',trabajadores:'nombre',jornales:'fecha',empresas:'nombre',servicios:'fecha',facturas:'fecha',factura_lineas:'created_at',dias_perdidos:'fecha',comunidades:'nombre',riego_pagos:'fecha',labores:'fecha',consejos:'created_at',aplicaciones:'fecha',pesadas:'fecha',notas:'fecha',recintos:'parcela',reuniones:'fecha',almacen:'nombre',viajes:'fecha',muestras:'fecha',riegos:'fecha',mantenimientos:'fecha'}[k];
  const asc = !['adelantos','mantenimientos','viajes','riegos','gastos','ingresos','tratamientos','jornales','servicios','facturas','dias_perdidos','riego_pagos','labores','consejos','aplicaciones','pesadas','notas'].includes(k);
  // Solo unas filas (lo que se acaba de guardar o borrar): se piden esas y se colocan en su sitio, sin bajar la tabla entera
  if(Array.isArray(ids)){ ids=[...new Set(ids.filter(Boolean))]; if(!ids.length) return;
    if(ids.length<=150){ const {data,error}=await sb.from('olv_'+k).select('*').in('id',ids);
      if(error){ if(!esRed(error)) toast('Error cargando '+k+': '+error.message); return error; }
      const quitar=new Set(ids); D[k]=[...D[k].filter(r=>!quitar.has(r.id)),...data].sort(ordenFilas(ord,asc)); DV++; guardarCacheLuego(); return; } }
  // Tabla entera. Supabase da como mucho 1000 filas por consulta: si ya sabemos que hay más, se piden los trozos a la vez
  const trozo=a=>sb.from('olv_'+k).select('*').order(ord,{ascending:asc}).order('id').range(a,a+999);
  const nPrev=Math.max(1,Math.ceil(((D[k]||[]).length+200)/1000));
  const res=await Promise.all(Array.from({length:nPrev},(_,i)=>trozo(i*1000)));
  const err=res.find(r=>r.error); if(err){ if(!esRed(err.error)) toast('Error cargando '+k+': '+err.error.message); return err.error; }
  let todo=res.flatMap(r=>r.data), desde=nPrev*1000;
  while(res.length&&res[res.length-1].data.length===1000){ const r=await trozo(desde); if(r.error){ if(!esRed(r.error)) toast('Error cargando '+k+': '+r.error.message); return r.error; } todo=todo.concat(r.data); res.push(r); desde+=1000; }
  const enTodo=new Set(todo.map(r=>r.id)), pend=COLA.filter(i=>i.tabla===k).flatMap(i=>i.filas).filter(f=>!enTodo.has(f.id));
  D[k]=[...pend,...todo]; DV++;
  guardarCacheLuego();
}
// Mismo orden que da la base de datos (campo, y a igualdad, id)
function ordenFilas(ord,asc){ return (a,b)=>{ const x=a[ord]??'', y=b[ord]??''; let c=typeof x==='number'&&typeof y==='number'?x-y:String(x).localeCompare(String(y),'es'); if(!asc) c=-c; return c||String(a.id).localeCompare(String(b.id)); }; }
// Copia en el móvil de todo lo cargado: con ella la app se abre al instante la próxima vez
function guardarCache(){ guardarAgenda().catch(()=>{}); try{ const pendIds=new Set(COLA.flatMap(i=>i.filas.map(f=>f.id))), desde=campRango(`${parseInt(campDe(hoy()))-2}/00`)[0], sinPend={};
    Object.keys(D).forEach(k=>{ let L=D[k].filter(r=>!pendIds.has(r.id));
      if(['jornales','servicios','gastos','pesadas','viajes','tratamientos','labores','aplicaciones','notas','muestras','riegos'].includes(k)) L=L.filter(r=>!r.fecha||r.fecha>=desde||r.pagado===false); // lo viejo se baja al conectar
      if(k==='consejos') L=L.slice(0,5); if(k==='dias_perdidos') L=L.map(({meteo,...r})=>r);
      sinPend[k]=L; });
    localStorage.setItem('olv_cache',JSON.stringify({D:sinPend,AJ,t:Date.now(),uid:USUARIO})); }catch(e){ try{ localStorage.removeItem('olv_cache'); }catch(_){} } }
let CACHE_T=null; function guardarCacheLuego(){ clearTimeout(CACHE_T); CACHE_T=setTimeout(guardarCache,3000); }
async function cargarTodo(){
  const errs=(await Promise.all(Object.keys(D).map(k=>cargar(k)))).filter(Boolean);
  if(errs.some(esRed)){
    try{ const c=JSON.parse(localStorage.getItem('olv_cache')||'null'); if(c&&c.D&&(!c.uid||c.uid===USUARIO)){ Object.keys(D).forEach(k=>{ if(c.D[k]) D[k]=[...COLA.filter(i=>i.tabla===k).flatMap(i=>i.filas),...c.D[k]]; }); if(c.AJ){ AJ=c.AJ; AJ_LOCAL=true; } DV++; } }catch(e){}
    toast('Sin cobertura: ves lo último guardado. Lo que apuntes se subirá solo.');
  } else {
    let pendAJ=false; try{ pendAJ=!!localStorage.getItem('olv_aj_pend'); }catch(e){}
    if(pendAJ&&AJ_LOCAL) await guardarAjustes(true); // los cambiados sin cobertura mandan sobre los del servidor
    else { const {data} = await sb.from('olv_ajustes').select('datos').maybeSingle();
      if(data && data.datos){ AJ = {...AJ, ...data.datos}; AJ.cats = data.datos.cats?.length ? data.datos.cats : CATS_DEF.slice(); AJ.umb = {...UMB_DEF, ...(data.datos.umb||{})}; } }
    if(unirClientes()){ sincClientes(); setTimeout(()=>guardarAjustes(true),0); }
    if(!AJ.cats.includes(CAT_MAQ)) AJ.cats.splice(Math.max(0,AJ.cats.length-1),0,CAT_MAQ);
    if(D.fincas.some(f=>f.arrendada) && !AJ.cats.includes(CAT_RENTA)) AJ.cats.splice(Math.max(0,AJ.cats.length-1),0,CAT_RENTA);
    guardarCache();
  }
  pintarCampanas(); pintarCola();
}
async function guardarAjustes(silencio){ DV++;
  let uid=USUARIO; if(!uid){ try{ uid=(await sb.auth.getSession()).data?.session?.user?.id||null; }catch(e){} }
  const {error} = uid ? await sb.from('olv_ajustes').upsert({user_id:uid, datos:AJ, updated_at:new Date().toISOString()}) : {error:{message:'Failed to fetch'}};
  if(error){ if(esRed(error)){ try{ localStorage.setItem('olv_aj_pend','1'); }catch(e){} guardarCacheLuego(); if(!silencio) toast('Sin cobertura: los ajustes quedan en el móvil y se suben al volver la conexión'); } else toast('Error: '+error.message); return; }
  try{ localStorage.removeItem('olv_aj_pend'); }catch(e){} if(!silencio) toast('Ajustes guardados');
}
function pintarCampanas(){
  const set = new Set([campDe(hoy())]);
  D.gastos.forEach(g=>set.add(campDe(g.fecha)));
  D.ingresos.forEach(i=>set.add(i.campana));
  D.jornales.forEach(j=>set.add(campDe(j.fecha)));
  D.servicios.forEach(j=>set.add(campDe(j.fecha)));
  [D.pesadas,D.tratamientos,D.riego_pagos].forEach(L=>L.forEach(x=>x.fecha&&set.add(campDe(x.fecha))));
  const lista=[...set].filter(Boolean).sort().reverse();
  if(!lista.includes(CAMP)) CAMP=lista[0];
  $('#selCamp').innerHTML = lista.map(c=>`<option ${c===CAMP?'selected':''}>${c}</option>`).join('');
}

function recientesTrat(){
  const vistos=new Set(), l=[]; D.tratamientos.forEach(t=>{ const k=(t.producto||'').toLowerCase(); if(k&&!vistos.has(k)&&l.length<6){ vistos.add(k); l.push(t); } });
  return l.length?`<span class="clab">Repetir uno anterior</span><div class="chips">${l.map(t=>`<button type="button" class="chip" data-rtrat="${t.id}">${esc(t.producto)}</button>`).join('')}</div>`:'';
}
function recientesTareas(){
  const vistos=new Set(), l=[]; [...D.tareas].sort((a,b)=>(b.created_at||'').localeCompare(a.created_at||'')).forEach(t=>{ const k=t.titulo.toLowerCase(); if(!vistos.has(k)&&l.length<6){ vistos.add(k); l.push(t.titulo); } });
  return l.length?`<div class="chips" style="margin-top:-6px">${l.map(t=>`<button type="button" class="chip" data-rtit="${esc(t)}">${esc(t)}</button>`).join('')}</div>`:'';
}
function campoHtml(c, v, reg){
  const lab = esc(c.l) + (c.req?' *':'');
  const help = c.help?`<span class="mut" style="display:block">${esc(c.help)}</span>`:'';
  switch(c.t){
    case 'html': return (reg&&c.nuevo)?'':c.html;
    case 'bool': return `<label class="chk"><input type="checkbox" name="${c.k}" ${v?'checked':''}> ${lab}</label>`;
    case 'area': return `<label>${lab}<textarea name="${c.k}" rows="2">${esc(v)}</textarea></label>`;
    case 'sel': if(c.ops.length<=8) return campoHtml({...c,t:'chips',ops:c.ops.filter(([val,t])=>t!=='')},v,reg);
      return `<label>${lab}<select name="${c.k}">${c.ops.map(([val,t])=>`<option value="${esc(val)}" ${String(v??'')===String(val)?'selected':''}>${esc(t)}</option>`).join('')}</select>${help}</label>`;
    case 'chips': return `${c.l?`<span class="clab">${lab}</span>`:''}<div class="chips" data-chips="${c.k}">${c.ops.map(([val,t])=>`<button type="button" class="chip ${String(v??'')===String(val)?'on':''}" data-val="${esc(val)}">${esc(t)}</button>`).join('')}</div><input type="hidden" name="${c.k}" value="${esc(v??'')}">`;
    case 'multi': { const sel=(Array.isArray(v)?v:String(v??'').split(',')).map(String).filter(Boolean);
      return `${c.l?`<span class="clab">${lab}</span>`:''}<div class="chips" data-multi="${c.k}">${c.ops.map(([val,t])=>`<button type="button" class="chip ${sel.includes(String(val))?'on':''}" data-val="${esc(val)}">${esc(t)}</button>`).join('')}</div><input type="hidden" name="${c.k}" value="${esc(sel.join(','))}">${help}`; }
    case 'date': return `<label>${lab}<input type="date" name="${c.k}" value="${esc(v)}" ${c.req?'required':''}>${help}</label>${c.q?`<div class="chips" style="margin-top:-6px">${c.q.map(([t,n])=>`<button type="button" class="chip" data-qf="${c.k}" data-n="${n}">${t}</button>`).join('')}</div>`:''}`;
    case 'time': return `<label>${lab}<input type="time" name="${c.k}" value="${esc(v)}">${help}</label>`;
    case 'num': case 'int': case 'coord': return `<label>${lab}<input name="${c.k}" inputmode="decimal" autocomplete="off" class="${c.big?'big':''}" value="${esc(v)}" ${c.req?'required':''}>${help}</label>`;
    default: return `<label>${lab}<input name="${c.k}" autocomplete="off" value="${esc(v)}" ${c.req?'required':''}>${help}</label>`;
  }
}
function activarChips(root){
  root.querySelectorAll('[data-chips]').forEach(g=>{
    const inp=root.querySelector(`input[name="${g.dataset.chips}"]`);
    g.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{ g.querySelectorAll('.chip').forEach(x=>x.classList.remove('on')); b.classList.add('on'); inp.value=b.dataset.val; inp.dispatchEvent(new Event('change',{bubbles:true})); });
  });
  root.querySelectorAll('[data-multi]').forEach(g=>{ const inp=root.querySelector(`input[name="${g.dataset.multi}"]`);
    g.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{ b.classList.toggle('on'); inp.value=[...g.querySelectorAll('.chip.on')].map(x=>x.dataset.val).join(','); inp.dispatchEvent(new Event('change',{bubbles:true})); }); });
  root.querySelectorAll('[data-qf]').forEach(b=>b.onclick=()=>{ root.querySelector(`input[name="${b.dataset.qf}"]`).value=addDias(hoy(),+b.dataset.n); });
}

    // lo recordado de otra vez puede ser una finca dada de baja o una categoría que ya no está: entonces no se usa
    if(/^(finca_id|categoria|comunidad_id|empresa_id|maquina_id)$/.test(c.k)&&(c.t==='chips'||c.t==='sel')&&Array.isArray(c.ops)&&v!==''&&!c.ops.some(([o])=>String(o)===String(v))) v=c.ops.some(([o])=>o==='')?'':(c.ops[0]?.[0]??'');

    if(!(m.precio_compra>0 && m.anos_amortizacion>0 && m.fecha_compra)) return;
    const ac=parseInt(campDe(m.fecha_compra));
    if(a0>=ac && a0<ac+m.anos_amortizacion) amort.push({categoria:'Amortización maquinaria', concepto:m.nombre, importe:m.precio_compra/m.anos_amortizacion, finca_id:null});
  });
  const jorn=[...D.jornales.filter(j=>j.fecha>=ini && j.fecha<=fin).map(j=>({categoria:j.empresa_id&&!empresa(j.empresa_id)?.cuadrilla?'Empresas de servicios':'Jornales', importe:j.importe, finca_id:j.finca_id})),
    ...D.servicios.filter(x=>x.fecha>=ini && x.fecha<=fin).map(x=>({categoria:catServ(x), importe:x.importe, finca_id:x.finca_id})),
    ...D.dias_perdidos.filter(x=>x.fecha>=ini && x.fecha<=fin && Number(x.coste)>0).map(x=>({categoria:'Días perdidos', importe:x.coste, finca_id:x.finca_id})),
    ...D.riego_pagos.filter(x=>x.fecha>=ini && x.fecha<=fin).map(x=>{ if(x.finca_id) return {categoria:'Riego', importe:x.importe, finca_id:x.finca_id};
      const fs=fincasDe(x.comunidad_id), tot=fs.reduce((a,f)=>a+olivosRiego(f),0);
      return {categoria:'Riego', importe:x.importe, finca_id:null, reparto: tot ? fs.map(f=>[f.id, olivosRiego(f)/tot]) : null}; })];
  // el gasoil sin finca se reparte según los km de los viajes a cada finca (si hay viajes); si no, por olivos
  // Gasóleo B (tractor): por días de tractor en cada finca. Gasóleo A / gasolina (coche): por km de los viajes. Sin viajes: por olivos.
  const vjC=D.viajes.filter(v=>v.fecha>=ini&&v.fecha<=fin&&v.finca_id), esTr=v=>(D.maquinas.find(m=>m.id===v.vehiculo_id)||{}).tipo==='Tractor';
  const peso=(l,f)=>{ const o={}; l.forEach(v=>o[v.finca_id]=(o[v.finca_id]||0)+f(v)); const t=Object.values(o).reduce((a,b)=>a+b,0); return t?Object.entries(o).map(([k,x])=>[k,x/t]):null; };
  const repB=peso(vjC.filter(esTr),()=>1), repA=peso(vjC.filter(v=>!esTr(v)&&Number(v.km)>0),v=>Number(v.km));
  const gastosR=gastos.map(g=>{ if(g.finca_id||!/gas[oó]|gasoil|combustible/i.test(g.categoria||'')) return g; const r=combDeGasto(g)==='B'?repB:repA; return r?{...g,reparto:r}:g; });
  const kmTot=repA||repB?1:0, kmF={B:repB,A:repA};
  const todos=[...gastosR,...amort,...jorn];
  const porCat={}; let comunTot=0, totG=0;

    const imp=Number(g.importe)||0; totG+=imp;

  });
  const ingresos=D.ingresos.filter(i=>i.campana===c);
  let totI=0, ingC=0;
  // lo cobrado por la aceituna sin finca se reparte según los kilos que entregó cada finca (también las dadas de baja); lo demás, por olivos
  const K=cosecha(c), kF=Object.entries(K.porF).filter(([fid,x])=>R[fid]&&x.kilos>0), kFt=kF.reduce((a,[,x])=>a+x.kilos,0), porK=kFt?kF.map(([fid,x])=>[fid,x.kilos/kFt]):null;
  ingresos.forEach(i=>{
    const imp=Number(i.importe)||0; totI+=imp;
    if(i.finca_id && R[i.finca_id]){ R[i.finca_id].ingD+=imp; if(esLiqKg(i)) R[i.finca_id].kilos+=Number(i.kilos)||0; }

  });
  const kilos=kilosCampana(c).kilos; if(K.tot) D.fincas.forEach(f=>{ R[f.id].kilos=K.porF[f.id]?.kilos||0; });
  const visibles = D.fincas.filter(f=>f.activa || R[f.id].directo || R[f.id].ingD || R[f.id].ingC>0.5 || R[f.id].kilos);
  return {totG,totI,kilos,comunTot,ingC,porCat,R,fincas:visibles,totOl,amort,nG:gastos.length,nI:ingresos.length,repKm:kmTot?kmF:null};
}

// Plazo de seguridad: el primer día en que se puede recoger en una finca después de lo que se ha echado (null si ya se puede)
function plazoSeg(fid,fecha){ let fin=null; const prod=new Set(); D.tratamientos.forEach(t=>{ if(!t.plazo_seguridad_dias||(t.finca_id||'')!==(fid||'')||t.fecha>fecha) return; const f=addDias(t.fecha,t.plazo_seguridad_dias); if(f>fecha){ if(!fin||f>fin) fin=f; prod.add(t.producto); } }); return fin?{fin,prod:[...prod]}:null; }

  return confirm(`Ojo: en ${fincaNom(fid)} no se debería recoger antes del ${fFecha(x.fin)} (plazo de seguridad de ${x.prod.join(', ')}). ¿Apuntarlo igualmente?`); };

  { const porF={}; D.tratamientos.forEach(t=>{ if(!t.plazo_seguridad_dias) return; const fin=addDias(t.fecha,t.plazo_seguridad_dias); if(difDias(h,fin)<=0||t.fecha>h) return; const x=porF[t.finca_id||'']=porF[t.finca_id||'']||{fin,prod:new Set()}; if(fin>x.fin) x.fin=fin; x.prod.add(t.producto); });

function conIva(v,e){ return v*(1+(Number(e.iva_pct)||0)/100); }
// Lo que cobra según la faena: cada persona o empresa puede tener un precio distinto para cada trabajo (por hora, por jornal o por kilo)
function tarifaDe(t,faena){ const e=t&&t.empresa_id&&empresa(t.empresa_id), x=e||t||{}, hj=Number(x.horas_jornada)||6.5;
  const f=faena&&(x.tarifas||{})[faena]; if(f&&f.modo&&Number(f.precio)>0) return {modo:f.modo,precio:Number(f.precio),hj,e,esp:true};
  if(e) return {modo:e.forma_cobro||'jornal',precio:Number(e.precio)||0,hj,e};
  return t&&Number(t.precio_hora)>0?{modo:'hora',precio:Number(t.precio_hora),hj}:{modo:'jornal',precio:Number(t&&t.precio_dia)||0,hj}; }
const txtTarifa=T=>T.precio?`${eur(T.precio)}${T.modo==='kilo'?'/kg':T.modo==='hora'?'/h':'/jornal'}`:'sin precio';
function importeJornal(t,h,faena,kg){ const T=tarifaDe(t,faena);
  let v = T.modo==='hora' ? h*T.precio : T.modo==='jornal' ? T.precio*h/T.hj : T.modo==='kilo'&&!T.e ? (Number(kg)||0)*T.precio : 0;
  if(T.e) v=conIva(v,T.e);
  return Math.round(v*100)/100;
}

// Libreta agrupada por faena: cuánto se ha ido en cada tipo de trabajo y qué días
function htmlPorFaena(l,sv){
  const F={}; l.forEach(j=>{ const f=j.tarea||'Sin faena'; (F[f]=F[f]||[]).push(j); });
  const L=Object.entries(F).map(([f,js])=>({f,js,imp:js.reduce((a,j)=>a+Number(j.importe),0),h:js.reduce((a,j)=>a+Number(j.horas||0),0),dias:new Set(js.map(j=>j.fecha)).size})).sort((a,b)=>b.imp-a.imp);
  const kS=sv.reduce((a,x)=>a+Number(x.importe),0);
  if(!L.length&&!sv.length) return '<div class="card"><p class="mut">Aún no hay jornadas en esta campaña.</p></div>';
  const tot=L.reduce((a,x)=>a+x.imp,0)+kS;
  return `<div class="card"><p class="mut" style="margin-top:0">Campaña ${esc(CAMP)} · ${eur(tot)} en total. Toca una faena para ver sus días.</p>${L.map((x,i)=>{ const G={}; x.js.forEach(j=>{ const k=j.fecha+'|'+(j.finca_id||''); (G[k]=G[k]||[]).push(j); });
    return `<details ${i===0?'open':''} style="border-top:1px solid var(--line);padding:6px 0"><summary style="cursor:pointer;display:flex;gap:6px;align-items:baseline"><b style="flex:1">${esc(x.f)}</b><span class="mut" style="font-size:13px">${x.dias} ${x.dias===1?'día':'días'} · ${num(x.h,0)} h</span><b>${eur(x.imp)}</b></summary>
      <table>${Object.entries(G).sort((a,b)=>b[0].localeCompare(a[0])).map(([k,g])=>{ const [d,fi]=k.split('|'); return `<tr class="click" onclick="editarGrupoJ('${d}','${encodeURIComponent((g[0].tarea||'')+'|'+(g[0].finca_id||'')).replace(/'/g,'%27')}')"><td>${diaSemana(d)}/${+d.slice(5,7)}<div class="mut">${esc(fincaNom(fi||null))}</div></td><td class="n">${g.length} ${g.length===1?'persona':'pers.'}</td><td class="n" style="width:84px">${eur(g.reduce((a,j)=>a+Number(j.importe),0))}</td></tr>`; }).join('')}</table></details>`; }).join('')}
    ${sv.length?`<details style="border-top:1px solid var(--line);padding:6px 0"><summary style="cursor:pointer;display:flex;gap:6px;align-items:baseline"><b style="flex:1">${titSv(sv)}</b><span class="mut" style="font-size:13px">${num(sv.reduce((a,x)=>a+Number(x.kilos||0),0))} kg</span><b>${eur(kS)}</b></summary><table>${sv.map(x=>`<tr class="click" data-ed="servicios:${x.id}"><td>${diaSemana(x.fecha)}<div class="mut">${esc(svNom(x))} · ${esc(svTxt(x))} · ${esc(fincaNom(x.finca_id))}</div></td><td class="n">${Number(x.kilos)?num(x.kilos)+' kg':'🚜'}</td><td class="n">${eur(x.importe)}</td></tr>`).join('')}</table></details>`:''}</div>`;
}

function editarGrupoJ(fecha,clave){ clave=decodeURIComponent(clave); const [tarea,finca]=clave.split('|'); const g=D.jornales.filter(j=>j.fecha===fecha&&(j.tarea||'')===tarea&&(j.finca_id||'')===finca).sort(porNombre); if(!g.length) return;

  const hRef=moda(g.map(j=>Number(j.horas)||0)), tot0=g.reduce((a,j)=>a+Number(j.importe),0);

  const svDia=()=>D.servicios.filter(x=>x.fecha===fecha&&(x.finca_id||'')===finca&&((x.empresa_id&&empIds.has(x.empresa_id))||(!x.empresa_id&&x.trabajador_id&&sueltos.has(x.trabajador_id))));

    <table class="gjT"><tr><th>Quién</th><th style="width:58px">Horas</th><th style="width:70px">€</th><th style="width:28px"></th></tr>${g.map(j=>`<tr data-gr="${j.id}"><td>${esc(trabNom(j.trabajador_id))}${j.sin_cobro?' <span class="tag">no cobra</span>':j.pagado?' <span class="tag">pagado</span>':''}</td><td><input data-gh="${j.id}" inputmode="decimal" value="${fmt(Number(j.horas)||0)}" style="width:52px" ${j.pagado?'disabled':''}></td><td><input data-gi="${j.id}" inputmode="decimal" value="${fmt(Number(j.importe)||0)}" style="width:64px" ${j.pagado||j.sin_cobro?'disabled':''}></td><td><button type="button" class="btn sec sm" data-gx="${j.id}" title="Quitar" style="padding:4px 8px">✕</button></td></tr>`).join('')}</table>

    ${(()=>{ const O=[...new Set(g.map(j=>j.empresa_id).filter(Boolean))].map(eid=>empresa(eid)).filter(e=>e&&(e.extras||[]).length).map(e=>['empresas',e]).concat(g.filter(j=>!j.empresa_id).map(j=>D.trabajadores.find(t=>t.id===j.trabajador_id)).filter(t=>t&&(t.extras||[]).length).map(t=>['trabajadores',t]));

    <span class="clab">Pagado</span><div class="chips" data-chips="pag"><button type="button" class="chip on" data-val="">No tocar</button><button type="button" class="chip" data-val="si">Todo pagado</button><button type="button" class="chip" data-val="no">Nada pagado</button></div><input type="hidden" name="pag" value="">

async function prepararArchivo(file){
  if(file.type==='application/pdf'){ if(file.size>9.5e6) throw new Error('El PDF pasa de 10 MB'); return {blob:file, mime:'application/pdf'}; }
  const img=await createImageBitmap(file);
  const k=Math.min(1, 2000/Math.max(img.width,img.height));
  const cv=document.createElement('canvas'); cv.width=Math.round(img.width*k); cv.height=Math.round(img.height*k);

  return {blob, mime:'image/jpeg'};
}

// Precio por kg o por litro (IVA incluido, como en las cuentas) de una línea de factura: «2 sacos de 5 kg por 100 €» → 10 €/kg
function precioBase(l,ua,fac){ let imp=Number(l.importe)||((Number(l.precio_unitario)||0)*(Number(l.cantidad)||0)); if(!(imp>0)) return null;
  const f=fac||D.facturas.find(x=>x.id===l.factura_id); imp*=f&&Number(f.base)>0&&Number(f.total)>=Number(f.base)?Number(f.total)/Number(f.base):(l.iva_pct!=null?1+Number(l.iva_pct)/100:1);
  const q=normU(l.cantidad,l.unidad); if(q&&q.u!=='ud'&&q.u===ua) return imp/q.n;
  // en sacos, envases o garrafas el tamaño suele venir en el nombre: «5 KG», «250 ML», «20L»
  const m=/(\d+(?:[.,]\d+)?)\s*(kgs?|gr?|lts?|litros?|l|ml|cc)\b/i.exec(`${l.producto||''} ${l.nombre_comun||''}`); if(m){ const t=normU(pn(m[1]),m[2]); if(t&&t.u===ua) return imp/((Number(l.cantidad)||1)*t.n); }
  return null; }
function precioUd(l){ return l.precio_unitario!=null ? Number(l.precio_unitario) : (l.cantidad ? Number(l.importe)/Number(l.cantidad) : null); }

function ventana(meses, f=hoy()){
  if(!meses||!meses.length) return null;
  const [y,m]=f.split('-').map(Number); if(!meses.includes(m)) return null;
  const pm=x=>x===1?12:x-1, nm=x=>x===12?1:x+1;
  let s=m, ys=y, n=0; while(meses.includes(pm(s))&&n<11){ if(s===1) ys--; s=pm(s); n++; }
  let e=m, ye=y; n=0; while(meses.includes(nm(e))&&n<11){ if(e===12) ye++; e=nm(e); n++; }
  const ult=new Date(ye,e,0).getDate();

var DV=0; const MEMO={};

function pendientesLaboresCalc(){

  const parado=(L,fid)=>D.labores.some(x=>x.labor===L.id&&x.finca_id===(fid||null)&&x.estado!=='hecha'&&x.hasta&&x.hasta>=h);
  laboresActivas().forEach(L=>{
    if(L.especial==='vuelta'){
      fincas.forEach(f=>{ const u=evs.filter(e=>e.finca===f.id&&e.fecha<=h).reduce((m,e)=>e.fecha>m?e.fecha:m,''); const d=u?difDias(u,h):999;

      return;
    }
    const lista = L.global ? [null] : fincas.filter(f=>!L.riego||f.riego);
    lista.forEach(f=>{
      const fid=f?f.id:null; if(parado(L,fid)) return;
      let desde=null, resta=null, toca=false, pronto=null;
      if(L.tras){
        const base=LABORES.find(x=>x.fam===L.tras.fam)||{fam:L.tras.fam,nombre:''};
        const ub=ultimo(evs,base,fid,addDias(h,-Math.max(60,L.tras.a+10)));
        if(!ub) return;
        if(L.tras.fin && difDias(ub,h)<L.tras.de) return; // aún se está haciendo
        desde=ub; resta=L.tras.a-difDias(ub,h); toca=difDias(ub,h)>=L.tras.de;
        if(L.meses && !ventana(L.meses)) return;
        if(L.meses){ const v=ventana(L.meses); resta=Math.min(resta,difDias(h,v.fin)); }
        if(resta<-14) return; // el plazo pasó hace tiempo: ya no se avisa
      } else if(L.meses){
        const v=ventana(L.meses);
        if(v){ desde=v.ini; resta=difDias(h,v.fin); toca=true;
          if(L.cada){ const u=ultimo(evs,L,fid,v.ini); if(u && difDias(u,h)<L.cada) return; desde=null; } }
        else { const p=proxVentana(L.meses); if(p && difDias(h,p.ini)<=21){ pronto=p.ini; desde=p.ini; } else return; }

}

const nn=v=>num(v, Number.isInteger(Number(v))?0:2);
const DOSIS_U=[['g/100L','g/100 L'],['cc/100L','cc/100 L'],['%','%'],['kg/ha','kg/ha'],['l/ha','l/ha'],['kg/cuba','kg/cuba'],['l/cuba','l/cuba']];
const MOTIVOS_APL=['Repilo','Mosca','Prays','Abono foliar','Aminoácidos','Abonado al suelo','Herbicida','Otro'];
// Cantidad de producto por cuba según la dosis. lha = litros de caldo por hectárea (para dosis por ha)
function porCuba(valor, unidad, cuba, lha, udProd){
  const v=Number(valor), c=Number(cuba); if(!(v>0)||!(c>0)) return null;
  switch(unidad){
    case 'g/100L': return {n:v*c/100/1000, u:'kg'};
    case 'cc/100L': return {n:v*c/100/1000, u:'l'};
    case '%': return {n:v*c/100, u:/^(kg|l)$/.test(udProd||'')?udProd:'kg o l'};
    case 'kg/ha': return lha>0?{n:v*c/lha, u:'kg'}:null;
    case 'l/ha': return lha>0?{n:v*c/lha, u:'l'}:null;
    case 'kg/cuba': return {n:v, u:'kg'};
    case 'l/cuba': return {n:v, u:'l'};
  }
  return null;
}

const udAlm=nombre=>{ const a=buscaAlm(nombre); return a&&/^(kg|l)$/.test(a.unidad||'')?a.unidad:null; };
const litrosHa=(caudal, vel, calle)=> (caudal>0&&vel>0&&calle>0) ? caudal*600/(vel*calle) : null;

function editarCuba(id, base){
  const c = id ? cubasEstandar().find(x=>x.id===id) : (base||{nombre:'',motivo:'',productos:[{producto:'',valor:'',unidad:'g/100L',plazo:''}]});
  const nombres=[...new Set(D.tratamientos.map(t=>t.producto).filter(Boolean))].slice(0,60);
  const chips=(name,ops,val)=>`<div class="chips" data-chips="${name}">${ops.map(([x,t])=>`<button type="button" class="chip ${String(val)===String(x)?'on':''}" data-val="${esc(x)}">${esc(t)}</button>`).join('')}</div><input type="hidden" name="${name}" value="${esc(val??'')}">`;
  const lin=(l,i)=>`<div class="lab" data-pl="${i}"><div class="row" style="flex-wrap:nowrap"><input name="pr_${i}" list="dlProd2" placeholder="Producto (con su marca si quieres)" value="${esc(l.producto||'')}" style="flex:1"><button type="button" class="btn del sm" data-qp="${i}">✕</button></div>
     <div class="grid2" style="grid-template-columns:1fr 1fr;margin-top:6px"><label>Dosis<input name="dv_${i}" inputmode="decimal" value="${l.valor!=null&&l.valor!==''?String(l.valor).replace('.',','):''}"></label><label>Plazo seguridad (días)<input name="ps_${i}" inputmode="numeric" value="${esc(l.plazo??'')}"></label></div>
     ${chips('du_'+i, DOSIS_U, l.unidad||'g/100L')}</div>`;
  $('#frm').oninput=null; $('#frm').onchange=null;
  $('#frm').innerHTML=`<h3>${id?'Editar':'Nueva'} cuba estándar</h3>
    <label>Nombre<input name="nombre" value="${esc(c.nombre||'')}" placeholder="p. ej. Cobre de otoño, Abono + aminoácidos…"></label>
    <span class="clab">Para qué</span>${chips('motivo', MOTIVOS_APL.map(x=>[x,x]), c.motivo||'')}
    <span class="clab">Productos</span><div id="cLin">${(c.productos||[]).map(lin).join('')}</div>
    <button type="button" class="btn sec sm" id="cMas" style="margin-bottom:10px">+ Otro producto</button>
    <datalist id="dlProd2">${nombres.map(n=>`<option value="${esc(n)}">`).join('')}</datalist>
    <p class="mut">La dosis de cada producto es la de su etiqueta. Al usar la cuba se calcula lo que va en cada carga.</p>
    <div class="row acciones" style="justify-content:space-between"><div>${id?'<button type="button" class="btn del" id="cDel">Borrar</button>':''}</div><div class="row"><button type="button" class="btn sec" id="fCancel">Cancelar</button><button class="btn" id="fOk">Guardar</button></div></div>`;
  const F=$('#frm'); activarChips(F);
  let nl=(c.productos||[]).length;
  const quitar=()=>F.querySelectorAll('[data-qp]').forEach(b=>b.onclick=()=>{ if(F.querySelectorAll('[data-pl]').length>1) b.closest('[data-pl]').remove(); });
  quitar();
  $('#cMas').onclick=()=>{ $('#cLin').insertAdjacentHTML('beforeend',lin({},nl)); activarChips($(`[data-pl="${nl}"]`)); F.querySelector(`[name=pr_${nl}]`).focus(); nl++; quitar(); };
  $('#fCancel').onclick=()=>$('#dlg').close();
  if(id) $('#cDel').onclick=async()=>{ if(!confirm('¿Borrar esta cuba estándar?')) return; AJ.cubas=cubasEstandar().filter(x=>x.id!==id); $('#dlg').close(); await guardarAjustes(); render(); };
  F.onsubmit=async e=>{ e.preventDefault();
    const nombre=F.nombre.value.trim();
    const productos=[...F.querySelectorAll('[data-pl]')].map(el=>{ const i=el.dataset.pl; return {producto:F[`pr_${i}`].value.trim(), valor:pn(F[`dv_${i}`].value), unidad:F[`du_${i}`].value, plazo:pn(F[`ps_${i}`].value)}; }).filter(x=>x.producto);
    if(!nombre){ toast('Ponle un nombre'); return; } if(!productos.length){ toast('Pon algún producto'); return; }
    const nueva={id:id||('c_'+Date.now()), nombre, motivo:F.motivo.value||'', productos};
    AJ.cubas = id ? cubasEstandar().map(x=>x.id===id?nueva:x) : [...cubasEstandar(), nueva];
    $('#dlg').close(); await guardarAjustes(); render(); toast(`Cuba «${nombre}» guardada`); };
  $('#dlg').showModal(); if(!id&&!TACTIL) setTimeout(()=>F.nombre.focus(),50);
}
function htmlCubas(){
  const l=cubasEstandar();
  return `<div class="card"><h2>Cubas estándar<span class="sp"></span><button class="btn sec sm" onclick="editarCuba()">+ Nueva</button></h2>
    ${l.length?l.map(c=>`<div class="lab click" onclick="editarCuba('${c.id}')"><div class="row" style="flex-wrap:nowrap"><b style="flex:1">${esc(c.nombre)}</b>${c.motivo?`<span class="tag">${esc(c.motivo)}</span>`:''}</div><div class="mut">${c.productos.map(p=>`${esc(p.producto)} ${p.valor!=null?nn(p.valor)+' '+esc((DOSIS_U.find(d=>d[0]===p.unidad)||[0,p.unidad])[1]):''}`).join(' + ')}</div>
      <div class="row" style="margin-top:6px"><button class="btn sm" onclick="event.stopPropagation();abrirAplicacion(null,'${c.id}')">Usar ahora</button></div></div>`).join('')
    :'<p class="mut">Guarda aquí tus mezclas de siempre (p. ej. «Cobre de otoño» o «Abono + aminoácidos») y al apuntar una curación se rellenan con un toque.</p>'}</div>`;
}

function htmlTratamientos(){
  const fF=SUB.tratF||'*';
  const ok=t=>fF==='*'||t.finca_id===fF;
  const apls=[...D.aplicaciones].filter(ok).sort((a,b)=>b.fecha.localeCompare(a.fecha));
  const sueltos=D.tratamientos.filter(t=>!t.aplicacion_id&&ok(t));
  const items=[...apls.map(a=>({f:a.fecha,a})),...sueltos.map(t=>({f:t.fecha,t}))].sort((x,y)=>y.f.localeCompare(x.f));
  return `${chipsFiltro('tratF',[['*','Todas'],...D.fincas.filter(f=>f.activa).map(f=>[f.id,f.nombre])],fF)}
  ${items.length?items.map(({a,t})=>{
    if(t) return `<div class="lab click" data-ed="tratamientos:${t.id}"><b>${fFecha(t.fecha)} · ${esc(fincaNom(t.finca_id))}</b><div>${esc(t.producto)} <span class="mut">${esc(t.dosis||'')}</span></div></div>`;
    const ps=D.tratamientos.filter(x=>x.aplicacion_id===a.id); const ol=a.olivos||D.fincas.find(f=>f.id===a.finca_id)?.olivos;
    return `<div class="lab click" onclick="abrirAplicacion(D.aplicaciones.find(x=>x.id==='${a.id}'))"><div class="row" style="flex-wrap:nowrap"><b style="flex:1">${fFecha(a.fecha)} · ${esc(fincaNom(a.finca_id))}</b>${ps[0]?.motivo?`<span class="tag">${esc(ps[0].motivo)}</span>`:''}</div>
      <div class="mut">${a.maquina_id?esc(maqNom(a.maquina_id))+' · ':''}${a.n_cubas?`${nn(a.n_cubas)} ${Number(a.n_cubas)===1?'cuba':'cubas'} de ${num(a.cuba_l)} l = ${num(a.litros_total)} l`:''}${ol&&a.litros_total?` · ${num(a.litros_total/ol,1)} l/olivo`:''}${a.velocidad_kmh?` · ${num(a.velocidad_kmh,1)} km/h`:''}</div>
      ${ps.map(p=>`<div>${esc(p.producto)} <span class="mut">${esc(p.dosis||'')}${p.cantidad!=null?` · total ${fCant({n:Number(p.cantidad),u:p.unidad||''})}`:''}</span></div>`).join('')}</div>`; }).join('')
  :'<p class="mut">Sin curaciones apuntadas.</p>'}`;
}
function vCalc(){
  const at=atomizadores(), m=at.find(x=>x.id===SUB.calcM)||at[0], f=D.fincas.find(x=>x.id===SUB.calcF)||D.fincas.find(x=>x.activa);
  const olha = f&&f.ha&&f.olivos ? f.olivos/f.ha : '';
  const inp=(id,l,v,ph='')=>`<label>${l}<input id="${id}" inputmode="decimal" value="${v??''}" placeholder="${ph}"></label>`;
  return `<div class="card"><h2>Calcular dosis<span class="sp"></span><button class="btn sm" onclick="abrirAplicacion()">Apuntar curación</button></h2>
    <p class="mut">Esto es una calculadora: no apunta la curación. Cuando cures, apúntala con «Apuntar curación».</p>
    ${at.length?chipsFiltro('calcM',at.map(x=>[x.id,x.nombre]),m?.id):''}${chipsFiltro('calcF',D.fincas.filter(x=>x.activa).map(x=>[x.id,x.nombre]),f?.id)}
    <b>1. ¿Cuánto producto echo en la cuba o mochila?</b>
    <div class="grid2">${inp('cDos','Dosis de la etiqueta','')}${inp('cCuba','Cuba o mochila (litros)',m?.capacidad_l||ULT.apl?.cuba_l||'')}</div>
    <div class="chips scrollx" id="cUni">${DOSIS_U.slice(0,5).map(([k,t],i)=>`<button type="button" class="chip ${i===0?'on':''}" data-u="${k}">${t}</button>`).join('')}</div>
    <div class="grid2">${inp('cCubas','Nº de cubas','1')}${inp('cLha','Litros de caldo por ha (solo para dosis por ha)','')}</div>
    <div class="aviso ok" id="r1">—</div>
    <b>2. ¿Cuánto caldo necesito?</b>
    <div class="grid2">${inp('cOl','Olivos a tratar',f?.olivos||'')}${inp('cLol','Litros por olivo','5')}</div>
    <div class="aviso ok" id="r2">—</div>
    ${(()=>{ const t=m?.tipo||'Atomizador';
      if(t==='Cuba de pistolas') return `<b>3. Cuba de pistolas</b><div class="grid2">${inp('cCauP','Caudal de cada pistola (l/min)',m?.caudal_lmin||'')}${inp('cNp','Nº de pistolas',m?.n_pistolas||2)}${inp('cSegOl','Segundos que das a cada olivo','')}${inp('cObj','Litros por olivo que quiero','')}</div><div class="aviso ok" id="r3">—</div><p class="mut">Para el caudal: dispara una pistola un minuto dentro de un cubo o bidón y mide los litros.</p>`;
      if(t==='Cuba con barra (herbicida)') return `<b>3. Cuba con barra</b><div class="grid2">${inp('cCau','Caudal total de la barra (l/min)',m?.caudal_lmin||'')}${inp('cAncho','Ancho de la barra (m)',m?.ancho_m||'')}${inp('cVel','Velocidad (km/h)',m?.velocidad_kmh||'')}${inp('cSeg','…o segundos en recorrer 100 m','')}${inp('cObjHa','Litros por hectárea que quiero','')}</div><div class="aviso ok" id="r3">—</div><p class="mut">Para el caudal: con la presión de trabajo, recoge lo que echa una boquilla en un minuto y multiplícalo por el nº de boquillas.</p>`;
      if(t==='Mochila') return `<b>3. Mochila</b><div class="aviso ok" id="r3">—</div><p class="mut">Con los litros por olivo del punto 2 te digo cuántos olivos da cada mochila.</p>`;
      return `<b>3. Regular el atomizador</b>
      <p class="mut" style="margin:2px 0 8px">Pon el caudal, la distancia entre olivos y la velocidad: te digo cuántos litros echas por olivo y a qué velocidad ir para echar los del punto 2. Lo que pongas se queda guardado en el atomizador y en la finca.</p>
      <div class="grid2">${inp('cCau','Caudal de todas las boquillas (l/min)',m?.caudal_lmin||'','p. ej. 40')}${inp('cMarco','Marco: metros entre olivos (10 si es 10×10)',f?.calle_m||'','p. ej. 10')}
      ${inp('cVel','Velocidad (km/h)',m?.velocidad_kmh||'','p. ej. 5')}${inp('cSeg','…o segundos que tardas en 100 m','')}</div>
      <details class="adv"><summary>No sé el caudal: medirlo</summary><p class="mut">Con el atomizador parado, llénalo hasta una marca, abre todas las boquillas a la presión de trabajo y cronometra. Luego mide los litros que ha bajado.</p>
        <div class="grid2">${inp('cMlit','Litros que han bajado','')}${inp('cMmin','En cuántos minutos','1')}</div></details>
      <div class="aviso ok" id="r3">—</div>`; })()}</div>
  <div class="card"><h2>Recomendaciones orientativas</h2><ul>
    <li><b>Pistolas y mochila:</b> moja el olivo por dentro y por fuera hasta que la hoja esté brillante, sin que llegue a chorrear. Presión constante.</li>
    <li><b>Barra de herbicida:</b> boquillas de abanico o antideriva, altura constante sobre el suelo y nunca con viento: la deriva quema el olivo.</li>
    <li><b>Velocidad del atomizador:</b> en olivar tradicional se suele tratar entre 4 y 6 km/h; más despacio (3-4 km/h) con olivos grandes o muy espesos para que moje por dentro. Ir más rápido baja los litros por olivo.</li>
    <li><b>Caldo:</b> suele ir de 3 a 8 litros por olivo según el tamaño de la copa. Si la etiqueta da la dosis por hectárea, no subas el caldo sin recalcular el producto.</li>
    <li><b>Viento:</b> no tratar con más de 10 km/h ni con rachas; mejor a primera hora o al atardecer, sin calor fuerte y con la hoja seca.</li>
    <li><b>Lluvia:</b> deja al menos 4 h sin lluvia después (el cobre necesita secarse sobre la hoja).</li>
    <li><b>Presión y boquillas:</b> las que indique el fabricante; boquillas antideriva cerca de arroyos y casas. Revisa que ninguna esté atascada.</li>
    <li><b>Siempre:</b> la dosis y el plazo de seguridad de la etiqueta mandan. Apunta cada curación (cuaderno de campo) y lleva el carné de aplicador.</li></ul></div>`;
}
function postCalc(){
  const g=id=>pn($('#'+id)?.value)||0; if(!$('#cDos')) return;
  let uni='g/100L';
  const run=()=>{
    const cuba=g('cCuba'), nc=g('cCubas')||1, lhaIn=g('cLha');
    const pc=porCuba(g('cDos'),uni,cuba,lhaIn);
    $('#r1').innerHTML = pc ? `Por cuba: <b>${fCant(pc)}</b> · para ${nn(nc)} ${nc===1?'cuba':'cubas'}: <b>${fCant({n:pc.n*nc,u:pc.u})}</b>` : (/ha$/.test(uni)&&!lhaIn?'Para dosis por hectárea pon los litros de caldo por ha (o calcúlalos en el punto 3).':'Pon la dosis y la cuba.');
    const ol=g('cOl'), lol=g('cLol'), lit=ol*lol;
    $('#r2').innerHTML = lit ? `Necesitas <b>${num(lit)} l</b> de caldo${cuba?` = <b>${num(lit/cuba,1)} cubas</b> de ${num(cuba)} l`:''}` : 'Pon olivos y litros por olivo.';
    if($('#cCauP')){ const cp=g('cCauP'), np=g('cNp')||1, so=g('cSegOl'), obj=g('cObj'); let t='';
      if(cp&&so){ const lo=cp*so/60; t+=`Echas <b>${num(lo,1)} l por olivo</b>${cuba?` · una cuba da para <b>${num(cuba/lo)} olivos</b>`:''}. `; }
      if(cp&&obj) t+=`Para ${num(obj,1)} l por olivo dale <b>${num(obj*60/cp)} segundos</b> a cada uno. `;
      if(cp&&cuba) t+=`Con ${np} ${np===1?'pistola':'pistolas'} la cuba se vacía en unos <b>${num(cuba/(cp*np))} minutos</b>.`;
      $('#r3').innerHTML=t||'Pon el caudal de la pistola y los segundos por olivo.'; return; }
    if($('#cAncho')){ const ca=g('cCau'), an=g('cAncho'), ve=g('cVel')||(g('cSeg')?360/g('cSeg'):0), oh=g('cObjHa'); let t='';
      if(g('cSeg')&&!g('cVel')) t+=`Vas a <b>${num(ve,1)} km/h</b>. `;
      const lh=litrosHa(ca,ve,an); if(lh){ t+=`Echas <b>${num(lh)} l/ha</b>${cuba?` · una cuba da para <b>${num(cuba/lh,2)} ha</b>`:''}. `; }
      if(ca&&an&&oh) t+=`Para ${num(oh)} l/ha ve a <b>${num(velPara(ca,oh,an),1)} km/h</b>.`;
      $('#r3').innerHTML=t||'Pon caudal, ancho de barra y velocidad.'; return; }
    if(!$('#cCau')){ const lo=g('cLol'); $('#r3').innerHTML = cuba&&lo ? `Cada mochila de ${num(cuba)} l da para <b>${num(cuba/lo)} olivos</b>${ol?` · para ${num(ol)} olivos necesitas <b>${num(Math.ceil(ol*lo/cuba))} mochilas</b>`:''}.` : 'Pon los litros de la mochila y los litros por olivo.'; return; }
    if(g('cMlit')&&g('cMmin')&&document.activeElement&&['cMlit','cMmin'].includes(document.activeElement.id)) $('#cCau').value=String(Math.round(g('cMlit')/g('cMmin')*10)/10).replace('.',',');
    const cau=g('cCau'), dist=g('cMarco'), vel=g('cVel')||(g('cSeg')?360/g('cSeg'):0), obj=g('cLol');
    let t='';
    if(g('cSeg')&&!g('cVel')) t+=`Vas a <b>${num(vel,1)} km/h</b>. `;
    if(cau&&dist&&vel){ const lol=cau*dist*0.06/vel, lha=dist?litrosHa(cau,vel,dist):null; t+=`Echas <b>${num(lol,1)} litros por olivo</b>${lha?` (${num(lha)} l/ha con marco de ${num(dist)} × ${num(dist)} m)`:''}${cuba?` · una cuba de ${num(cuba)} l da para <b>${num(cuba/lol)} olivos</b>`:''}. `; }
    if(cau&&dist&&obj){ const v=cau*dist*0.06/obj; t+=`Para echar <b>${num(obj,1)} l por olivo</b> (punto 2) ve a <b>${num(v,1)} km/h</b>${v>6.5?' — demasiado rápido: cierra boquillas o baja el caudal':v<2.5?' — muy lento: abre más boquillas o sube el caudal':''}.`; }
    $('#r3').innerHTML = t || (!cau?'Falta el caudal (abajo te digo cómo medirlo).':!dist?'Falta la distancia entre olivos.':'Pon la velocidad o los litros por olivo del punto 2.');
  };
  // guardar en el atomizador y en la finca lo que se cambie
  const mq=atomizadores().find(x=>x.id===SUB.calcM)||atomizadores()[0], fi=D.fincas.find(x=>x.id===SUB.calcF)||D.fincas.find(x=>x.activa);
  const guarda=async(tabla,id,campo,v,nom)=>{ if(!id||v==null) return; const {error}=await sb.from(tabla).update({[campo]:v}).eq('id',id); if(error){ sinRed(error); return; } const r=D[tabla.replace('olv_','')].find(x=>x.id===id); if(r) r[campo]=v; toast(`Guardado en ${nom}`); };
  [['cCau','caudal_lmin'],['cVel','velocidad_kmh']].forEach(([id,c])=>{ const el=$('#'+id); if(el&&mq&&esAplicacion(mq)) el.addEventListener('change',()=>guarda('olv_maquinas',mq.id,c,pn(el.value),mq.nombre)); });
  const em=$('#cMarco'); if(em&&fi) em.addEventListener('change',()=>guarda('olv_fincas',fi.id,'calle_m',pn(em.value),fi.nombre));
  ['cMlit','cMmin'].forEach(id=>{ const el=$('#'+id); if(el) el.addEventListener('change',()=>{ const c=$('#cCau'); if(c) c.dispatchEvent(new Event('change')); }); });

  document.querySelectorAll('#cUni .chip').forEach(b=>b.onclick=()=>{ document.querySelectorAll('#cUni .chip').forEach(x=>x.classList.remove('on')); b.classList.add('on'); uni=b.dataset.u; run(); });
  document.querySelectorAll('#view input').forEach(i=>i.addEventListener('input',run)); run();
}

function textoCuenta(clave,tid){ const [tipo,id]=clave.split(':'), subs=tid!=null?[subCuenta(clave,tid)]:Object.values(cuentaClave(clave).subs), esJ=libroPagos().esJ;
  const nom=tid?trabNom(tid):tipo==='e'?empNom(id):trabNom(id), I=subs.flatMap(s=>s.items).sort((a,b)=>porFechaId(a,b)||porNombre(a,b));
  const bruto=cent(I.reduce((a,x)=>a+Number(x.importe||0),0)), aC=cent(subs.reduce((a,s)=>a+s.aC,0)), nJ=I.filter(x=>esJ(x.id)).length, nS=I.length-nJ;
  const lin=I.map(x=>esJ(x.id)?`· ${fFecha(x.fecha)} ${tipo==='e'&&!tid?trabNom(x.trabajador_id)+' ':''}${fH(x.horas)} h ${x.tarea||''} (${fincaNom(x.finca_id)}) ${eur(x.importe)}`:`· ${fFecha(x.fecha)} ${svTxt(x)} (${fincaNom(x.finca_id)}) ${eur(x.importe)}`);
  return `${nom}: ${nJ} ${nJ===1?'jornada':'jornadas'}${nS?` y ${nS} de máquinas o kilos`:''} sin cobrar = ${eur(bruto)}\n`+lin.join('\n')
    +(Math.abs(aC)>0.004?`\n${aC>0?'Pagado a cuenta: −'+eur(aC):'Falta de días ya pagados: +'+eur(-aC)}\nQueda por pagar: ${eur(Math.max(0,cent(bruto-aC)))}`:''); }

// --- Resumen de hoy
function resumenHoy(){
  const h=hoy(), c=[];
  const j=D.jornales.filter(x=>x.fecha===h); if(j.length) c.push([`${j.length} ${j.length===1?'jornada':'jornadas'}`,"SUB.jornales='libreta';ir('jornales')"]);
  const g=D.gastos.filter(x=>x.fecha===h); if(g.length) c.push([`${g.length} ${g.length===1?'gasto':'gastos'} · ${eur(g.reduce((a,x)=>a+Number(x.importe),0))}`,"SUB.cuentas='gastos';ir('cuentas')"]);
  const p=D.pesadas.filter(x=>x.fecha===h); if(p.length) c.push([`${num(p.reduce((a,x)=>a+Number(x.kilos),0))} kg a la almazara`,"SUB.cuentas='cosecha';ir('cuentas')"]);
  const a=D.aplicaciones.filter(x=>x.fecha===h); if(a.length) c.push([`${a.length} ${a.length===1?'curación':'curaciones'}`,"SUB.campo='trat';ir('campo')"]);
  const n=D.notas.filter(x=>x.fecha===h); if(n.length) c.push([`${n.length} ${n.length===1?'nota':'notas'}`,"SUB.campo='notas';ir('campo')"]);
  const t=D.tareas.filter(x=>x.hecha&&x.hecha_fecha===h).length+D.labores.filter(x=>x.estado==='hecha'&&x.fecha===h).length; if(t) c.push([`${t} ${t===1?'cosa hecha':'cosas hechas'}`,"SUB.campo='labores';ir('campo')"]);
  return c.length?`<div class="card"><h2>Hoy has apuntado</h2><div class="chips" style="margin:0">${c.map(([t,fn])=>`<button class="chip" onclick="${fn}">${esc(t)}</button>`).join('')}</div></div>`:'';
}
// --- Compartir jornales (WhatsApp, etc.)
async function compartir(texto){
  try{ if(navigator.share){ await navigator.share({text:texto}); return; } }catch(e){ if(e.name==='AbortError') return; }
  try{ await navigator.clipboard.writeText(texto); toast('Copiado: pégalo en WhatsApp'); }catch(e){ prompt('Copia el texto:',texto); }
}

let METEO_CACHE={};
async function getMeteo(f, pasados=1){

}
function horas(w){ const H=w.hourly; return H.time.map((t,i)=>({fecha:t.slice(0,10),h:+t.slice(11,13),t:H.temperature_2m[i],hr:H.relative_humidity_2m[i],td:H.dew_point_2m?.[i],p:H.precipitation[i]||0,pp:H.precipitation_probability?.[i]??0,v:H.wind_speed_10m[i],r:H.wind_gusts_10m?.[i],nub:H.cloud_cover?.[i]})); }

function mojado(x,hr){ const u=AJ.umb; const lim=hr??u.moj_hr; return x.p>0.1 || x.hr>=lim || (x.td!=null && x.t-x.td<=u.moj_dif); }
// Hora estimada a la que la oliva está seca ese día. {mojada:false} si amanece seca; seco:null si no se seca antes de las 19 h
// Horas en que el olivo está seco (se puede trabajar debajo sin mojarse), con el retraso propio de la finca
function horasSecas(H, fecha, finca){
  const u=AJ.umb; const i0=H.findIndex(x=>x.fecha===fecha&&x.h===0); if(i0<0) return null;
  const hr=finca?.umbral_hr??null, ret=Math.max(0,Math.round(Number(finca?.retraso_secado_h||0)));
  const seca={};
  for(let h=0;h<24;h++){
    const i=i0+h; if(!H[i]) break;
    const ll12=H.slice(Math.max(0,i-12),i).reduce((s,x)=>s+x.p,0);
    const k=(ll12>=1?u.seco_horas_lluvia:u.seco_horas)+ret;
    seca[h] = i-k+1>=0 && H.slice(i-k+1,i+1).every(x=>!mojado(x,hr));
  }
  return seca;

function tramos(seca,de,a){ const out=[]; let ini=null; for(let h=de;h<=a+1;h++){ const s=h<=a&&seca[h]; if(s&&ini==null) ini=h; if(!s&&ini!=null){ out.push([ini,h]); ini=null; } } return out; }
function horaSeco(H, fecha, retraso=0, hr=null){
  const moj=x=>mojado(x,hr);
  const u=AJ.umb; const i0=H.findIndex(x=>x.fecha===fecha&&x.h===0); if(i0<0) return null;
  const at=h=>H[i0+h];
  const lluviaNoche=H.slice(Math.max(0,i0-4),i0+8).reduce((s,x)=>s+x.p,0);
  const mananaMojada=[4,5,6,7,8].some(h=>at(h)&&moj(at(h))) || lluviaNoche>0.2;
  if(!mananaMojada) return {mojada:false};
  for(let h=7;h<=19;h++){
    const i=i0+h; if(!H[i]) break;
    const ll12=H.slice(Math.max(0,i-12),i).reduce((s,x)=>s+x.p,0);
    const k = ll12>=1 ? u.seco_horas_lluvia : u.seco_horas;
    if(i-k+1>=0 && H.slice(i-k+1,i+1).every(x=>!moj(x))){ const s=h+Number(retraso||0); return {mojada:true, seco: s>19?null:s, base:h}; }

function evaluarTiempo(w, finca){
  const u=AJ.umb, H=horas(w), Dd=w.daily, out=[];

    const hAhora=fecha===hoy()?new Date().getHours():0, quedan=hh.filter(x=>x.h>=6&&x.h<=21&&x.h>=hAhora); // hoy, solo las horas que quedan
    quedan.forEach(x=>{

    });
    const nomMot={viento:'mucho viento',calma:'viento en calma',lluvia:'lluvia',calor:'calor',frio:'frío',seco:'aire seco',mojada:'hoja mojada'};
    const peor=Object.entries(motivos).sort((a,b)=>b[1]-a[1])[0];
    const spray = mejor.length>=u.spray_min_horas ? {c:'g',txt:`${mejor[0]}–${mejor[mejor.length-1]+1} h`} : mejor.length ? {c:'a',txt:`solo ${mejor[0]}–${mejor[mejor.length-1]+1} h`} : {c:'r',txt:!quedan.length&&hh.length?'ya no queda día':nomMot[peor[0]]};
    // trabajar
    const dia=hh.filter(x=>x.h>=8&&x.h<=18);
    const ll=dia.reduce((s,x)=>s+x.p,0), tmax=Math.max(...dia.map(x=>x.t)), rmax=Math.max(...dia.map(x=>x.r||0));
    let work;

// Ajuste por finca con los días perdidos apuntados: con qué humedad se moja y cuánto tarda en secarse
function calibrar(fid){
  const u=AJ.umb;
  const R=D.dias_perdidos.filter(x=>x.finca_id===fid&&x.motivo==='Mojada'&&x.hora_seco!=null&&Array.isArray(x.meteo)&&x.meteo.length>=10)
    .map(x=>({real:Number(x.hora_seco), H:x.meteo.map(m=>({...m,fecha:x.fecha,p:m.p||0})), fecha:x.fecha}));
  if(R.length<2) return null;
  // 1) días que la app daba por secos: la finca se moja con menos humedad
  let umbral=u.moj_hr;
  R.forEach(r=>{ const s=horaSeco(r.H,r.fecha,0,u.moj_hr); if(s&&!s.mojada){ const mx=Math.max(...r.H.filter(m=>m.h>=4&&m.h<=9).map(m=>m.hr)); umbral=Math.min(umbral, Math.floor(mx)-1); } });
  umbral=Math.max(80,umbral);
  // 2) con ese umbral, cuánto se retrasa el secado real respecto al calculado
  const dif=R.map(r=>{ const s=horaSeco(r.H,r.fecha,0,umbral); return s&&s.mojada&&s.base!=null ? r.real-s.base : null; }).filter(v=>v!=null).sort((a,b)=>a-b);
  const med=dif.length ? (dif.length%2?dif[(dif.length-1)/2]:(dif[dif.length/2-1]+dif[dif.length/2])/2) : 0;
  return {n:R.length, umbral: umbral<u.moj_hr?umbral:null, retraso: Math.round(med*2)/2};
}

function normU(c,u){ u=(u||'').toLowerCase().trim(); c=Number(c); if(!(c>0)) return null;

  // el del almacén cuyo nombre va dentro de lo buscado («Cobre Nordox 75» en «Cobre Nordox 75 WG»): el más largo, si no hay empate
  const A=L.filter(x=>x.k.length>3&&(' '+n+' ').includes(' '+x.k+' ')).sort((x,y)=>y.k.length-x.k.length); if(A.length&&!(A[1]&&A[1].k.length===A[0].k.length)) return A[0].a;

function gasoilAnio(y){ // solo gasóleo B (agrícola): es el único que tiene devolución

  plazos().forEach(p=>{ const {ini,fin}=plazoAnio(p,y); if(plazoHecho(p,y)||h>fin) return; const di=difDias(h,ini), df=difDias(h,fin);

  D.almacen.filter(a=>a.activo!==false&&a.caduca).forEach(a=>{ const d=difDias(h,a.caduca); if(d<=30) out.push({c:d<0?'bad':'',t:`${d<0?'Caducado':'Caduca el '+fFecha(a.caduca)}: <b>${esc(a.nombre)}</b> (almacén)`,ord:30+d/100,fn:`SUB.campo='almacen';ir('campo')`}); });
  const env=envasesPendientes(); const desde=AJ.sigfito_ult||D.tratamientos.map(t=>t.fecha).sort()[0];
  if(env>=3&&desde&&difDias(desde,h)>=180) out.push({c:'',t:`Lleva los envases vacíos de fitosanitarios al punto SIGFITO (hace más de 6 meses${AJ.sigfito_ult?' de la última vez':''})`,ord:45,fn:`SUB.campo='almacen';ir('campo')`});
  if(!AJ.ult_copia||difDias(AJ.ult_copia,h)>=30) out.push({c:'',t:`${AJ.ult_copia?'Hace más de un mes de tu última copia':'Aún no has hecho ninguna copia'} de seguridad: <b>descárgala</b>`,ord:60,fn:'abrirCopia()'});
  return out;
}

function km(a,b,c,d){ const R=6371, r=x=>x*Math.PI/180, dl=r(c-a), dn=r(d-b); const h=Math.sin(dl/2)**2+Math.cos(r(a))*Math.cos(r(c))*Math.sin(dn/2)**2; return 2*R*Math.asin(Math.sqrt(h)); }
function centroFincas(){ const f=D.fincas.filter(x=>x.activa&&x.lat!=null&&x.lon!=null); if(!f.length) return {lat:38.175,lon:-3.0}; return {lat:f.reduce((a,x)=>a+Number(x.lat),0)/f.length, lon:f.reduce((a,x)=>a+Number(x.lon),0)/f.length}; }
let GAS=null;
async function cargarGasolineras(){
  if(GAS&&Date.now()-GAS.t<30*60e3) return GAS.l;
  const {data,error}=await sb.from('olv_gasolineras').select('*'); if(error||!data) return GAS?GAS.l:[];
  const c=centroFincas(); data.forEach(g=>g.km=g.lat!=null?km(c.lat,c.lon,g.lat,g.lon):999); data.sort((a,b)=>a.km-b.km);
  GAS={t:Date.now(),l:data}; return aplicarDesc(data);
}

// ===== Mis almazaras (puntos de entrega guardados) =====
function misAlm(){ return (AJ.almazaras||[]).filter(a=>a&&a.nombre); }
const ALM_CAMPOS=[['cif','CIF / NIF'],['telefono','Teléfono'],['email','Correo'],['contacto','Persona de contacto'],['direccion','Dirección'],['localidad','Localidad'],['rgseaa','Nº RGSEAA (para el DAT)'],['notas','Notas (horario, cuenta…)']];
// Las almazaras del cuaderno (AJ.clientes) salen de aquí, para no tener dos listas
function sincClientes(){ AJ.clientes=misAlm().map(a=>({nombre:a.nombre,nif:a.cif||'',direccion:[a.direccion,a.localidad].filter(Boolean).join(', '),rgseaa:a.rgseaa||''})); }
function unirClientes(){ const C=(AJ.clientes||[]).filter(c=>c&&c.nombre); if(!C.length) return false; let cambio=false; AJ.almazaras=[...(AJ.almazaras||[])];
  C.forEach(c=>{ const a=AJ.almazaras.find(x=>mismaAlm(x.nombre,c.nombre)); if(a){ if(!a.cif&&c.nif){ a.cif=c.nif; cambio=true; } if(!a.direccion&&c.direccion){ a.direccion=c.direccion; cambio=true; } if(!a.rgseaa&&c.rgseaa){ a.rgseaa=c.rgseaa; cambio=true; } }
    else { AJ.almazaras.push({nombre:c.nombre,tipo:'puesto',cif:c.nif||'',direccion:c.direccion||'',rgseaa:c.rgseaa||''}); cambio=true; } }); return cambio; }
// Al leer una liquidación o un ticket: guarda el CIF de la almazara si no lo tenías
async function aprenderAlm(nombre,cif){ nombre=(nombre||'').trim(); cif=(cif||'').trim().toUpperCase(); if(!nombre) return;
  AJ.almazaras=[...(AJ.almazaras||[])]; let a=AJ.almazaras.find(x=>x.nombre&&mismaAlm(x.nombre,nombre));
  if(!a){ if(AJ.almazaras.length>=8) return; a={nombre,tipo:/coop|\bs\.?\s?c\.?\s?a\b|sca\b/i.test(nombre)?'coop':'puesto',defecto:!AJ.almazaras.length}; AJ.almazaras.push(a); }
  else if(!cif||a.cif) return;
  if(cif) a.cif=cif; sincClientes(); await guardarAjustes(true); }
function telLimpio(t){ return String(t||'').replace(/[^+\d]/g,''); }
function almDefecto(){ const l=misAlm(); return (l.find(a=>a.defecto)||l[0]||{}).nombre||''; }

// ===== Escanear tickets de entrega (uno o varios a la vez) =====
function escanearTickets(){
  if(!navigator.onLine){ toast('Para leer tickets necesitas cobertura'); return; }
  if($('#dlg').open) $('#dlg').close();
  const i=document.createElement('input'); i.type='file'; i.accept='image/*,application/pdf'; i.multiple=true;
  i.onchange=()=>{ if(i.files.length) leerTickets([...i.files].slice(0,12)); }; i.click();

async function leerTickets(files){
  $('#frm').oninput=null; $('#frm').onchange=null; $('#frm').onsubmit=e=>e.preventDefault();
  const pinta=(k)=>$('#frm').innerHTML=`<h3>Leyendo ${files.length>1?`tickets (${k} de ${files.length})`:'el ticket'}…</h3><p class="mut">Unos segundos por ticket.</p><div class="bar"><i style="width:100%;animation:none"></i></div>`;
  pinta(1); $('#dlg').showModal();
  const ent=[], fallos=[]; let alm='';
  for(let k=0;k<files.length;k++){ pinta(k+1);
    try{ const {blob,mime}=await prepararArchivo(files[k]); const data=await aB64(blob);
      const {data:res,error}=await sb.functions.invoke('leer-factura',{body:{data,mime,tipo:'liquidacion'}});
      if(error||!res?.datos) throw new Error(res?.error||error?.message||'no se pudo leer');
      const d=res.datos; if(!alm&&d.almazara) alm=d.almazara;

const normEnt=e=>({...e, fechaLeida:e.fecha, fecha:fechaIA(e.fecha), kilos:numIA(e.kilos), rendimiento_pct:numIA(e.rendimiento_pct), kilos_brutos:numIA(e.kilos_brutos), tara:numIA(e.tara), humedad_pct:numIA(e.humedad_pct), acidez:numIA(e.acidez)});
