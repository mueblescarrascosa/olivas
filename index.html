  const m=g.maquina_id&&D.maquinas.find(x=>x.id===g.maquina_id); if(m) return m.combustible||(m.tipo==='Tractor'?'B':'A');
  const txt=[g.concepto,g.proveedor,g.notas,...D.factura_lineas.filter(l=>g.factura_id&&l.factura_id===g.factura_id).map(l=>`${l.producto} ${l.nombre_comun}`)].join(' ');
  if(/gas[oó]leo\s*b\b|gasoil\s*b\b|agr[ií]cola|bonificado/i.test(txt)) return 'B'; if(/gasolina|sin plomo|\b95\b|\b98\b/i.test(txt)) return '95'; return 'A'; }
function vjDe(dpId){ return D.viajes.filter(v=>v.dia_perdido_id===dpId).reduce((a,v)=>a+(Number(v.coste)||0),0); }
function vehiculosViaje(){ return D.maquinas.filter(m=>m.activa&&esVehiculo(m)&&m.tipo!=='Remolque'); }
function vehViaje(id){ const l=vehiculosViaje(); return l.find(m=>m.id===id)||l.find(m=>m.id===AJ.veh_viaje)||l.find(m=>m.consumo_l100)||l[0]; }
function kmFinca(f){ if(!f) return null; if(f.km_ida) return {km:Number(f.km_ida),aprox:false};
  const c=AJ.casa; if(c&&f.lat!=null) return {km:Math.round(km(c.lat,c.lon,Number(f.lat),Number(f.lon))*1.3*10)/10,aprox:true}; return null; }
async function costeViaje(fid, vehId){
  const f=D.fincas.find(x=>x.id===fid), v=vehViaje(vehId); let K=kmFinca(f); if(!v) return null; if(!K){ if(v.tipo==='Tractor'&&f) K={km:0,aprox:true}; else return null; }
  const cons=Number(v.consumo_l100)||null; if(!cons) return {v,km:K.km*2,aprox:K.aprox,falta:'consumo'};
  const tipo=v.combustible||(v.tipo==='Tractor'?'B':'A'); let precio=null, est=null;
  try{ const g=await gasolineraFav(); if(g){ precio=Number(g[COMB[tipo][1]])||null; est=g.rotulo; } }catch(e){}
  const kmT=K.km*2, litros=Math.round(kmT*cons/100*100)/100;
  return {v,km:kmT,aprox:K.aprox,litros,precio,est,tipo,coste:precio?Math.round(litros*precio*100)/100:null};
}
function textoViaje(c){ if(!c) return '<span class="mut">Pon los km hasta la finca (Más → Ajustes → Viajes) para calcularlo.</span>';
  if(c.falta==='consumo') return c.v.tipo==='Tractor'?`${esc(c.v.nombre)}: se apunta el día de trabajo en esta finca (para repartir su gasóleo B).`:`<span class="mut">${num(c.km,1)} km · falta el consumo de ${esc(c.v.nombre)} (Más → Ajustes → Viajes).</span>`;

// Varios días y vehículos de golpe: el coste se calcula una vez por vehículo y se guarda todo en una sola llamada
async function apuntarViajes(fid, fechas, vehIds, motivo){
  if(!fid) return {t:0}; const filas=[]; let t=0;
  const cs=await Promise.all(vehIds.map(v=>costeViaje(fid,v)));
  cs.forEach(c=>{ if(!c||(c.falta&&c.v.tipo!=='Tractor')) return; fechas.forEach(fecha=>{ if(D.viajes.some(x=>x.fecha===fecha&&x.finca_id===fid&&x.vehiculo_id===c.v.id)) return;
    filas.push({fecha, finca_id:fid, vehiculo_id:c.v.id, km:c.km, litros:c.litros??null, precio_l:c.precio??null, coste:c.coste??null, motivo, dia_perdido_id:null}); if(c.coste!=null) t+=c.coste; }); });
  if(!filas.length) return {t:0}; const r=await insertar('viajes',filas); return r.ok?{t}:{t:0}; }
async function apuntarViaje(fid, fecha, vehId, motivo, dpId){
  if(!fid) return null; const c=await costeViaje(fid, vehId); if(!c) return null; if(c.falta&&c.v.tipo!=='Tractor') return null;
  if(!dpId && D.viajes.some(x=>x.fecha===fecha&&x.finca_id===fid&&x.vehiculo_id===c.v.id)) return null; // ya hay viaje ese día
  const r=await insertar('viajes',{fecha, finca_id:fid, vehiculo_id:c.v.id, km:c.km, litros:c.litros??null, precio_l:c.precio??null, coste:c.coste??null, motivo, dia_perdido_id:dpId||null});
  return r.ok?c:null;
}

// --- Km por carretera hasta cada finca (OSRM) y ubicación de casa (Nominatim / GPS)
async function kmCarretera(a,b){
  const r=await fetch(`https://router.project-osrm.org/route/v1/driving/${a.lon},${a.lat};${b.lon},${b.lat}?overview=false`);
  const j=await r.json(); if(j.code!=='Ok'||!j.routes?.[0]) throw new Error('sin ruta'); return Math.round(j.routes[0].distance/100)/10;
}
async function calcularKmFincas(soloVacias=false){
  const c=AJ.casa; if(!c){ toast('Primero dime dónde está tu casa'); return; }
  const fs=D.fincas.filter(f=>f.activa&&f.lat!=null&&f.lon!=null&&(!soloVacias||f.km_ida==null)); if(!fs.length){ toast('No hay fincas con ubicación'); return; }
  toast(`Calculando km de ${fs.length} ${fs.length===1?'finca':'fincas'}…`); let ok=0, aprox=0;
  for(const f of fs){ let k; try{ k=await kmCarretera(c,{lat:Number(f.lat),lon:Number(f.lon)}); ok++; }catch(e){ k=Math.round(km(c.lat,c.lon,Number(f.lat),Number(f.lon))*1.3*10)/10; aprox++; }
    await sb.from('olv_fincas').update({km_ida:k}).eq('id',f.id); }
  await cargar('fincas'); render(); toast(`Km calculados por carretera${aprox?` (${aprox} estimadas en línea recta)`:''}`);
}
async function casaPorNombre(txt){
  if(!txt) return; try{ const r=await fetch(`https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=es&q=${encodeURIComponent(txt)}`,{headers:{'Accept-Language':'es'}}); const j=await r.json();
    if(!j[0]) { toast('No encuentro ese sitio'); return; } AJ.casa={lat:+j[0].lat,lon:+j[0].lon,nombre:txt}; await guardarAjustes(true); await calcularKmFincas(); }catch(e){ toast('No se pudo buscar (¿sin cobertura?)'); } }
function casaGPS(){ if(!navigator.geolocation){ toast('Sin GPS'); return; } navigator.geolocation.getCurrentPosition(async p=>{ AJ.casa={lat:p.coords.latitude,lon:p.coords.longitude,nombre:'mi ubicación'}; await guardarAjustes(true); await calcularKmFincas(); },()=>toast('No se pudo obtener la ubicación')); }

// ===== Cronómetro de la jornada =====
function crono(){ try{ return JSON.parse(localStorage.getItem('olv_crono')||'null'); }catch(e){ return null; } }
function guardarCrono(c){ try{ if(c) localStorage.setItem('olv_crono',JSON.stringify(c)); else localStorage.removeItem('olv_crono'); }catch(e){} pintarCrono(); }
function msPausas(c,ahora=Date.now()){ return (c.pausas||[]).reduce((a,[x,y])=>a+(y-x),0)+(c.enPausa?ahora-c.enPausa:0); }
function horasCrono(c,ahora=Date.now()){ const bruto=(ahora-c.ini)/36e5, pausa=msPausas(c,ahora)/36e5;
  const alm=(AJ.umb.almuerzo_min??30)/60, autoAlm=c.almuerzo&&!(c.pausas||[]).length&&!c.enPausa?alm:0; // solo si es jornada «con almuerzo» y no has marcado la parada
  return {bruto, pausa, autoAlm, neto:Math.max(0,bruto-pausa-autoAlm)}; }
function fDur(h){ const m=Math.round(h*60); return `${Math.floor(m/60)} h ${String(m%60).padStart(2,'0')} min`; }
function empezarCrono(){ guardarCrono({ini:Date.now(),pausas:[],enPausa:null,fecha:hoy(),almuerzo:ULT.crono_alm??false}); toast('Jornada en marcha'); render(); }
function almCrono(v){ const c=crono(); if(!c) return; c.almuerzo=v; recordar('crono_alm',v); guardarCrono(c); }
function pausaCrono(){ const c=crono(); if(!c) return; if(c.enPausa){ c.pausas.push([c.enPausa,Date.now()]); c.enPausa=null; toast('Seguimos'); } else { c.enPausa=Date.now(); toast('Parado: no cuenta hasta que pulses «Seguir»'); } guardarCrono(c); }
function terminarCrono(){ const c=crono(); if(!c) return; if(c.enPausa){ c.pausas.push([c.enPausa,Date.now()]); c.enPausa=null; }
  const H=horasCrono(c), horas=Math.round(H.neto*4)/4; // a cuartos de hora
  guardarCrono(null);
  abrirParte({horas, fecha:c.fecha, nota:`De ${new Date(c.ini).toTimeString().slice(0,5)} a ${new Date().toTimeString().slice(0,5)}${H.pausa?` · parado ${fDur(H.pausa)}`:''}${H.autoAlm?` · descontada ${Math.round(H.autoAlm*60)} min de almuerzo`:''}`});
}
function anularCrono(){ if(confirm('¿Borrar el cronómetro de hoy sin apuntar nada?')) { guardarCrono(null); render(); } }
function pintarCrono(){
  let bar=$('#cronoBar'); const c=crono();
  if(!c){ if(bar) bar.remove(); return; }
  if(!bar){ bar=document.createElement('div'); bar.id='cronoBar'; bar.className='crono'; $('#view').before(bar); }
  const H=horasCrono(c);
  const m=AJ.umb.almuerzo_min??30;
  bar.innerHTML=`<span class="cr-t">${c.enPausa?'☕ Almuerzo':'⏱ Trabajando'} <b>${fDur(H.bruto-H.pausa)}</b>${c.fecha!==hoy()?' <span class="neg">(empezó otro día)</span>':''}
    <span style="display:block;font-size:12px;opacity:.9">${(c.pausas||[]).length||c.enPausa?`Paradas: ${fDur(H.pausa)} (se descuentan)`:`<a href="#" style="color:#fff" onclick="event.preventDefault();almCrono(${!c.almuerzo})">${c.almuerzo?`Con almuerzo: se quitan ${m} min · cambiar a del tirón`:'Del tirón: no se quita nada · cambiar a con almuerzo'}</a>`}</span></span>
    <span class="row" style="gap:6px;flex-wrap:nowrap"><button class="btn sec sm" onclick="pausaCrono()">${c.enPausa?'Seguir':'Parar'}</button><button class="btn sm" onclick="terminarCrono()">Terminar</button><button class="btn sec sm" title="Anular" onclick="anularCrono()">✕</button></span>`;
}
setInterval(()=>{ if(crono()) pintarCrono(); }, 30000);

  const tE=l.reduce((a,x)=>a+x.est,0), tR=l.reduce((a,x)=>a+x.real,0);
  return `<div class="card"><h2>Cosecha esperada · ${esc(CAMP)}<span class="sp"></span><button class="btn sec sm" onclick="abrirAforo()">Nuevo aforo</button></h2><table><tr><th>Finca</th><th class="n">Esperado</th><th class="n">Entregado</th><th class="n">Falta</th></tr>${l.map(x=>`<tr class="click" onclick="verCompensa('${x.f.id}')"><td>${esc(x.f.nombre)}${ver(x)}</td><td class="n">${num(x.est)}</td><td class="n">${num(x.real)}</td><td class="n">${x.est>x.real?num(x.est-x.real):'<span class="pos">hecho</span>'}</td></tr>`).join('')}<tr><td><b>Total</b></td><td class="n"><b>${num(tE)}</b></td><td class="n"><b>${num(tR)}</b></td><td class="n"><b>${tE>tR?num(tE-tR):''}</b></td></tr></table><p class="mut">El esperado sale de tu aforo: es tan bueno como los olivos que mires. Toca una finca para ver si compensa recogerla.</p>${htmlRecogCuentas()}</div>`; }
function verCompensa(fid){ const f=D.fincas.find(x=>x.id===fid), a=muestras('aforo',fid).pop(); if(!f||!a) return;
  $('#frm').oninput=null; $('#frm').onchange=null; $('#frm').onsubmit=e=>{ e.preventDefault(); $('#dlg').close(); };
  $('#frm').innerHTML=`<h3>${esc(f.nombre)}: ¿compensa recoger?</h3><p class="mut">Aforo del ${fFecha(a.fecha)}: ${num(a.valor,1)} kg/olivo${a.datos?.suelo?` · suelo ${num(a.datos.suelo,1)} kg`:''}.</p>${htmlCompensa(f,Number(a.valor),Number(a.datos?.suelo)||0)}<div class="row acciones" style="justify-content:flex-end"><button class="btn">Cerrar</button></div>`;
  $('#dlg').showModal(); }
function avisosMuestras(h){
  const out=[], md=h.slice(5), fs=D.fincas.filter(f=>f.activa);
  // otoño: madurez y rendimiento
  if(md>='10-15'&&md<='12-31'&&fs.length){
    const sin=fs.filter(f=>!(cosecha(CAMP).porF[f.id]?.kilos>0)).filter(f=>{ const u=[ultMuestra('madurez',f.id),ultMuestra('rendimiento',f.id)].filter(Boolean).map(m=>m.fecha).sort().pop(); return !u||difDias(u,h)>10; });
    if(sin.length) out.push({c:'',t:`Época de ver cuándo empezar: mira la madurez o pide muestra de rendimiento en <b>${sin.map(f=>esc(f.nombre)).join(', ')}</b>`,ord:25,fn:"SUB.campo='muestras';ir('campo')"});
    fs.forEach(f=>{ const u=ultMuestra('madurez',f.id); if(u&&difDias(u.fecha,h)<=14&&Number(u.valor)>=3&&Number(u.valor)<=4.2) out.push({c:'',t:`<b>${esc(f.nombre)}</b>: índice de madurez ${num(u.valor,2)}, en el punto o casi (≈3,5)`,ord:24,fn:"SUB.campo='muestras';ir('campo')"});
      const er=estadoRend(f.id); if(er&&er.para) out.push({c:'',t:`<b>${esc(f.nombre)}</b>: el rendimiento ha dejado de subir. Ya no gana aceite esperando`,ord:24,fn:"SUB.campo='muestras';ir('campo')"}); });
  }
  // análisis: suelo cada N años (septiembre-octubre), foliar en julio
  if(fs.length){ const mes=+h.slice(5,7), anos=AJ.suelo_anos||5;
    if([9,10].includes(mes)){ const toca=fs.filter(f=>{ const u=ultMuestra('suelo',f.id); return !u||difDias(u.fecha,h)>anos*365-60; });
      if(toca.length) out.push({c:'',t:`Toca <b>análisis de suelo</b> en ${toca.map(f=>{ const u=ultMuestra('suelo',f.id); return `${esc(f.nombre)}${u?` (el último en ${u.fecha.slice(0,4)})`:' (nunca)'}`; }).join(', ')}. Se hace cada ${anos} años; ahora es buen momento, a más de 6 meses del abonado de invierno`,ord:30,fn:"abrirAnalisis('suelo')"}); }
    if((mes===6&&h.slice(8)>='20')||mes===7){ const sin=fs.filter(f=>{ const u=ultMuestra('foliar',f.id); return !u||u.fecha<`${h.slice(0,4)}-06-01`; }); if(sin.length) out.push({c:'',t:`En julio toca coger hojas para el <b>análisis foliar</b> (${sin.map(f=>esc(f.nombre)).join(', ')}). Pide el sobre al laboratorio`,ord:30,fn:"abrirAnalisis('foliar')"}); } }
  // verano y otoño: mosca (trampas)
  const mM=+h.slice(5,7);
  if(mM>=6&&mM<=11){ fs.forEach(f=>{ const u=ultMuestra('mosca',f.id); if(!u||difDias(u.fecha,h)>10) return; const e=estadoMosca(u);
      if(e.c==='bad') out.push({c:'bad',t:`<b>${esc(f.nombre)}</b>: mosca del olivo, ${esc(e.t)}. Habla con tu técnico`,ord:5,fn:"SUB.campo='muestras';ir('campo')"});
      else if(e.c==='') out.push({c:'',t:`<b>${esc(f.nombre)}</b>: mosca, ${esc(e.t)}`,ord:21,fn:"SUB.campo='muestras';ir('campo')"}); });
    const tr=trampasRevisar(); if(tr&&tr<=h){ const u=[...D.muestras].filter(m=>m.tipo==='mosca').sort((a,b)=>b.fecha.localeCompare(a.fecha))[0]; out.push({c:'',t:`Toca revisar las <b>trampas de mosca</b> (la última vez, hace ${difDias(u.fecha,h)} días)`,ord:23,fn:'abrirTrampa()'}); } }
  // primavera: algodoncillo
  if(md>='04-01'&&md<='05-31'){ const al=fs.filter(f=>f.algodoncillo); const ya=al.filter(f=>{ const u=ultMuestra('algodoncillo',f.id); return u&&difDias(u.fecha,h)<=7; });
    if(al.length&&ya.length<al.length) out.push({c:'',t:`Floración: muestrea el <b>algodoncillo</b> en ${al.filter(f=>!ya.includes(f)).map(f=>esc(f.nombre)).join(', ')} (10 olivos × 10 racimos)`,ord:22,fn:'abrirAlgodoncillo()'});
    al.forEach(f=>{ const u=ultMuestra('algodoncillo',f.id); if(u&&u.datos?.supera&&difDias(u.fecha,h)<=10) out.push({c:'bad',t:`<b>${esc(f.nombre)}</b>: el algodoncillo supera el umbral (${u.valor!=null?num(u.valor,2)+' ninfas/racimo':u.datos.pct_algodon+' %'}). Habla con tu técnico`,ord:5,fn:"SUB.campo='muestras';ir('campo')"}); }); }
  return out;
}


// ===== Coste por kilo por partida, campaña a campaña =====
function htmlCosteKiloPartidas(){
  const camps=[...new Set([...D.pesadas.map(p=>campDe(p.fecha)),...D.ingresos.map(i=>i.campana)])].filter(Boolean).sort().slice(-4);
  const datos=camps.map(c=>{ const C=calcular(c), K=cosecha(c), kg=K.tot||C.kilos; return {c,kg,cat:C.porCat,tot:C.totG}; }).filter(x=>x.kg>0);
  if(datos.length<2) return `<div class="card"><h2>Coste por kilo, año a año</h2><p class="mut">Cuando tengas apuntadas dos campañas con kilos, aquí verás cuánto te cuesta cada kilo de aceituna en cada partida (jornales, gasoil, abonos…) y en qué ha subido o bajado.</p></div>`;
  const cats=[...new Set(datos.flatMap(d=>Object.keys(d.cat)))].map(k=>({k,v:datos.map(d=>(d.cat[k]||0)/d.kg)})).sort((a,b)=>b.v[b.v.length-1]-a.v[a.v.length-1]);
  const ult=datos.length-1, cambio=c=>{ const a=c.v[ult-1], b=c.v[ult]; return b-a; };
  const sube=[...cats].sort((a,b)=>cambio(b)-cambio(a))[0], baja=[...cats].sort((a,b)=>cambio(a)-cambio(b))[0];
  const f=v=>v?num(v,3):'—';
  return `<div class="card"><h2>Coste por kilo, año a año</h2><div class="scroll"><table><tr><th>€ por kg de aceituna</th>${datos.map(d=>`<th class="n">${esc(d.c)}</th>`).join('')}</tr>
    ${cats.map(c=>`<tr><td>${esc(c.k)}</td>${c.v.map((v,i)=>`<td class="n ${i===ult&&i>0&&c.v[i-1]?(v>c.v[i-1]*1.1?'neg':v<c.v[i-1]*0.9?'pos':''):''}">${f(v)}</td>`).join('')}</tr>`).join('')}
    <tr><td><b>Total</b></td>${datos.map(d=>`<td class="n"><b>${f(d.tot/d.kg)}</b></td>`).join('')}</tr>
    <tr><td class="mut">Kilos</td>${datos.map(d=>`<td class="n mut">${num(d.kg)}</td>`).join('')}</tr></table></div>
    <p class="mut">${sube&&cambio(sube)>0.001?`Lo que más ha subido por kilo: <b>${esc(sube.k)}</b> (+${num(cambio(sube),3)} €/kg). `:''}${baja&&cambio(baja)<-0.001?`Lo que más ha bajado: <b>${esc(baja.k)}</b> (${num(cambio(baja),3)} €/kg). `:''}En rojo lo que sube más de un 10 % respecto a la campaña anterior. Ojo: en un año de poca cosecha todo sale más caro por kilo aunque gastes lo mismo.</p></div>`;
}

// ===== Exportar =====
function bajar(nombre, contenido, tipo){ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([contenido],{type:tipo})); a.download=nombre; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1000); }
function csv(k){
  const [ini,fin]=campRango(CAMP); const sep=';'; const q=v=>`"${String(v??'').replace(/"/g,'""')}"`; const n=v=>v==null?'':String(v).replace('.',',');
  let rows;
  if(k==='gastos') rows=[['Fecha','Categoría','Concepto','Finca','Máquina','Proveedor','Importe','Notas'], ...D.gastos.filter(g=>g.fecha>=ini&&g.fecha<=fin).map(g=>[g.fecha,g.categoria,g.concepto,fincaNom(g.finca_id),maqNom(g.maquina_id),g.proveedor,n(g.importe),g.notas])];
  else if(k==='ingresos') rows=[['Fecha','Campaña','Tipo','Finca','Kilos','Rendimiento %','Precio €/kg','Importe','Notas'], ...D.ingresos.filter(i=>i.campana===CAMP).map(i=>[i.fecha,i.campana,i.tipo,fincaNom(i.finca_id),n(i.kilos),n(i.rendimiento),n(i.precio_kg),n(i.importe),i.notas])];
  else if(k==='jornales') rows=[['Fecha','Trabajador','Empresa','Finca','Faena','Horas','Kilos','Importe','Pagado','Fecha pago','No cobra'], ...D.jornales.filter(j=>j.fecha>=ini&&j.fecha<=fin).map(j=>[j.fecha,trabNom(j.trabajador_id),j.empresa_id?empNom(j.empresa_id):'',fincaNom(j.finca_id),j.tarea,n(j.horas),n(j.kilos),n(j.importe),j.sin_cobro?'':j.pagado?'sí':'no',j.pagado_fecha,j.sin_cobro?'sí':'']), ...D.servicios.filter(x=>x.fecha>=ini&&x.fecha<=fin).map(x=>[x.fecha,x.trabajador_id?trabNom(x.trabajador_id):'',x.empresa_id?empNom(x.empresa_id):'',fincaNom(x.finca_id),x.concepto||'Kilos a destajo','',n(x.kilos),n(x.importe),x.pagado?'sí':'no',x.pagado_fecha,''])];
  else rows=[['Fecha','Finca','Producto','Nº registro','Dosis','Cantidad total','Unidad','Caldo total (l)','Equipo','Plaga/motivo','Superficie ha','Aplicador','Plazo seguridad días','Notas'], ...D.tratamientos.filter(t=>t.fecha>=ini&&t.fecha<=fin).map(t=>{ const a=D.aplicaciones.find(x=>x.id===t.aplicacion_id)||{}; return [t.fecha,fincaNom(t.finca_id),t.producto,t.num_registro,t.dosis,n(t.cantidad),t.unidad,n(a.litros_total),a.maquina_id?maqNom(a.maquina_id):'',t.motivo,n(t.superficie_ha),t.aplicador,t.plazo_seguridad_dias,t.notas]; })];
  bajar(`olivas_${k}_${CAMP.replace('/','-')}.csv`, '﻿'+rows.map(r=>r.map(q).join(sep)).join('\r\n'), 'text/csv;charset=utf-8');
}
function nuevaLabor(){
  $('#frm').oninput=null; $('#frm').onchange=null;
  $('#frm').innerHTML=`<h3>Labor propia</h3><label>Qué hay que hacer<input name="nombre" autocomplete="off"></label>
    <span class="clab">Meses en que toca</span><div class="chips" id="lMes">${MESES.slice(1).map((m,i)=>`<button type="button" class="chip" data-m="${i+1}">${m}</button>`).join('')}</div>
    <span class="clab">Tiempo</span><div class="chips" data-chips="tipo"><button type="button" class="chip on" data-val="">Da igual</button><button type="button" class="chip" data-val="olivo">Olivo seco</button><button type="button" class="chip" data-val="spray">Para curar</button></div><input type="hidden" name="tipo" value="">
    <div class="row acciones" style="justify-content:flex-end"><button type="button" class="btn sec" id="fCancel">Cancelar</button><button class="btn" id="fOk">Guardar</button></div>`;
  activarChips($('#frm')); $('#fCancel').onclick=()=>$('#dlg').close();
  document.querySelectorAll('#lMes .chip').forEach(b=>b.onclick=()=>b.classList.toggle('on'));
  $('#frm').onsubmit=async e=>{ e.preventDefault();
    const nombre=$('#frm [name=nombre]').value.trim(), meses=[...document.querySelectorAll('#lMes .chip.on')].map(b=>+b.dataset.m);
    if(!nombre||!meses.length){ toast('Pon qué hay que hacer y algún mes'); return; }
    AJ.labores_propias=[...(AJ.labores_propias||[]),{id:'p_'+Date.now(),nombre,meses,tipo:$('#frm [name=tipo]').value||undefined}];
    $('#dlg').close(); await guardarAjustes(); render(); };
  $('#dlg').showModal(); if(!TACTIL) setTimeout(()=>$('#frm [name=nombre]').focus(),50);
}
async function borrarLabor(id){ AJ.labores_propias=(AJ.labores_propias||[]).filter(x=>x.id!==id); await guardarAjustes(); render(); }
function copia(){ AJ.ult_copia=hoy(); bajar(`olivas_copia_${hoy()}.json`, JSON.stringify({version:1, fecha:new Date().toISOString(), ajustes:AJ, datos:D}, null, 1), 'application/json'); guardarAjustes(); }
function ics(){
  const ev=[]; const f=s=>s.replace(/-/g,''); const e=s=>String(s).replace(/[\\;,]/g,m=>'\\'+m).replace(/\n/g,'\\n');
  const add=(uid,fecha,tit,alarmDias)=>ev.push(`BEGIN:VEVENT\r\nUID:${uid}@olivas\r\nDTSTAMP:${new Date().toISOString().replace(/[-:]/g,'').slice(0,15)}Z\r\nDTSTART;VALUE=DATE:${f(fecha)}\r\nDTEND;VALUE=DATE:${f(addDias(fecha,1))}\r\nSUMMARY:${e(tit)}\r\nBEGIN:VALARM\r\nACTION:DISPLAY\r\nDESCRIPTION:${e(tit)}\r\nTRIGGER:-P${alarmDias-1}DT15H\r\nEND:VALARM\r\nEND:VEVENT`);
  D.tareas.filter(t=>!t.hecha&&t.fecha>=hoy()).forEach(t=>add('t'+t.id,t.fecha,`Olivas: ${t.titulo}${t.finca_id?' ('+fincaNom(t.finca_id)+')':''}`,1));
  D.maquinas.filter(m=>m.activa).forEach(m=>{ if(m.itv_proxima>=hoy()) add('i'+m.id,m.itv_proxima,`ITV ${m.nombre}`,14); if(m.seguro_vence>=hoy()) add('s'+m.id,m.seguro_vence,`Seguro ${m.nombre}`,14); });
  D.reuniones.filter(r=>!r.hecha&&r.fecha>=hoy()).forEach(r=>add('r'+r.id,r.fecha,`${r.hora?r.hora+' ':''}${r.titulo}${r.lugar?' · '+r.lugar:''}`,1));
  const y=+hoy().slice(0,4); plazos().forEach(p=>{ [y,y+1].forEach(a=>{ const {ini,fin}=plazoAnio(p,a); if(fin>=hoy()&&!plazoHecho(p,a)){ if(ini>=hoy()) add('pi'+p.id+a,ini,`Se abre: ${p.nombre}`,1); add('pf'+p.id+a,fin,`Último día: ${p.nombre}`,15); } }); });
  carnes().forEach(c=>{ if(c.cad&&c.cad>=hoy()) add('c'+(c.id||'tit'),c.cad,`Caduca el carné de fitosanitarios de ${c.nombre}`,90); });
  if(!ev.length){ toast('No hay nada pendiente que exportar'); return; }
  bajar('olivas_avisos.ics',`BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//Olivas//ES\r\n${ev.join('\r\n')}\r\nEND:VCALENDAR\r\n`,'text/calendar');
}

$('#navCred').innerHTML = `Olivas v${VERSION} · ${VERSION_FECHA}<br>© 2026 Alfonso Carrascosa Martínez<br>Hecha con Claude (Anthropic)`;
// Tocar fuera del formulario (en lo oscuro) lo cierra, salvo mientras guarda; si hay algo escrito, pregunta antes
let DLG_DOWN=false; const fueraDlg=e=>{ const r=$('#dlg').getBoundingClientRect(); return e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom; };
$('#dlg').addEventListener('pointerdown', e=>{ DLG_DOWN=e.target===$('#dlg')&&fueraDlg(e); });
$('#dlg').addEventListener('click', e=>{ const fuera=DLG_DOWN&&e.target===$('#dlg')&&fueraDlg(e); DLG_DOWN=false; if(fuera && !$('#fOk')?.disabled && salirSinGuardar()) $('#dlg').close(); });
arranque();
