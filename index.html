<style>
:root{--bg:#f6f5ef;--card:#fff;--ink:#22261c;--mut:#6b7060;--line:#e2e0d4;--olv:#4b5d2a;--olv2:#6f8a3c;--ok:#2f8a3e;--warn:#c58a0b;--bad:#c0392b;--sh:0 1px 3px rgba(0,0,0,.08)}
@media (prefers-color-scheme:dark){:root{--bg:#171a13;--card:#21251b;--ink:#ecebe3;--mut:#a3a796;--line:#353a2c;--olv:#9bb55f;--olv2:#b5cc7c;--sh:none}}
*{box-sizing:border-box}
body{margin:0;font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:80px}
header{position:sticky;top:0;z-index:5;background:var(--olv);color:#fff;padding:10px 16px;display:flex;align-items:center;gap:10px}
@media (prefers-color-scheme:dark){header{color:#171a13}}
header h1{font-size:18px;margin:0;flex:1}
header select{background:transparent;color:inherit;border:1px solid currentColor;border-radius:6px;padding:4px 6px;font:inherit;width:auto}
header select option{color:#000}
main{max-width:900px;margin:0 auto;padding:12px 16px}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;z-index:6;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;color:var(--mut);padding:10px 2px;font:12px system-ui;cursor:pointer}
nav button.on{color:var(--olv);font-weight:700;box-shadow:inset 0 3px 0 var(--olv)}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:0 0 12px;box-shadow:var(--sh)}
.card h2{font-size:16px;margin:0 0 8px;display:flex;align-items:center;gap:8px}
.card h2 .sp{flex:1}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-bottom:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.kpi b{display:block;font-size:20px}
.kpi span{color:var(--mut);font-size:12px}
.pos{color:var(--ok)}.neg{color:var(--bad)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--mut);font-weight:600;font-size:12px}
td.n,th.n{text-align:right;white-space:nowrap}
tr.click{cursor:pointer}tr.click:hover{background:rgba(127,127,100,.08)}
.scroll{overflow-x:auto}
.btn{border:1px solid var(--olv);background:var(--olv);color:#fff;border-radius:8px;padding:8px 12px;font:inherit;cursor:pointer}
@media (prefers-color-scheme:dark){.btn{color:#171a13}}
.btn.sec{background:transparent;color:var(--olv)}
.btn.del{background:transparent;color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:4px 8px;font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.mut{color:var(--mut);font-size:13px}
.tag{display:inline-block;padding:1px 7px;border-radius:10px;font-size:12px;background:var(--line);color:var(--ink)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:middle}
.g{background:var(--ok)}.a{background:var(--warn)}.r{background:var(--bad)}
.aviso{padding:8px 10px;border-left:4px solid var(--warn);background:rgba(197,138,11,.08);border-radius:6px;margin-bottom:6px}
.aviso.bad{border-color:var(--bad);background:rgba(192,57,43,.08)}
.aviso.ok{border-color:var(--ok);background:rgba(47,138,62,.08)}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:8px;width:100%}
label{display:block;margin-bottom:10px;font-size:13px;color:var(--mut)}
label>input,label>select,label>textarea{margin-top:3px}
label.chk{display:flex;gap:8px;align-items:center}label.chk input{width:auto}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
dialog{border:0;border-radius:12px;padding:0;width:min(560px,94vw);max-height:92vh;overflow:auto;background:var(--card);color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog form{padding:16px 16px 0}
.acciones{position:sticky;bottom:0;background:var(--card);margin:6px -16px 0;padding:10px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);z-index:2}
dialog h3{margin:0 0 12px}
.creditos{font-size:12px;color:var(--mut);text-align:center;margin:18px 0 6px;line-height:1.5}
#navCred{display:none}
.fab{position:fixed;right:16px;bottom:76px;width:54px;height:54px;border-radius:50%;font-size:28px;line-height:1;z-index:7;box-shadow:0 3px 10px rgba(0,0,0,.25)}
#login{max-width:360px;margin:12vh auto;padding:0 16px}
.hidden{display:none!important}
.bar{min-width:60px;height:8px;background:var(--line);border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--olv2)}
.tabs2{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.tabs2 button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:16px;padding:5px 12px;font:inherit;font-size:13px;cursor:pointer}
.tabs2 button.on{background:var(--olv);color:#fff;border-color:var(--olv)}
@media (max-width:420px){th,td{padding:6px 3px;font-size:13px}main{padding:10px 10px}}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 12px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:18px;padding:8px 13px;font:inherit;font-size:14px;cursor:pointer;min-height:38px}
.chips.scrollx{flex-wrap:nowrap;overflow-x:auto;margin:0 0 8px;padding-bottom:2px;scrollbar-width:none}.chips.scrollx::-webkit-scrollbar{display:none}.chips.scrollx .chip{flex:none;min-height:34px;padding:6px 12px}
.chip.on{background:var(--olv);border-color:var(--olv);color:#fff;font-weight:600}
@media (prefers-color-scheme:dark){.chip.on{color:#171a13}}
.clab{font-size:13px;color:var(--mut);display:block}
.big{font-size:26px!important;font-weight:700;padding:10px!important}
details.adv{margin:4px 0 10px}details.adv summary{cursor:pointer;color:var(--olv);font-size:14px;margin-bottom:8px}
.quick{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:12px}
.quick button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:12px 2px;font:inherit;font-size:13px;font-weight:600;cursor:pointer}
.quick button b{display:block;font-size:22px;color:var(--olv);line-height:1}
.grp{font-size:13px;color:var(--mut);font-weight:600;margin:12px 0 4px}
/* ===== Ordenador ===== */
@media (min-width:1000px){
  body{padding-bottom:0}
  header{padding:12px 24px;height:56px}
  header h1{flex:none;width:186px;font-size:19px}
  nav{top:56px;bottom:0;right:auto;width:210px;flex-direction:column;justify-content:flex-start;gap:2px;padding:14px 12px;border-top:0;border-right:1px solid var(--line)}
  nav button{flex:none;text-align:left;padding:11px 14px;font-size:15px;border-radius:8px;color:var(--ink)}
  nav button:hover{background:rgba(127,127,100,.1)}
  nav button.on{box-shadow:none;background:rgba(111,138,60,.16);color:var(--olv)}
  main{margin-left:210px;max-width:1240px;padding:24px 32px}
  .cols2{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px;align-items:start;margin-bottom:16px}
  .cols2>.card,.cols2>.kpis{margin:0}
  .kpis{grid-template-columns:repeat(2,1fr)}
  .kpi{padding:14px 16px}.kpi b{font-size:24px}
  .quick{grid-template-columns:repeat(5,minmax(0,170px));margin-bottom:16px}
  .quick button{display:flex;align-items:center;gap:8px;justify-content:center;padding:12px 10px;font-size:14px}
  .quick button b{display:inline;font-size:20px}
  .card{padding:16px 20px;margin-bottom:16px}
  .card h2{font-size:17px}
  th,td{padding:9px 10px}
  .fab{right:32px;bottom:32px}
  dialog{width:min(640px,90vw)}
  dialog form{padding:22px 24px 0}
  .acciones{margin:8px -24px 0;padding:12px 24px 16px}
  #toast{bottom:40px}
  #navCred{display:block;margin-top:auto;font-size:11px;color:var(--mut);padding:10px 6px;line-height:1.45}
}
@media (min-width:1000px) and (prefers-color-scheme:dark){ nav button.on{background:rgba(155,181,95,.16)} }
#toast .tdes{background:none;border:0;color:#c7d98f;font:inherit;font-weight:700;margin-left:10px;padding:4px 6px;cursor:pointer}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#222;color:#fff;padding:8px 14px;border-radius:8px;z-index:20;font-size:14px}
</style>
</head>

const $ = s => document.querySelector(s);

const eur = n => (Number(n)||0).toLocaleString('es-ES',{style:'currency',currency:'EUR',useGrouping:'always'});
const num = (n,d=0) => (Number(n)||0).toLocaleString('es-ES',{maximumFractionDigits:d,minimumFractionDigits:d,useGrouping:'always'});
function hoy(){ const d=new Date(); return iso(d); }
function iso(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function addDias(s,n){ const [y,m,d]=s.split('-').map(Number); return iso(new Date(y,m-1,d+n)); }
function difDias(a,b){ const p=s=>{const [y,m,d]=s.split('-').map(Number);return Date.UTC(y,m-1,d)}; return Math.round((p(b)-p(a))/864e5); }
function fFecha(s){ if(!s) return ''; const [y,m,d]=s.split('-'); return `${d}/${m}/${y.slice(2)}`; }
function campDe(s){ const [y,m]=s.split('-').map(Number); const a = m>=10 ? y : y-1; return `${a}/${String(a+1).slice(2)}`; }
function campRango(c){ const a=parseInt(c); return [`${a}-10-01`,`${a+1}-09-30`]; }
function fincaNom(id){ if(!id) return 'Común'; const f=D.fincas.find(x=>x.id===id); return f?f.nombre:'(borrada)'; }
function maqNom(id){ const m=D.maquinas.find(x=>x.id===id); return m?m.nombre:''; }
function toast(t, deshacer){
  const e=$('#toast'); e.textContent=t; e.classList.remove('hidden'); clearTimeout(toast._t);
  if(deshacer){ const b=document.createElement('button'); b.textContent='Deshacer'; b.className='tdes'; b.onclick=async()=>{ e.classList.add('hidden'); await deshacer(); }; e.append(' ',b); }
  toast._t=setTimeout(()=>e.classList.add('hidden'), deshacer?6000:2500);
}

// --- Sin cobertura: los apuntes nuevos se guardan en el móvil y se suben solos
const esRed = e => !navigator.onLine || /fetch|network|load failed|timeout/i.test(e?.message||'');
let COLA=[]; try{ COLA=JSON.parse(localStorage.getItem('olv_cola')||'[]'); }catch(e){}
function guardarCola(){ try{ localStorage.setItem('olv_cola',JSON.stringify(COLA)); }catch(e){} pintarCola(); }
function pintarCola(){ const n=COLA.reduce((a,i)=>a+i.filas.length,0); const b=$('#cola'); if(!b) return; b.textContent=n?`${n} sin subir`:''; b.classList.toggle('hidden',!n); }
function nuevoId(){ if(crypto.randomUUID) return crypto.randomUUID(); return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{const r=Math.random()*16|0;return (c==='x'?r:(r&3|8)).toString(16);}); }
async function insertar(tabla, filas){
  filas=[].concat(filas).map(f=>({id:nuevoId(),...f}));
  const {error}=await sb.from('olv_'+tabla).insert(filas);
  if(!error) return {ok:true,filas};
  if(esRed(error)){ COLA.push({tabla,filas}); guardarCola(); D[tabla]=[...filas,...D[tabla]]; return {ok:true,offline:true,filas}; }
  return {ok:false,error};
}
let subiendo=false;
async function vaciarCola(){
  if(subiendo || !COLA.length || !navigator.onLine) return;
  subiendo=true; let subidos=0;
  try{
    for(const item of COLA.slice()){
      const {error}=await sb.from('olv_'+item.tabla).insert(item.filas);
      if(error && error.code!=='23505'){ if(esRed(error)) break; toast('No se pudo subir un apunte: '+error.message); continue; }
      COLA.splice(COLA.indexOf(item),1); subidos+=item.filas.length; guardarCola();
    }
  } finally { subiendo=false; }
  if(subidos){ await cargarTodo(); render(); toast(`${subidos} ${subidos===1?'apunte subido':'apuntes subidos'}`); }
}
window.addEventListener('online', vaciarCola); setInterval(vaciarCola, 60000);
function sinRed(error){ if(esRed(error)){ toast('Sin cobertura: para editar o borrar necesitas conexión'); return true; } return false; }

async function cargar(k){
  const ord = {fincas:'nombre',maquinas:'nombre',gastos:'fecha',ingresos:'fecha',tratamientos:'fecha',tareas:'fecha',trabajadores:'nombre',jornales:'fecha',empresas:'nombre',servicios:'fecha',facturas:'fecha',factura_lineas:'created_at',dias_perdidos:'fecha',comunidades:'nombre',riego_pagos:'fecha'}[k];
  const asc = !['gastos','ingresos','tratamientos','jornales','servicios','facturas','dias_perdidos','riego_pagos'].includes(k);
  let todo=[], desde=0;
  for(;;){ // Supabase devuelve como mucho 1000 filas por consulta
    const {data,error} = await sb.from('olv_'+k).select('*').order(ord,{ascending:asc}).order('id').range(desde,desde+999);
    if(error){ if(!esRed(error)) toast('Error cargando '+k+': '+error.message); return error; }
    todo=todo.concat(data); if(data.length<1000) break; desde+=1000;
  }
  const pend=COLA.filter(i=>i.tabla===k).flatMap(i=>i.filas).filter(f=>!todo.some(r=>r.id===f.id));
  D[k]=[...pend,...todo];
}
async function cargarTodo(){
  const errs=(await Promise.all(Object.keys(D).map(cargar))).filter(Boolean);
  if(errs.some(esRed)){
    try{ const c=JSON.parse(localStorage.getItem('olv_cache')||'null'); if(c){ Object.keys(D).forEach(k=>{ if(c.D[k]) D[k]=[...COLA.filter(i=>i.tabla===k).flatMap(i=>i.filas),...c.D[k]]; }); AJ=c.AJ||AJ; } }catch(e){}
    toast('Sin cobertura: ves lo último guardado. Lo que apuntes se subirá solo.');
  } else {
    const {data} = await sb.from('olv_ajustes').select('datos').maybeSingle();
    if(data && data.datos){ AJ.cats = data.datos.cats?.length ? data.datos.cats : CATS_DEF.slice(); AJ.umb = {...UMB_DEF, ...(data.datos.umb||{})}; }
    try{ const sinPend={}; Object.keys(D).forEach(k=>sinPend[k]=D[k].filter(r=>!COLA.some(i=>i.filas.some(f=>f.id===r.id)))); localStorage.setItem('olv_cache',JSON.stringify({D:sinPend,AJ,t:Date.now()})); }catch(e){}
  }
  pintarCampanas(); pintarCola();
}
async function guardarAjustes(){
  const {data:{user}} = await sb.auth.getUser();
  const {error} = await sb.from('olv_ajustes').upsert({user_id:user.id, datos:AJ, updated_at:new Date().toISOString()});
  toast(error ? 'Error: '+error.message : 'Ajustes guardados');
}
function pintarCampanas(){
  const set = new Set([campDe(hoy())]);
  D.gastos.forEach(g=>set.add(campDe(g.fecha)));
  D.ingresos.forEach(i=>set.add(i.campana));
  D.jornales.forEach(j=>set.add(campDe(j.fecha)));
  D.servicios.forEach(j=>set.add(campDe(j.fecha)));
  const lista=[...set].sort().reverse();
  if(!lista.includes(CAMP)) CAMP=lista[0];
  $('#selCamp').innerHTML = lista.map(c=>`<option ${c===CAMP?'selected':''}>${c}</option>`).join('');
}

  return l.length?`<span class="clab">Repetir uno anterior</span><div class="chips">${l.map(t=>`<button type="button" class="chip" data-rtrat="${t.id}">${esc(t.producto)}</button>`).join('')}</div>`:'';
}
function recientesTareas(){
  const vistos=new Set(), l=[]; [...D.tareas].sort((a,b)=>(b.created_at||'').localeCompare(a.created_at||'')).forEach(t=>{ const k=t.titulo.toLowerCase(); if(!vistos.has(k)&&l.length<6){ vistos.add(k); l.push(t.titulo); } });
  return l.length?`<div class="chips" style="margin-top:-6px">${l.map(t=>`<button type="button" class="chip" data-rtit="${esc(t)}">${esc(t)}</button>`).join('')}</div>`:'';
}
function campoHtml(c, v, reg){
  const lab = esc(c.l) + (c.req?' *':'');
  const help = c.help?`<span class="mut" style="display:block">${esc(c.help)}</span>`:'';
  switch(c.t){
    case 'html': return (reg&&c.nuevo)?'':c.html;
    case 'bool': return `<label class="chk"><input type="checkbox" name="${c.k}" ${v?'checked':''}> ${lab}</label>`;
    case 'area': return `<label>${lab}<textarea name="${c.k}" rows="2">${esc(v)}</textarea></label>`;
    case 'sel': if(c.ops.length<=8) return campoHtml({...c,t:'chips',ops:c.ops.filter(([val,t])=>t!=='')},v,reg);
      return `<label>${lab}<select name="${c.k}">${c.ops.map(([val,t])=>`<option value="${esc(val)}" ${String(v??'')===String(val)?'selected':''}>${esc(t)}</option>`).join('')}</select>${help}</label>`;
    case 'chips': return `<span class="clab">${lab}</span><div class="chips" data-chips="${c.k}">${c.ops.map(([val,t])=>`<button type="button" class="chip ${String(v??'')===String(val)?'on':''}" data-val="${esc(val)}">${esc(t)}</button>`).join('')}</div><input type="hidden" name="${c.k}" value="${esc(v??'')}">`;
    case 'date': return `<label>${lab}<input type="date" name="${c.k}" value="${esc(v)}" ${c.req?'required':''}></label>${c.q?`<div class="chips" style="margin-top:-6px">${c.q.map(([t,n])=>`<button type="button" class="chip" data-qf="${c.k}" data-n="${n}">${t}</button>`).join('')}</div>`:''}`;
    case 'num': case 'int': case 'coord': return `<label>${lab}<input name="${c.k}" inputmode="decimal" autocomplete="off" class="${c.big?'big':''}" value="${esc(v)}" ${c.req?'required':''}>${help}</label>`;
    default: return `<label>${lab}<input name="${c.k}" autocomplete="off" value="${esc(v)}" ${c.req?'required':''}>${help}</label>`;
  }
}
function activarChips(root){
  root.querySelectorAll('[data-chips]').forEach(g=>{
    const inp=root.querySelector(`input[name="${g.dataset.chips}"]`);
    g.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{ g.querySelectorAll('.chip').forEach(x=>x.classList.remove('on')); b.classList.add('on'); inp.value=b.dataset.val; inp.dispatchEvent(new Event('change')); });
  });
  root.querySelectorAll('[data-qf]').forEach(b=>b.onclick=()=>{ root.querySelector(`input[name="${b.dataset.qf}"]`).value=addDias(hoy(),+b.dataset.n); });
}

    const fb=$(`#frm [data-chips=finca_id] .chip[data-val="${t.finca_id||''}"]`); if(fb) fb.click();

function pn(s,miles=true){ if(s===''||s==null) return null; s=String(s).trim().replace(/\s/g,''); if(s===''){return null;}
  if(s.includes(',')) s=s.replace(/\./g,'').replace(',','.');
  else if(miles && /^-?\d{1,3}(\.\d{3})+$/.test(s)) s=s.replace(/\./g,''); // 1.000 -> 1000
  const n=Number(s); return isNaN(n)?NaN:n; }

async function guardar(k, reg, otro=false){
  const fd = new FormData($('#frm')); const obj={};
  for(const c of S[k].f()){
    if(c.t==='html') continue;
    if(c.t==='bool'){ obj[c.k] = fd.get(c.k)==='on'; continue; }
    let v = fd.get(c.k);
    if(c.t==='num'||c.t==='int'||c.t==='coord'){ v=pn(v,c.t!=='coord'); if(Number.isNaN(v)){ toast(`«${c.l}» no es un número`); return; } if(c.t==='int'&&v!=null) v=Math.round(v); }
    else if(v==='') v=null;
    if(c.req && (v==null)){ toast(`Falta «${c.l}»`); return; }
    obj[c.k]=v;
  }
  if(k==='ingresos' && !/^\d{4}\/\d{2}$/.test(obj.campana)){ toast('Campaña con formato 2026/27'); return; }
  if(k==='tareas') obj.hecha_fecha = obj.hecha ? (reg?.hecha_fecha || hoy()) : null;
  if(k==='jornales'||k==='servicios'||k==='riego_pagos') obj.pagado_fecha = obj.pagado ? (reg?.pagado_fecha || hoy()) : null;
  if(k==='jornales'){ const t=D.trabajadores.find(x=>x.id===obj.trabajador_id); obj.empresa_id = t&&t.empresa_id&&empresa(t.empresa_id) ? t.empresa_id : null; }
  document.querySelectorAll('#fOk,#fOtro').forEach(b=>b.disabled=true);
  if(k==='dias_perdidos'){ obj.coste=obj.coste||0; if(obj.hora_seco!=null) obj.hora_seco=Number(obj.hora_seco); await fotoTiempo(obj); }
  let error, offline=false;
  if(reg) ({error} = await sb.from('olv_'+k).update(obj).eq('id',reg.id));
  else { const r=await insertar(k,obj); error=r.error; offline=r.offline; }
  if(error){ document.querySelectorAll('#fOk,#fOtro').forEach(b=>b.disabled=false); if(!sinRed(error)) toast('Error: '+error.message); return; }
  // recordar últimas elecciones
  if(k==='gastos'){ recordar('g_cat',obj.categoria); recordar('g_finca',obj.finca_id||''); }
  if(k==='ingresos') recordar('i_finca',obj.finca_id||'');
  if(k==='tratamientos') recordar('t_finca',obj.finca_id||'');
  // efectos secundarios
  if(k==='tratamientos' && !reg && obj.repetir_dias>0){
    await insertar('tareas',{titulo:`Repetir tratamiento: ${obj.producto}`, tipo:'Curar / tratamiento', fecha:addDias(obj.fecha,obj.repetir_dias), finca_id:obj.finca_id});
    await cargar('tareas');
  }
  if(k==='tareas' && obj.hecha && !reg?.hecha && obj.repetir_dias>0) await repetirTarea({...reg,...obj});
  $('#dlg').close(); if(!offline) await cargar(k); if(['gastos','ingresos','jornales','servicios'].includes(k)) pintarCampanas(); render();
  toast((k==='gastos'&&!reg ? `Gasto de ${eur(obj.importe)} guardado` : 'Guardado') + (offline?' en el móvil (se subirá al tener cobertura)':''));
  if(otro) abrir(k);
}
const USOS={
  fincas:id=>['gastos','ingresos','jornales','servicios','tratamientos','facturas','dias_perdidos','riego_pagos'].reduce((n,t)=>n+D[t].filter(r=>r.finca_id===id).length,0),
  trabajadores:id=>D.jornales.filter(j=>j.trabajador_id===id).length,
  comunidades:id=>D.fincas.filter(f=>f.comunidad_id===id).length+D.riego_pagos.filter(r=>r.comunidad_id===id).length,
  empresas:id=>D.jornales.filter(j=>j.empresa_id===id).length+D.servicios.filter(x=>x.empresa_id===id).length+D.trabajadores.filter(t=>t.empresa_id===id).length,
};
async function fotoTiempo(obj){
  const f=D.fincas.find(x=>x.id===obj.finca_id); if(!f||f.lat==null||!navigator.onLine) return;
  try{
    const atras=Math.min(92, Math.max(1, difDias(obj.fecha,hoy())+1));
    const w=await getMeteo(f, atras); const H=horas(w);
    obj.meteo=H.filter(x=>x.fecha===obj.fecha&&x.h<=20).map(({h,t,hr,td,p,v,nub})=>({h,t,hr,td,p,v,nub}));
    const s=horaSeco(H,obj.fecha,0);
    if(s) obj.pred_seco = !s.mojada ? 7 : (s.base==null ? 20 : s.base);
  }catch(e){}
}
async function borrar(k,id){
  if(COLA.some(i=>i.filas.some(f=>f.id===id))){ toast('Este apunte aún no se ha subido; espera a tener cobertura'); return; }
  const n = USOS[k] ? USOS[k](id) : 0;
  if(n){ toast(`Tiene ${n} apuntes. Desmarca «${k==='trabajadores'?'Activo':'Activa'}» en vez de borrar, así no se descuadran las cuentas.`); return; }
  if(!confirm('¿Borrar este registro?')) return;
  const {error} = await sb.from('olv_'+k).delete().eq('id',id);
  if(error){ if(!sinRed(error)) toast(error.code==='23503'?'Tiene apuntes asociados: desactívalo en vez de borrarlo.':'Error: '+error.message); return; }
  $('#dlg').close(); await cargar(k); render(); toast('Borrado');
}

async function marcarHecha(id){

// ===== Cálculo de la campaña =====
function calcular(c){
  const [ini,fin] = campRango(c);
  const fincas = D.fincas.filter(f=>f.activa); // las que reparten lo común
  const totOl = fincas.reduce((s,f)=>s+(f.olivos||0),0);
  const cuota = f => totOl ? (f.olivos||0)/totOl : (fincas.length?1/fincas.length:0);
  const R = {}; D.fincas.forEach(f=>R[f.id]={f, directo:0, comun:0, ingD:0, ingC:0, kilos:0});
  const gastos = D.gastos.filter(g=>g.fecha>=ini && g.fecha<=fin);
  // amortizaciones
  const a0=parseInt(c); const amort=[];
  D.maquinas.forEach(m=>{
    if(!(m.precio_compra>0 && m.anos_amortizacion>0 && m.fecha_compra)) return;
    const ac=parseInt(campDe(m.fecha_compra));
    if(a0>=ac && a0<ac+m.anos_amortizacion) amort.push({categoria:'Amortización maquinaria', concepto:m.nombre, importe:m.precio_compra/m.anos_amortizacion, finca_id:null});
  });
  const jorn=[...D.jornales.filter(j=>j.fecha>=ini && j.fecha<=fin).map(j=>({categoria:j.empresa_id?'Empresas de servicios':'Jornales', importe:j.importe, finca_id:j.finca_id})),
    ...D.servicios.filter(x=>x.fecha>=ini && x.fecha<=fin).map(x=>({categoria:'Empresas de servicios', importe:x.importe, finca_id:x.finca_id})),
    ...D.dias_perdidos.filter(x=>x.fecha>=ini && x.fecha<=fin && Number(x.coste)>0).map(x=>({categoria:'Días perdidos', importe:x.coste, finca_id:x.finca_id})),
    ...D.riego_pagos.filter(x=>x.fecha>=ini && x.fecha<=fin).map(x=>{ if(x.finca_id) return {categoria:'Riego', importe:x.importe, finca_id:x.finca_id};
      const fs=fincasDe(x.comunidad_id), tot=fs.reduce((a,f)=>a+olivosRiego(f),0);
      return {categoria:'Riego', importe:x.importe, finca_id:null, reparto: tot ? fs.map(f=>[f.id, olivosRiego(f)/tot]) : null}; })];
  const todos=[...gastos,...amort,...jorn];
  const porCat={}; let comunTot=0, totG=0;
  todos.forEach(g=>{
    const imp=Number(g.importe)||0; totG+=imp;
    porCat[g.categoria]=(porCat[g.categoria]||0)+imp;
    if(g.reparto) g.reparto.forEach(([fid,q])=>{ if(R[fid]) R[fid].directo+=imp*q; });
    else if(g.finca_id && R[g.finca_id]) R[g.finca_id].directo+=imp;
    else { comunTot+=imp; fincas.forEach(f=>R[f.id].comun+=imp*cuota(f)); }
  });
  const ingresos=D.ingresos.filter(i=>i.campana===c);
  let totI=0, kilos=0, ingC=0;
  ingresos.forEach(i=>{
    const imp=Number(i.importe)||0; totI+=imp; kilos+=Number(i.kilos)||0;
    if(i.finca_id && R[i.finca_id]){ R[i.finca_id].ingD+=imp; R[i.finca_id].kilos+=Number(i.kilos)||0; }
    else { ingC+=imp; fincas.forEach(f=>R[f.id].ingC+=imp*cuota(f)); }
  });
  const visibles = D.fincas.filter(f=>f.activa || R[f.id].directo || R[f.id].ingD);
  return {totG,totI,kilos,comunTot,ingC,porCat,R,fincas:visibles,totOl,amort,nG:gastos.length,nI:ingresos.length};
}

// ===== Avisos =====
function avisos(){
  const h=hoy(), u=AJ.umb, out=[];
  D.tareas.filter(t=>!t.hecha).forEach(t=>{
    const d=difDias(h,t.fecha);
    if(d<0) out.push({c:'bad',t:`Tarea atrasada ${-d} día(s): <b>${esc(t.titulo)}</b> · ${esc(fincaNom(t.finca_id))}`,id:t.id,ord:d});
    else if(d<=u.aviso_dias) out.push({c:'',t:`${d===0?'Hoy':d===1?'Mañana':'En '+d+' días'}: <b>${esc(t.titulo)}</b>${t.finca_id?' · '+esc(fincaNom(t.finca_id)):''}`,id:t.id,ord:d});
    const ult=out[out.length-1]; if(ult&&ult.id===t.id) ult.t=`<div class="row" style="flex-wrap:nowrap"><span style="flex:1">${ult.t}</span><button class="btn sec sm" data-hecha="${t.id}">Hecha</button></div>`;
  });
  D.maquinas.filter(m=>m.activa).forEach(m=>{
    [['itv_proxima','ITV'],['seguro_vence','Seguro']].forEach(([k,n])=>{
      if(!m[k]) return; const d=difDias(h,m[k]);
      if(d<0) out.push({c:'bad',t:`${n} de <b>${esc(m.nombre)}</b> caducada desde el ${fFecha(m[k])}`,ord:d,maq:m.id});
      else if(d<=u.itv_dias) out.push({c:d<=7?'bad':'',t:`${n} de <b>${esc(m.nombre)}</b> el ${fFecha(m[k])} (${d} días)`,ord:d,maq:m.id});
    });
  });
  D.tratamientos.forEach(t=>{
    if(!t.plazo_seguridad_dias) return; const fin=addDias(t.fecha,t.plazo_seguridad_dias); const d=difDias(h,fin);
    if(d>0) out.push({c:'bad',t:`No recoger en <b>${esc(fincaNom(t.finca_id))}</b> hasta el ${fFecha(fin)} (plazo de seguridad de ${esc(t.producto)})`,ord:-100});
  });
  D.riego_pagos.filter(r=>!r.pagado&&r.vencimiento).forEach(r=>{ const d=difDias(h,r.vencimiento);
    if(d<0) out.push({c:'bad',t:`Recibo de riego vencido: <b>${esc(r.concepto)} ${esc(comNom(r.comunidad_id))}</b> ${eur(r.importe)} (venció el ${fFecha(r.vencimiento)})`,ord:d,riego:1});
    else if(d<=u.itv_dias) out.push({c:d<=7?'bad':'',t:`Riego: <b>${esc(r.concepto)} ${esc(comNom(r.comunidad_id))}</b> ${eur(r.importe)} vence el ${fFecha(r.vencimiento)}`,ord:d,riego:1}); });
  const deb=Object.values(pendientes()).reduce((a,b)=>a+b,0);
  if(deb>0) out.push({c:'',t:`Debes <b>${eur(deb)}</b> a trabajadores${D.empresas.length?' y empresas':''}`,ord:50,go:'jornales'});
  return out.sort((a,b)=>a.ord-b.ord);
}

// ===== Jornales y empresas =====
const FORMAS={jornal:'por jornal',hora:'por hora',kilo:'por kilo'};
function empresa(id){ return D.empresas.find(e=>e.id===id); }
function empNom(id){ const e=empresa(id); return e?e.nombre:'(borrada)'; }
function conIva(v,e){ return v*(1+(Number(e.iva_pct)||0)/100); }
function importeJornal(t,h){
  let v;
  const e = t.empresa_id && empresa(t.empresa_id);
  if(e){ v = e.forma_cobro==='hora' ? h*e.precio : e.forma_cobro==='jornal' ? e.precio*h/(Number(e.horas_jornada)||6.5) : 0; v=conIva(v,e); }
  else v = t.precio_hora ? h*t.precio_hora : (t.precio_dia||0)*h/(Number(t.horas_jornada)||6.5);

async function pagar(clave){

async function prepararArchivo(file){
  if(file.type==='application/pdf'){ if(file.size>9.5e6) throw new Error('El PDF pasa de 10 MB'); return {blob:file, mime:'application/pdf'}; }
  const img=await createImageBitmap(file);
  const k=Math.min(1, 2000/Math.max(img.width,img.height));
  const cv=document.createElement('canvas'); cv.width=Math.round(img.width*k); cv.height=Math.round(img.height*k);
  cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
  const blob=await new Promise(r=>cv.toBlob(r,'image/jpeg',0.82));
  return {blob, mime:'image/jpeg'};
}

    <span class="clab">Finca</span><div class="chips" data-chips="finca_id">${opsFincas().map(([v,t])=>`<button type="button" class="chip ${String(v)===String(fincaDef)?'on':''}" data-val="${esc(v)}">${esc(t)}</button>`).join('')}</div><input type="hidden" name="finca_id" value="${esc(fincaDef)}">
    <span class="clab">Productos (${L.length})</span><div id="fLin">${L.map(lin).join('')}</div>
    <div id="fSinLin" class="${L.length?'hidden':''}"><label>Categoría<select name="k_unica">${cats.map(c=>`<option>${esc(c)}</option>`).join('')}</select></label></div>
    <details class="adv"><summary>Más detalles</summary><div class="grid2"><label>Nº factura<input name="numero" value="${esc(d.numero||'')}"></label><label>CIF<input name="cif" value="${esc(d.cif||'')}"></label><label>Base imponible<input name="base" inputmode="decimal" value="${fmt(d.base)}"></label><label>IVA<input name="iva" inputmode="decimal" value="${fmt(d.iva)}"></label></div></details>
    <p id="fRes" class="mut"></p>
    <div class="row acciones" style="justify-content:flex-end"><button type="button" class="btn sec" id="fCancel">Cancelar</button><button class="btn" id="fOk">Guardar</button></div>`;
  const F=$('#frm'); activarChips(F);
  const vivas=()=>[...F.querySelectorAll('[data-l]')].map(el=>+el.dataset.l);
  const reparto=()=>{
    const tot=n2(F.total.value)||0; const ids=vivas();
    if(!ids.length) return [{categoria:F.k_unica.value, importe:tot}];
    const porCat={}; let suma=0;
    ids.forEach(i=>{ const imp=n2(F[`i_${i}`].value)||0; suma+=imp; porCat[F[`k_${i}`].value]=(porCat[F[`k_${i}`].value]||0)+imp; });
    const ent=Object.entries(porCat); if(!suma) return [{categoria:ent[0][0], importe:tot}];
    const out=ent.map(([c,v])=>({categoria:c, importe:Math.round(tot*v/suma*100)/100}));
    const dif=Math.round((tot-out.reduce((a,x)=>a+x.importe,0))*100)/100; out[0].importe=Math.round((out[0].importe+dif)*100)/100; // cuadrar céntimos
    return out;
  };
  const resumen=()=>{ $('#fSinLin').classList.toggle('hidden',vivas().length>0); const r=reparto(); $('#fRes').innerHTML='Se apunta como gasto: '+r.map(x=>`<b>${esc(x.categoria)}</b> ${eur(x.importe)}`).join(' · ')+'<br><span class="mut">El IVA va incluido en el coste (en el régimen especial agrario no se recupera).</span>'; };
  F.querySelectorAll('[data-quitar]').forEach(b=>b.onclick=()=>{ b.closest('[data-l]').remove(); resumen(); });
  F.oninput=resumen; F.onchange=resumen; resumen();
  $('#fCancel').onclick=()=>$('#dlg').close();
  F.onsubmit=async e=>{
    e.preventDefault();
    const total=n2(F.total.value); if(!(total>0)){ toast('Pon el total de la factura'); return; }
    $('#fOk').disabled=true; $('#fOk').textContent='Guardando…';
    try{
      const {data:{user}}=await sb.auth.getUser();
      const id=nuevoId(); const path=`${user.id}/${id}.${mime==='application/pdf'?'pdf':'jpg'}`;
      const up=await sb.storage.from('olv-facturas').upload(path, blob, {contentType:mime});
      if(up.error) throw new Error('No se pudo subir la foto: '+up.error.message);
      const fecha=F.fecha.value||hoy(), finca=F.finca_id.value||null, prov=F.proveedor.value.trim()||null, numero=F.numero.value.trim()||null;
      let r=await sb.from('olv_facturas').insert({id, fecha, proveedor:prov, cif:F.cif.value.trim()||null, numero, base:n2(F.base.value), iva:n2(F.iva.value), total, finca_id:finca, foto_path:path, leida_por:ia});
      if(r.error){ await sb.storage.from('olv-facturas').remove([path]); throw r.error; }
      const lineas=vivas().map(i=>{ const orig=L[i]||{}; return {factura_id:id, producto:F[`p_${i}`].value.trim()||'(sin nombre)', nombre_comun:orig.nombre_comun||null, cantidad:n2(F[`c_${i}`].value), unidad:orig.unidad||null, precio_unitario:n2(F[`u_${i}`].value), descuento_pct:orig.descuento_pct??null, iva_pct:orig.iva_pct??null, importe:n2(F[`i_${i}`].value), categoria:F[`k_${i}`].value}; });
      if(lineas.length) r=await sb.from('olv_factura_lineas').insert(lineas);
      if(!r.error) r=await sb.from('olv_gastos').insert(reparto().map(x=>({fecha, categoria:x.categoria, importe:x.importe, concepto:`Factura ${prov||''}${numero?' nº '+numero:''}`.trim(), proveedor:prov, finca_id:finca, factura_id:id})));
      if(r.error){ await sb.from('olv_facturas').delete().eq('id',id); await sb.storage.from('olv-facturas').remove([path]); throw r.error; }
      recordar('f_finca',F.finca_id.value);
      $('#dlg').close(); await Promise.all(['facturas','factura_lineas','gastos'].map(cargar)); pintarCampanas(); render();
      toast(`Factura de ${eur(total)} guardada`);
    }catch(err){ $('#fOk').disabled=false; $('#fOk').textContent='Guardar'; toast(esRed(err)?'Sin cobertura: inténtalo cuando tengas señal':'Error: '+err.message); }
  };
}
async function verFactura(id){
  const f=D.facturas.find(x=>x.id===id); if(!f) return;

  $('#frm').innerHTML=`<h3>${esc(f.proveedor||'Factura')}</h3><p class="mut">${fFecha(f.fecha)}${f.numero?' · nº '+esc(f.numero):''} · <b>${eur(f.total)}</b> · ${esc(fincaNom(f.finca_id))}</p>
    <div id="fFoto" class="mut">Cargando foto…</div>
    ${ls.length?`<table style="margin-top:8px">${ls.map(l=>`<tr><td>${esc(l.producto)}<div class="mut">${esc(l.categoria||'')}</div></td><td class="n">${l.cantidad!=null?num(l.cantidad,2)+' '+esc(l.unidad||''):''}<div class="mut">${l.precio_unitario!=null?eur(l.precio_unitario)+'/ud':''}</div></td><td class="n">${eur(l.importe)}</td></tr>`).join('')}</table>`:''}

    <div class="row acciones" style="justify-content:space-between"><button type="button" class="btn del" id="fBorrar">Borrar factura</button><button type="button" class="btn" onclick="$('#dlg').close()">Cerrar</button></div>`;
  $('#dlg').showModal();
  $('#fBorrar').onclick=async()=>{
    if(!confirm('¿Borrar la factura, su foto y los gastos que se apuntaron con ella?')) return;
    const {error}=await sb.from('olv_facturas').delete().eq('id',id);
    if(error){ if(!sinRed(error)) toast('Error: '+error.message); return; }

function precioUd(l){ return l.precio_unitario!=null ? Number(l.precio_unitario) : (l.cantidad ? Number(l.importe)/Number(l.cantidad) : null); }

    .sort((a,b)=>b.ult.fecha.localeCompare(a.ult.fecha));

    :`<p class="mut">${D.factura_lineas.length?'Nada coincide con la búsqueda.':'Cuando escanees facturas, aquí verás lo que pagas por cada producto y dónde sale más barato.'}</p>`}</div>`;

// ===== Riego =====
function comNom(id){ const c=D.comunidades.find(x=>x.id===id); return c?c.nombre:'(borrada)'; }
function olivosRiego(f){ return Number(f.olivos_riego!=null?f.olivos_riego:f.olivos)||0; }
function fincasDe(cid){ return D.fincas.filter(f=>f.activa&&f.riego&&f.comunidad_id===cid); }
function cuotaEstimada(c){ return Math.round(fincasDe(c.id).reduce((a,f)=>a+olivosRiego(f),0)*Number(c.cuota_olivo)*100)/100; }
async function pagarRecibo(id){
  const {error}=await sb.from('olv_riego_pagos').update({pagado:true,pagado_fecha:hoy()}).eq('id',id);
  if(error){ if(!sinRed(error)) toast('Error: '+error.message); return; }
  await cargar('riego_pagos'); render();
  toast('Recibo pagado', async()=>{ await sb.from('olv_riego_pagos').update({pagado:false,pagado_fecha:null}).eq('id',id); await cargar('riego_pagos'); render(); });
}
function vRiego(){
  const [ini,fin]=campRango(CAMP);
  const rec=D.riego_pagos.filter(r=>r.fecha>=ini&&r.fecha<=fin);
  const pend=D.riego_pagos.filter(r=>!r.pagado);
  const fr=D.fincas.filter(f=>f.riego);
  const costeFinca=f=>{ let t=0; rec.forEach(r=>{ if(r.finca_id) { if(r.finca_id===f.id) t+=Number(r.importe); return; } const fs=fincasDe(r.comunidad_id); const tot=fs.reduce((a,x)=>a+olivosRiego(x),0); if(tot&&fs.includes(f)) t+=Number(r.importe)*olivosRiego(f)/tot; }); return t; };
  return `<div class="card"><h2>Comunidades de regantes<span class="sp"></span><button class="btn sec sm" onclick="abrir('comunidades')">+ Comunidad</button></h2>
    ${D.comunidades.length?`<table>${D.comunidades.map(c=>{ const fs=fincasDe(c.id); const ol=fs.reduce((a,f)=>a+olivosRiego(f),0); const yaCuota=rec.some(r=>r.comunidad_id===c.id&&r.concepto==='Cuota');
      return `<tr><td class="click" data-ed="comunidades:${c.id}">${esc(c.nombre)}${c.activa?'':' <span class="tag">baja</span>'}<div class="mut">${eur(c.cuota_olivo)}/olivo · ${num(ol)} olivos en ${fs.length} ${fs.length===1?'finca':'fincas'}</div></td><td class="n">${eur(cuotaEstimada(c))}<div class="mut">al año</div></td><td class="n">${yaCuota?'<span class="pos" style="font-size:13px">cuota apuntada</span>':`<button class="btn sm" onclick="abrir('riego_pagos',null,{comunidad_id:'${c.id}',concepto:'Cuota',importe:${cuotaEstimada(c)}})">Apuntar cuota</button>`}</td></tr>`; }).join('')}</table>`:'<p class="mut">Da de alta la comunidad de regantes con lo que cobra por olivo, y luego marca en cada finca que tiene riego.</p>'}</div>
  <div class="card"><h2>Recibos ${esc(CAMP)}<span class="sp"></span><button class="btn sec sm" onclick="abrir('riego_pagos')">+ Recibo</button></h2>
    ${pend.length?`<p class="mut">Pendiente de pagar: <b class="neg">${eur(pend.reduce((a,r)=>a+Number(r.importe),0))}</b></p>`:''}
    ${rec.length?`<table>${rec.map(r=>{ const v=r.vencimiento&&!r.pagado?difDias(hoy(),r.vencimiento):null;
      return `<tr class="click" data-ed="riego_pagos:${r.id}"><td>${esc(r.concepto)} · ${esc(comNom(r.comunidad_id))}<div class="mut">${fFecha(r.fecha)}${r.finca_id?' · '+esc(fincaNom(r.finca_id)):''}${r.vencimiento?` · vence ${fFecha(r.vencimiento)}`:''}</div></td><td class="n">${eur(r.importe)}</td><td class="n">${r.pagado?'<span class="pos" style="font-size:13px">pagado</span>':`<button class="btn sm ${v!=null&&v<0?'del':''}" data-hecha-no onclick="event.stopPropagation();pagarRecibo('${r.id}')">Pagar</button>`}</td></tr>`; }).join('')}</table>`:'<p class="mut">Sin recibos en esta campaña.</p>'}</div>
  <div class="card"><h2>Fincas con riego</h2>${fr.length?`<table><tr><th>Finca</th><th class="n">Olivos de riego</th><th class="n">Coste ${esc(CAMP)}</th></tr>${fr.map(f=>{ const c=costeFinca(f); const o=olivosRiego(f); return `<tr class="click" data-ed="fincas:${f.id}"><td>${esc(f.nombre)}<div class="mut">${f.comunidad_id?esc(comNom(f.comunidad_id)):'sin comunidad'}</div></td><td class="n">${num(o)}</td><td class="n">${eur(c)}<div class="mut">${o?eur(c/o)+'/olivo':''}</div></td></tr>`; }).join('')}</table>`:'<p class="mut">Ninguna finca tiene marcado el riego. Entra en la finca y marca «Tiene riego».</p>'}</div>`;
}

// ===== Tiempo =====
const WCODE = c => c===0?'Despejado':c<=2?'Poco nuboso':c===3?'Nublado':c<=48?'Niebla':c<=57?'Llovizna':c<=67?'Lluvia':c<=77?'Nieve':c<=82?'Chubascos':c<=86?'Nieve':'Tormenta';

async function getMeteo(f, pasados=1){
  const key=f.lat+','+f.lon+'|'+pasados; let w=METEO_CACHE[key];
  if(w && Date.now()-w._t<30*60e3) return w;
  const url=`https://api.open-meteo.com/v1/forecast?latitude=${f.lat}&longitude=${f.lon}&hourly=temperature_2m,relative_humidity_2m,dew_point_2m,precipitation,precipitation_probability,wind_speed_10m,wind_gusts_10m,cloud_cover&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_sum,precipitation_probability_max,wind_gusts_10m_max&timezone=Europe%2FMadrid&past_days=${pasados}&forecast_days=7`;
  const r=await fetch(url); if(!r.ok) throw new Error('error '+r.status);

}
function horas(w){ const H=w.hourly; return H.time.map((t,i)=>({fecha:t.slice(0,10),h:+t.slice(11,13),t:H.temperature_2m[i],hr:H.relative_humidity_2m[i],td:H.dew_point_2m?.[i],p:H.precipitation[i]||0,pp:H.precipitation_probability?.[i]??0,v:H.wind_speed_10m[i],r:H.wind_gusts_10m?.[i],nub:H.cloud_cover?.[i]})); }

function mojado(x,hr){ const u=AJ.umb; const lim=hr??u.moj_hr; return x.p>0.1 || x.hr>=lim || (x.td!=null && x.t-x.td<=u.moj_dif); }
// Hora estimada a la que la oliva está seca ese día. {mojada:false} si amanece seca; seco:null si no se seca antes de las 19 h
// Horas en que el olivo está seco (se puede trabajar debajo sin mojarse), con el retraso propio de la finca
function horasSecas(H, fecha, finca){

    const k=(ll12>=1?u.seco_horas_lluvia:u.seco_horas)+ret;
    seca[h] = i-k+1>=0 && H.slice(i-k+1,i+1).every(x=>!mojado(x,hr));

function tramos(seca,de,a){ const out=[]; let ini=null; for(let h=de;h<=a+1;h++){ const s=h<=a&&seca[h]; if(s&&ini==null) ini=h; if(!s&&ini!=null){ out.push([ini,h]); ini=null; } } return out; }
function horaSeco(H, fecha, retraso=0, hr=null){
  const moj=x=>mojado(x,hr);
  const u=AJ.umb; const i0=H.findIndex(x=>x.fecha===fecha&&x.h===0); if(i0<0) return null;
  const at=h=>H[i0+h];
  const lluviaNoche=H.slice(Math.max(0,i0-4),i0+8).reduce((s,x)=>s+x.p,0);
  const mananaMojada=[4,5,6,7,8].some(h=>at(h)&&moj(at(h))) || lluviaNoche>0.2;
  if(!mananaMojada) return {mojada:false};
  for(let h=7;h<=19;h++){
    const i=i0+h; if(!H[i]) break;
    const ll12=H.slice(Math.max(0,i-12),i).reduce((s,x)=>s+x.p,0);
    const k = ll12>=1 ? u.seco_horas_lluvia : u.seco_horas;
    if(i-k+1>=0 && H.slice(i-k+1,i+1).every(x=>!moj(x))){ const s=h+Number(retraso||0); return {mojada:true, seco: s>19?null:s, base:h}; }

const fHora=h=>{ const hh=Math.floor(h), mm=Math.round((h-hh)*60); return mm?`${hh}:${String(mm).padStart(2,'0')} h`:`${hh} h`; };
function evaluarTiempo(w, finca){
  const u=AJ.umb, H=horas(w), Dd=w.daily, out=[];
  Dd.time.forEach((fecha,i)=>{
    if(fecha<hoy()) return;
    const ayer=i>0?(Dd.precipitation_sum[i-1]||0):0;
    const hh=H.filter(x=>x.fecha===fecha);
    const seca=horasSecas(H,fecha,finca)||{};
    // atomizar
    const motivos={viento:0,calma:0,lluvia:0,calor:0,frio:0,seco:0,mojada:0}; let mejor=[],act=[];
    hh.filter(x=>x.h>=6&&x.h<=21).forEach(x=>{
      const idx=H.indexOf(x); const sig=H.slice(idx,idx+u.spray_horas_lluvia+1);
      const lluvia=sig.some(y=>y.p>0||y.pp>=u.spray_pmax);
      let ok=true;
      if(x.v>u.spray_vmax||x.r>u.spray_rmax){ok=false;motivos.viento++;}

      if(x.t>u.spray_tmax){ok=false;motivos.calor++;}
      if(x.t<u.spray_tmin){ok=false;motivos.frio++;}
      if(x.hr<u.spray_hrmin){ok=false;motivos.seco++;}
      if(ok && !seca[x.h]){ok=false;motivos.mojada++;}
      if(ok){act.push(x.h); if(act.length>mejor.length) mejor=act.slice();} else act=[];
    });
    const nomMot={viento:'mucho viento',calma:'viento en calma',lluvia:'lluvia',calor:'calor',frio:'frío',seco:'aire seco',mojada:'hoja mojada'};
    const peor=Object.entries(motivos).sort((a,b)=>b[1]-a[1])[0];
    const spray = mejor.length>=u.spray_min_horas ? {c:'g',txt:`${mejor[0]}–${mejor[mejor.length-1]+1} h`} : mejor.length ? {c:'a',txt:`solo ${mejor[0]}–${mejor[mejor.length-1]+1} h`} : {c:'r',txt:nomMot[peor[0]]};
    // trabajar

    else work={c:'r',txt: ll>=3*u.work_lluvia?`lluvia (${num(ll,1)} mm)`:tmax>u.work_tmax?`calor (${num(tmax)}°)`:'viento fuerte'};

    else if(primera>u.ace_verde_hora) olivo={c:'a',txt:`mojado hasta las ${primera} h`};
    else if(nSec<8) olivo={c:'a',txt:`seco de ${largo[0]} a ${largo[1]} h`};
    if(olivo && (work.c==='g' || (work.c==='a' && olivo.c==='r'))) work=olivo;
    // aceituna: lo mismo que trabajar en el olivo, más el barro

    else if(ayer>=u.ace_lluvia_ayer) ace={c:'a',txt:`suelo húmedo (${num(ayer,1)} mm ayer)`};
    else ace={c:work.c, txt:work.c==='g'&&primera>8?`bien desde las ${primera} h`:work.txt};
    if(work.c==='g'&&primera>8) work={c:'g',txt:`bien desde las ${primera} h`};
    const [y,m,d]=fecha.split('-').map(Number);
    out.push({fecha,nombre:fecha===hoy()?'Hoy':DIAS[new Date(y,m-1,d).getDay()],code:Dd.weather_code[i],tmin:Dd.temperature_2m_min[i],tmax:Dd.temperature_2m_max[i],lluvia:Dd.precipitation_sum[i]||0,rafaga:Dd.wind_gusts_10m_max[i],spray,work,ace,sec});

}

// Ajuste por finca con los días perdidos apuntados: con qué humedad se moja y cuánto tarda en secarse
function calibrar(fid){
  const u=AJ.umb;

    .map(x=>({real:Number(x.hora_seco), H:x.meteo.map(m=>({...m,fecha:x.fecha,p:m.p||0})), fecha:x.fecha}));
  if(R.length<2) return null;
  // 1) días que la app daba por secos: la finca se moja con menos humedad
  let umbral=u.moj_hr;
  R.forEach(r=>{ const s=horaSeco(r.H,r.fecha,0,u.moj_hr); if(s&&!s.mojada){ const mx=Math.max(...r.H.filter(m=>m.h>=4&&m.h<=9).map(m=>m.hr)); umbral=Math.min(umbral, Math.floor(mx)-1); } });

  const dif=R.map(r=>{ const s=horaSeco(r.H,r.fecha,0,umbral); return s&&s.mojada&&s.base!=null ? r.real-s.base : null; }).filter(v=>v!=null).sort((a,b)=>a-b);

      <td><span class="dot ${d.spray.c}"></span>${esc(d.spray.txt)}</td><td><span class="dot ${d.work.c}"></span>${esc(d.work.txt)}</td><td><span class="dot ${d.ace.c}"></span>${esc(d.ace.txt)}</td></tr>`).join('')}
  </table></div>
  <p class="mut">«Trabajar en el olivo» (pestugar, desvaretar, desbrozar, podar) y «Aceituna» tienen en cuenta si el olivo está mojado por lluvia, rocío o niebla. Atomizar evita las horas con la hoja mojada. ${f.umbral_hr!=null||Number(f.retraso_secado_h)?`Ajustes de ${esc(f.nombre)}: ${f.umbral_hr!=null?`se moja desde ${num(f.umbral_hr)} % de humedad`:''}${f.umbral_hr!=null&&Number(f.retraso_secado_h)?' y ':''}${Number(f.retraso_secado_h)?`${num(f.retraso_secado_h,1)} h más de secado`:''}.`:''} Es una estimación: apunta los días que no se pueda trabajar y la app se irá ajustando a esta finca.</p>
  ${cambia?`<div class="aviso">Según ${cal.n} días apuntados, en <b>${esc(f.nombre)}</b> ${cal.umbral!=null?`la oliva se moja ya con ${num(cal.umbral)} % de humedad (en general ${num(AJ.umb.moj_hr)} %)`:'la humedad a la que se moja es la normal'}${cal.retraso?` y tarda ${cal.retraso>0?num(cal.retraso,1)+' h más':num(-cal.retraso,1)+' h menos'} en secarse`:''}. <button class="btn sm" onclick="aplicarAjuste('${f.id}',${cal.umbral??'null'},${cal.retraso})">Aplicar</button></div>`:''}
  <p class="mut">Pulsa un día para verlo hora a hora. Los criterios se cambian en Más → Ajustes.</p></div>
  ${sel?horario(w,sel):''}`;
}
let FINCA_H=null;
function horario(w,fecha){
  FINCA_H=D.fincas.find(x=>x.id===SUB.tiempo);
  const seca=horasSecas(horas(w),fecha,FINCA_H)||{};
  const hh=horas(w).filter(x=>x.fecha===fecha&&x.h>=5&&x.h<=21);
  return `<div class="card"><h2>${fFecha(fecha)} hora a hora</h2><div class="scroll"><table><tr><th>Hora</th><th>Olivo</th><th class="n">Temp.</th><th class="n">Humedad</th><th class="n">Viento</th><th class="n">Lluvia</th></tr>
  ${hh.map(x=>`<tr><td>${x.h}:00</td><td>${seca[x.h]?'<span class="dot g"></span>seco':'<span class="dot a"></span>mojado'}</td><td class="n">${num(x.t)}°</td><td class="n">${num(x.hr)} %</td><td class="n">${num(x.v)} km/h<div class="mut">ráf. ${num(x.r)}</div></td><td class="n">${x.p?num(x.p,1)+' mm':''} <span class="mut">${num(x.pp)} %</span></td></tr>`).join('')}</table></div>
</div>`;
}
// Avisos de oliva mojada en Inicio (hoy si es por la mañana, y mañana)
async function postInicio(){
  const box=$('#avMeteo'); if(!box) return;
  const fincas=D.fincas.filter(f=>f.activa&&f.lat!=null&&f.lon!=null).slice(0,6);
  const hora=new Date().getHours(); const dias=[...(hora<12?[hoy()]:[]), addDias(hoy(),1)];
  const msgs=[];
  await Promise.all(fincas.map(async f=>{ try{
    const ev=evaluarTiempo(await getMeteo(f),f);
    dias.forEach(fe=>{ const d=ev.find(x=>x.fecha===fe); if(!d) return; const m=d.work.c!=='g'?d.work:d.ace; if(m.c!=='g') msgs.push({c:m.c==='r'?'bad':'', t:`${fe===hoy()?'Hoy':'Mañana'} en <b>${esc(f.nombre)}</b>: ${esc(m.txt)}${m===d.ace?' (aceituna)':''}`, ord:fe, f:f.id, fe}); });
  }catch(e){} }));
  if(!$('#avMeteo')) return;
  $('#avMeteo').innerHTML=msgs.sort((a,b)=>a.ord.localeCompare(b.ord)).map(m=>`<div class="aviso ${m.c}" style="cursor:pointer" onclick="SUB.tiempo='${m.f}';SUB.tDia='${m.fe}';ir('tiempo')">${m.t}</div>`).join('');
}

// ===== Más: fincas, maquinaria, ajustes =====
function vMas(){
  const s=SUB.mas||'fincas';
  fab(s==='fincas'?'fincas':s==='maq'?'maquinas':s==='riego'?'riego_pagos':null);
  const tabs=`<div class="tabs2">${[['fincas','Fincas'],['riego','Riego'],['maq','Vehículos'],['ajustes','Ajustes']].map(([k,t])=>`<button data-sub="mas:${k}" class="${s===k?'on':''}">${t}</button>`).join('')}</div>`;
  if(s==='riego') return tabs+vRiego();
  if(s==='fincas'){
    const tot=D.fincas.filter(f=>f.activa).reduce((a,f)=>a+(f.olivos||0),0);
    return tabs+`<div class="card"><h2>Fincas</h2>${D.fincas.length?`<table><tr><th>Finca</th><th class="n">Olivos</th><th class="n">Ha</th><th class="n">Reparto</th></tr>${D.fincas.map(f=>`<tr class="click" data-ed="fincas:${f.id}"><td>${esc(f.nombre)}${f.activa?'':' <span class="tag">inactiva</span>'}${f.riego?' <span class="tag">riego</span>':''}<div class="mut">${esc(f.municipio||'')}${f.lat!=null?' · con ubicación':' · sin ubicación'}</div></td><td class="n">${num(f.olivos)}</td><td class="n">${f.ha?num(f.ha,2):''}</td><td class="n">${f.activa&&tot?num(f.olivos/tot*100,1)+' %':''}</td></tr>`).join('')}</table>`:'<p class="mut">Pulsa + para añadir tu primera finca.</p>'}</div>`;
  }
  if(s==='maq'){
    const h=hoy();
    const fx=(d)=>{ if(!d) return '<span class="mut">—</span>'; const n=difDias(h,d); return `<span class="dot ${n<0||n<=7?'r':n<=AJ.umb.itv_dias?'a':'g'}"></span>${fFecha(d)}`; };
    return tabs+`<div class="card"><h2>Vehículos y máquinas</h2>${D.maquinas.length?`<div class="scroll"><table><tr><th>Nombre</th><th>ITV</th><th>Seguro</th><th class="n">Amort./año</th></tr>${D.maquinas.map(m=>`<tr class="click" data-ed="maquinas:${m.id}"><td>${esc(m.nombre)}${m.activa?'':' <span class="tag">baja</span>'}<div class="mut">${esc(m.tipo||'')}${m.matricula?' · '+esc(m.matricula):''}</div></td><td>${fx(m.itv_proxima)}</td><td>${fx(m.seguro_vence)}</td><td class="n">${m.precio_compra>0&&m.anos_amortizacion>0?eur(m.precio_compra/m.anos_amortizacion):''}</td></tr>`).join('')}</table></div>`:'<p class="mut">Pulsa + para añadir tractor, coche, atomizador…</p>'}
    <p class="mut">Cuando pases la ITV, entra en el vehículo y pon la fecha de la siguiente.</p></div>`;
  }
  const u=AJ.umb;
  const inp=(k,l)=>`<label>${l}<input data-umb="${k}" inputmode="decimal" value="${u[k]}"></label>`;
  return tabs+`<div class="card"><h2>Categorías de gasto</h2><p class="mut">Una por línea.</p><textarea id="ajCats" rows="8">${esc(AJ.cats.join('\n'))}</textarea></div>
  <div class="card"><h2>Ajustes del tiempo</h2>
    <b>Atomizar</b><div class="grid2">${inp('spray_vmin','Viento mínimo (km/h)')}${inp('spray_vmax','Viento máximo (km/h)')}${inp('spray_rmax','Ráfagas máximas (km/h)')}${inp('spray_hrmin','Humedad mínima (%)')}${inp('spray_tmin','Temp. mínima (°)')}${inp('spray_tmax','Temp. máxima (°)')}${inp('spray_horas_lluvia','Horas sin lluvia después')}${inp('spray_pmax','Prob. lluvia máx. (%)')}${inp('spray_min_horas','Horas seguidas para dar verde')}</div>
    <b>Trabajar en el campo</b><div class="grid2">${inp('work_tmax','Temp. máxima (°)')}${inp('work_rmax','Ráfagas máximas (km/h)')}${inp('work_lluvia','Lluvia máx. de 8 a 18 h (mm)')}</div>
    <b>Coger aceituna</b><div class="grid2">${inp('ace_lluvia_ayer','Lluvia del día antes para ámbar (mm)')}${inp('ace_lluvia_ayer_max','… para rojo (mm)')}${inp('ace_verde_hora','Verde si se seca antes de las (h)')}${inp('ace_ambar_hora','Rojo si se seca después de las (h)')}</div>
    <b>Oliva mojada</b><div class="grid2">${inp('moj_hr','Mojada con humedad desde (%)')}${inp('moj_dif','… o temperatura a menos de (°) del rocío')}${inp('seco_horas','Horas sin mojar para darla por seca')}${inp('seco_horas_lluvia','… si llovió en las 12 h antes')}</div>
    <b>Avisos</b><div class="grid2">${inp('aviso_dias','Avisar tareas con (días)')}${inp('itv_dias','Avisar ITV/seguro con (días)')}</div>
    <p class="mut">Valores orientativos: revisa siempre la etiqueta del producto, que manda sobre esto.</p>
  </div>
  <div class="row"><button class="btn" id="ajGuardar">Guardar ajustes</button><button class="btn sec" onclick="copia()">Descargar copia de seguridad</button><button class="btn sec" onclick="salir()">Cerrar sesión</button></div>
  <p class="creditos">Olivas · versión ${VERSION} (${VERSION_FECHA})<br>© 2026 Alfonso Carrascosa Martínez<br>Hecha con Claude, de Anthropic</p>`;
}
function postMas(){
  const b=$('#ajGuardar'); if(!b) return;
  b.onclick=()=>{
    AJ.cats=$('#ajCats').value.split('\n').map(s=>s.trim()).filter(Boolean);
    document.querySelectorAll('[data-umb]').forEach(i=>{ const v=pn(i.value); if(v!=null&&!isNaN(v)) AJ.umb[i.dataset.umb]=v; });
    METEO_CACHE={}; guardarAjustes();
  };
}

// ===== Exportar =====
function bajar(nombre, contenido, tipo){ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([contenido],{type:tipo})); a.download=nombre; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1000); }
function csv(k){
  const [ini,fin]=campRango(CAMP); const sep=';'; const q=v=>`"${String(v??'').replace(/"/g,'""')}"`; const n=v=>v==null?'':String(v).replace('.',',');
  let rows;
  if(k==='gastos') rows=[['Fecha','Categoría','Concepto','Finca','Máquina','Proveedor','Importe','Notas'], ...D.gastos.filter(g=>g.fecha>=ini&&g.fecha<=fin).map(g=>[g.fecha,g.categoria,g.concepto,fincaNom(g.finca_id),maqNom(g.maquina_id),g.proveedor,n(g.importe),g.notas])];
  else if(k==='ingresos') rows=[['Fecha','Campaña','Tipo','Finca','Kilos','Rendimiento %','Precio €/kg','Importe','Notas'], ...D.ingresos.filter(i=>i.campana===CAMP).map(i=>[i.fecha,i.campana,i.tipo,fincaNom(i.finca_id),n(i.kilos),n(i.rendimiento),n(i.precio_kg),n(i.importe),i.notas])];
  else if(k==='jornales') rows=[['Fecha','Trabajador','Empresa','Finca','Faena','Horas','Kilos','Importe','Pagado','Fecha pago'], ...D.jornales.filter(j=>j.fecha>=ini&&j.fecha<=fin).map(j=>[j.fecha,trabNom(j.trabajador_id),j.empresa_id?empNom(j.empresa_id):'',fincaNom(j.finca_id),j.tarea,n(j.horas),'',n(j.importe),j.pagado?'sí':'no',j.pagado_fecha]), ...D.servicios.filter(x=>x.fecha>=ini&&x.fecha<=fin).map(x=>[x.fecha,'',empNom(x.empresa_id),fincaNom(x.finca_id),'Kilos','',n(x.kilos),n(x.importe),x.pagado?'sí':'no',x.pagado_fecha])];
  else rows=[['Fecha','Finca','Producto','Nº registro','Dosis','Plaga/motivo','Superficie ha','Aplicador','Plazo seguridad días','Notas'], ...D.tratamientos.map(t=>[t.fecha,fincaNom(t.finca_id),t.producto,t.num_registro,t.dosis,t.motivo,n(t.superficie_ha),t.aplicador,t.plazo_seguridad_dias,t.notas])];
  bajar(`olivas_${k}_${CAMP.replace('/','-')}.csv`, '﻿'+rows.map(r=>r.map(q).join(sep)).join('\r\n'), 'text/csv;charset=utf-8');
}
function copia(){ bajar(`olivas_copia_${hoy()}.json`, JSON.stringify({version:1, fecha:new Date().toISOString(), ajustes:AJ, datos:D}, null, 1), 'application/json'); }
function ics(){
  const ev=[]; const f=s=>s.replace(/-/g,''); const e=s=>String(s).replace(/[\\;,]/g,m=>'\\'+m).replace(/\n/g,'\\n');
  const add=(uid,fecha,tit,alarmDias)=>ev.push(`BEGIN:VEVENT\r\nUID:${uid}@olivas\r\nDTSTAMP:${new Date().toISOString().replace(/[-:]/g,'').slice(0,15)}Z\r\nDTSTART;VALUE=DATE:${f(fecha)}\r\nDTEND;VALUE=DATE:${f(addDias(fecha,1))}\r\nSUMMARY:${e(tit)}\r\nBEGIN:VALARM\r\nACTION:DISPLAY\r\nDESCRIPTION:${e(tit)}\r\nTRIGGER:-P${alarmDias-1}DT15H\r\nEND:VALARM\r\nEND:VEVENT`);
  D.tareas.filter(t=>!t.hecha&&t.fecha>=hoy()).forEach(t=>add('t'+t.id,t.fecha,`Olivas: ${t.titulo}${t.finca_id?' ('+fincaNom(t.finca_id)+')':''}`,1));
  D.maquinas.filter(m=>m.activa).forEach(m=>{ if(m.itv_proxima>=hoy()) add('i'+m.id,m.itv_proxima,`ITV ${m.nombre}`,14); if(m.seguro_vence>=hoy()) add('s'+m.id,m.seguro_vence,`Seguro ${m.nombre}`,14); });
  if(!ev.length){ toast('No hay nada pendiente que exportar'); return; }
  bajar('olivas_avisos.ics',`BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//Olivas//ES\r\n${ev.join('\r\n')}\r\nEND:VCALENDAR\r\n`,'text/calendar');
}
